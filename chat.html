<script>
const SUPABASE_URL = "https://bmiechymiyedubezhcqk.supabase.co";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,

);

let currentUser = null;
let selectedFriend = null;


/* ==============================
   START CHAT
============================== */

async function startChat() {

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = user;
  setupMessageListener();

  const friendList = document.getElementById("friendList");

  const { data, error } = await supabaseClient
    .from("profiles")
    .select("id, username, full_name")
    .neq("id", user.id)
    .order("username");

  if (error) {

    console.error("Friends error:", error);

    friendList.innerHTML = `
      <div class="friend">
        <div class="friend-name">Unable to load users</div>
        <div class="friend-status">${error.message}</div>
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    friendList.innerHTML = `
      <div class="friend">
        <div class="friend-name">No other users yet</div>
        <div class="friend-status">Invite someone to join</div>
      </div>
    `;

    return;
  }

  friendList.innerHTML = "";

  data.forEach(profile => {

    const friend = document.createElement("div");

    friend.className = "friend";

    friend.innerHTML = `
      <div class="friend-name">
        ${profile.full_name || profile.username || "User"}
      </div>

      <div class="friend-status">
        @${profile.username || "user"}
      </div>
    `;

    /* Make friend clickable */
    friend.addEventListener("click", () => {
      openChat(profile);
    });

    friendList.appendChild(friend);

  });
}


/* ==============================
   OPEN CHAT
============================== */
  async function openChat(friend) {

  selectedFriend = friend;

  const chatHeader = document.querySelector(".chat-header");
  const messages = document.querySelector(".messages");

  chatHeader.innerHTML = `
    <div>
      <h2>💬 ${friend.full_name || friend.username || "User"}</h2>
      <p>@${friend.username || "user"}</p>
    </div>

    <button

      📵

  `;

  messages.innerHTML = `
    <div class="welcome">

  `;

  }

document.addEventListener("click", function (event) {

  /* ==============================
   LOAD VOICE NOTES
============================== */

async function loadVoiceNotes() {

  if (!currentUser || !selectedFriend) return;

  const messagesContainer =
    document.querySelector(".messages");

  const { data, error } = await supabaseClient
    .from("chat_voice_notes")
    .select("id, sender_id, receiver_id, audio_url, created_at")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedFriend.id}),and(sender_id.eq.${selectedFriend.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true });

  if (error) {

    console.error("Voice notes error:", error);

    return;
  }

  if (!data || data.length === 0) {
    return;
  }

  for (const voiceNote of data) {

    const { data: signedData, error: signedError } =
      await supabaseClient.storage
        .from("chat-voice-notes")
        .createSignedUrl(
          voiceNote.audio_url,
          3600
        );

    if (signedError) {

      console.error(
        "Voice note URL error:",
        signedError
      );

      continue;
    }

    const wrapper =
      document.createElement("div");

    const isSent =
      voiceNote.sender_id === currentUser.id;

    wrapper.className =
      `message ${isSent ? "sent" : "received"}`;

    const audioElement =
      document.createElement("audio");

    audioElement.controls = true;
    audioElement.src = signedData.signedUrl;

    wrapper.appendChild(audioElement);

    messagesContainer.appendChild(wrapper);
  }

  scrollToBottom();
  }


/* ==============================
   LOAD MESSAGES
============================== */

async function loadMessages() {

  if (!currentUser || !selectedFriend) return;

  const messagesContainer = document.querySelector(".messages");

  const { data, error } = await supabaseClient
    .from("chat_messages")
    .select("id, sender_id, receiver_id, message, created_at, deleted_for_sender, deleted_for_receiver, deleted_for_everyone")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedFriend.id}),and(sender_id.eq.${selectedFriend.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at", { ascending: true });

  if (error) {

    console.error("Messages error:", error);

    messagesContainer.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">⚠️</div>
        <h2>Unable to load messages</h2>
        <p>${error.message}</p>
      </div>
    `;

    return;
  }

  messagesContainer.innerHTML = "";

  if (!data || data.length === 0) {

    messagesContainer.innerHTML = `
      <div class="welcome">
        <div class="welcome-icon">👋</div>
        <h2>Start the conversation</h2>
        <p>Send your first message.</p>
      </div>
    `;

    return;
  }

  data.forEach(message => {
    displayMessage(message);
  });

  scrollToBottom();
}
/* ==============================
   DISPLAY MASSAGE 
============================== */
function displayMessage(message) {

  const messagesContainer = document.querySelector(".messages");

  const isSent = message.sender_id === currentUser.id;

  // Delete for me
  if (
    (isSent && message.deleted_for_sender) ||
    (!isSent && message.deleted_for_receiver)
  ) {
    return;
  }

  const div = document.createElement("div");

  div.className = `message ${isSent ? "sent" : "received"}`;

  const time = new Date(message.created_at).toLocaleTimeString([], {
    hour: "2-digit",
    minute: "2-digit"
  });

  // Deleted for everyone
  if (message.deleted_for_everyone) {

    div.innerHTML = `
      <div class="message-content deleted-message">
        🚫 This message was deleted
      </div>

      <div class="message-footer">
        <span class="message-time">${time}</span>
      </div>
    `;

    messagesContainer.appendChild(div);
    return;
  }

  // Normal text message
  div.innerHTML = `
    <div class="message-content">
      ${escapeHtml(message.message || "")}
    </div>

    <div class="message-footer">

      <span class="message-time">${time}</span>

      ${
        isSent
          ? `
            <button
              class="delete-message-btn"
              onclick="showDeleteOptions('${message.id}', this)"
              title="Delete message"
            >
              🗑️
            </button>
          `
          : `
            <button
              class="delete-message-btn"
              onclick="deleteForMe('${message.id}', this)"
              title="Delete for me"
            >
              🗑️
            </button>
          `
      }

    </div>
  `;

  messagesContainer.appendChild(div);
}

  function showDeleteOptions(messageId, button) {

  const choice = confirm(
    "Delete this message?\n\n" +
    "OK = Delete for everyone\n" +
    "Cancel = Delete for me"
  );

  if (choice) {
    deleteForEveryone(messageId, button);
  } else {
    deleteForMe(messageId, button);
  }
}


async function deleteForMe(messageId, button) {

  const { data: message, error: fetchError } = await supabaseClient
    .from("chat_messages")
    .select("sender_id, receiver_id")
    .eq("id", messageId)
    .single();

  if (fetchError || !message) {
    alert("Unable to find this message.");
    return;
  }

  const column =
    message.sender_id === currentUser.id
      ? "deleted_for_sender"
      : "deleted_for_receiver";

  const { error } = await supabaseClient
    .from("chat_messages")
    .update({ [column]: true })
    .eq("id", messageId);

  if (error) {
    console.error("Delete for me error:", error);
    alert("Unable to delete message.");
    return;
  }

  const messageElement = button.closest(".message");

  if (messageElement) {
    messageElement.remove();
  }
}


async function deleteForEveryone(messageId, button) {

  if (!confirm("Delete this message for everyone?")) {
    return;
  }

  const { error } = await supabaseClient
    .from("chat_messages")
    .update({
      deleted_for_everyone: true
    })
    .eq("id", messageId)
    .eq("sender_id", currentUser.id);

  if (error) {
    console.error("Delete for everyone error:", error);
    alert("Unable to delete message for everyone.");
    return;
  }

  // Change the message immediately on your screen
  const messageElement = button.closest(".message");

  if (messageElement) {

    const content = messageElement.querySelector(".message-content");

    if (content) {
      content.innerHTML = "🚫 This message was deleted";
      content.classList.add("deleted-message");
    }

    button.remove();
  }
  }

/* ==============================
   SEND MESSAGE
============================== */

document.querySelector(".message-form").addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!currentUser) return;

  if (!selectedFriend) {

    alert("Please select a friend first.");

    return;
  }

  const input = this.querySelector('input[type="text"]');

  const messageText = input.value.trim();

  if (!messageText) return;

  input.disabled = true;

  const { data, error } = await supabaseClient
    .from("chat_messages")
    .insert({
      sender_id: currentUser.id,
      receiver_id: selectedFriend.id,
      message: messageText
    })
    .select()
    .single();

  input.disabled = false;

  if (error) {

    console.error("Send message error:", error);

    alert("Message could not be sent: " + error.message);

    return;
  }

  input.value = "";

  displayMessage(data);

  scrollToBottom();

});


/* ==============================
   SCROLL
============================== */
  // ==============================
// REAL-TIME MESSAGE NOTIFICATIONS
// ==============================

let messageChannel = null;

function setupMessageListener() {
  if (!currentUser) return;

  // Remove previous listener if one exists
  if (messageChannel) {
    supabaseClient.removeChannel(messageChannel);
  }

  messageChannel = supabaseClient
    .channel(`chat-messages-${currentUser.id}`)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "chat_messages",
        filter: `receiver_id=eq.${currentUser.id}`
      },
      (payload) => {
        const message = payload.new;

        // Display the message immediately if
        // you are currently chatting with the sender
        if (
          selectedFriend &&
          message.sender_id === selectedFriend.id
        ) {
          displayMessage(message);
          scrollToBottom();
        }

        // Show notification
        if (
          "Notification" in window &&
          Notification.permission === "granted"
        ) {
          new Notification("New message 💬", {
            body: message.message || "You received a new message."
          });
        }
      }
    )
    .subscribe();

  console.log("Real-time message listener started.");
}

function scrollToBottom() {

  const messagesContainer = document.querySelector(".messages");

  messagesContainer.scrollTop =
    messagesContainer.scrollHeight;
}


/* ==============================
   SECURITY
============================== */

function escapeHtml(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


/* ==============================
   SEARCH FRIENDS
============================== */

document
  .querySelector(".search input")
  .addEventListener("input", function() {

    const searchText = this.value.toLowerCase();

    document
      .querySelectorAll(".friend")

        const name =
          friend.querySelector(".friend-name")
          ?.textContent

          .toLowerCase() || "";

        friend.style.display =
          name.includes(searchText) ||
          username.includes(searchText)
            ? ""
            : "none";

      });

  });

startChat();

  let callPeerConnection = null;
let callChannel = null;
let localCallStream = null;
let remoteAudio = null;
let isInCall = false;
  function getCallChannelTopic() {
  if (!currentUser || !selectedFriend) return null;

  const ids = [currentUser.id, selectedFriend.id].sort();

  return `voice-call-${ids[0]}-${ids[1]}`;
  }
  async function createVoicePeerConnection() {

  callPeerConnection = new RTCPeerConnection({
    iceServers: [
      {
        urls: "stun:stun.l.google.com:19302"
      }
    ]
  });

  callPeerConnection.onicecandidate = (event) => {

    if (event.candidate && callChannel) {

      callChannel.send({
        type: "broadcast",
        event: "ice-candidate",
        payload: {
          candidate: event.candidate
        }
      });

    }

  };

  callPeerConnection.ontrack = (event) => {

    if (!remoteAudio) {

      remoteAudio = document.createElement("audio");

      remoteAudio.autoplay = true;

async function setupVoiceCallListener() {

  if (!currentUser || !selectedFriend) {
    return;
  }

  const topic = getCallChannelTopic();

  if (!topic) {
    return;
  }

  if (callChannel) {
    await supabaseClient.removeChannel(callChannel);
  }

  callChannel = supabaseClient.channel(topic);

  callChannel.on(
    "broadcast",
    { event: "offer" },
    async ({ payload }) => {

      if (!payload || !payload.offer) {
        return;
      }

      if (payload.callerId === currentUser.id) {
        return;
      }

      await handleIncomingVoiceCall(
        payload.offer,
        payload.callerId
      );

    }
  );

  callChannel.on(
    "broadcast",
    { event: "answer" },
    async ({ payload }) => {

      if (!payload || !payload.answer) {
        return;
      }

      if (!callPeerConnection) {
        return;
      }

      await callPeerConnection.setRemoteDescription(
        new RTCSessionDescription(payload.answer)
      );

    }
  );

  callChannel.on(
    "broadcast",
    { event: "ice-candidate" },
    async ({ payload }) => {

      if (
        !payload ||
        !payload.candidate ||
        !callPeerConnection
      ) {
        return;
      }

      try {

        await callPeerConnection.addIceCandidate(
          new RTCIceCandidate(payload.candidate)
        );

      } catch (error) {

        console.error(
          "ICE candidate error:",
          error
        );

      }

    }
  );
  callChannel.on(
  "broadcast",
  { event: "hangup" },
  () => {

    if (localCallStream) {

      localCallStream
        .getTracks()
        .forEach(track => track.stop());

      localCallStream = null;
    }

    if (callPeerConnection) {

      callPeerConnection.close();
      callPeerConnection = null;
    }

    if (remoteAudio) {

      remoteAudio.srcObject = null;
      remoteAudio.remove();
      remoteAudio = null;
    }

    isInCall = false;

    alert("The other person ended the call.");

  }
);

  await callChannel.subscribe();

  }

let mediaRecorder;
let audioChunks = [];
let isRecording = false;
let recordingStream = null;

const voiceButton = document.getElementById("voiceButton");

voiceButton.addEventListener("click", async () => {

  // STOP RECORDING
  if (isRecording) {
    mediaRecorder.stop();
    return;
  }

  // Make sure a friend is selected
  if (!selectedFriend) {
    alert("Please select a friend before recording a voice note.");
    return;
  }

  try {

    const {
      data: { user },
      error: userError
    } = await supabaseClient.auth.getUser();

    if (userError || !user) {
      alert("Please log in again.");
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      audio: true
    });

    recordingStream = stream;
    audioChunks = [];

    let mimeType = "";

    if (MediaRecorder.isTypeSupported("audio/webm")) {
      mimeType = "audio/webm";
    } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
      mimeType = "audio/mp4";
    }

    mediaRecorder = new MediaRecorder(
      stream,
      mimeType ? { mimeType } : undefined
    );

    mediaRecorder.ondataavailable = (event) => {
      if (event.data.size > 0) {
        audioChunks.push(event.data);
      }
    };

    mediaRecorder.onstart = () => {

      isRecording = true;

      voiceButton.textContent = "⏹️";
      voiceButton.title = "Stop recording";

    };

    mediaRecorder.onstop = async () => {

      isRecording = false;

      voiceButton.textContent = "🎤";
      voiceButton.title = "Record voice note";

      if (recordingStream) {
        recordingStream
          .getTracks()
          .forEach(track => track.stop());

        recordingStream = null;
      }

      const audioBlob = new Blob(audioChunks, {
        type: mediaRecorder.mimeType
      });

      if (!audioBlob.size) {
        alert("No voice recording was captured.");
        return;
      }

      // Determine file extension
      const extension =
        audioBlob.type.includes("mp4") ? "mp4" : "webm";

      // Create a unique file name
      const fileName =
        crypto.randomUUID() + "." + extension;

      const filePath =
        user.id + "/" + fileName;

      // ===============================
      // UPLOAD AUDIO
      // ===============================

      const {
        error: uploadError
      } = await supabaseClient.storage
        .from("chat-voice-notes")
        .upload(
          filePath,
          audioBlob,
          {
            contentType: audioBlob.type,
            upsert: false
          }
        );

      if (uploadError) {

        console.error("Voice upload error:", uploadError);

        alert(
          "The voice note could not be uploaded. " +
          uploadError.message
        );

        return;
      }

      // ===============================
      // SAVE VOICE NOTE INFORMATION
      // ===============================

      const {
        error: databaseError
      } = await supabaseClient
        .from("chat_voice_notes")
        .insert({
          sender_id: user.id,
          receiver_id: selectedFriend.id,
          audio_url: filePath
        });

      if (databaseError) {

        console.error(
          "Voice note database error:",
          databaseError
        );

        alert(
          "The voice note was uploaded but could not be saved."
        );

        return;
      }

      // ===============================
      // CREATE TEMPORARY SIGNED URL
      // ===============================

      const {
        data: signedData,
        error: signedError
      } = await supabaseClient.storage
        .from("chat-voice-notes")
        .createSignedUrl(
          filePath,
          3600
        );

      if (signedError) {

        console.error(
          "Signed URL error:",
          signedError
        );

        alert(
          "Voice note was saved, but it could not be played yet."
        );

        return;
      }

      // ===============================
      // DISPLAY VOICE NOTE
      // ===============================

      const messagesBox =
        document.querySelector(".messages");

      const wrapper =
        document.createElement("div");

      wrapper.className = "message sent";

      const audioElement =
        document.createElement("audio");

      audioElement.controls = true;
      audioElement.src = signedData.signedUrl;

      wrapper.appendChild(audioElement);

      messagesBox.appendChild(wrapper);

      scrollToBottom();

    };

    mediaRecorder.onerror = (event) => {

      console.error(
        "MediaRecorder error:",
        event.error
      );

      isRecording = false;

      voiceButton.textContent = "🎤";
      voiceButton.title = "Record voice note";

    };

    mediaRecorder.start();

  } catch (error) {

    console.error(
      "Microphone/recording error:",
      error
    );

    alert(
      "Microphone access was denied or is not available. " +
      "Please allow microphone permission for this website."
    );

    }
