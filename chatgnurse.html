<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Chat G Nurse</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f4f7f6;
}

body {
    display: flex;
    justify-content: center;
}

.app {
    width: 100%;
    max-width: 520px;
    height: 100vh;
    background: white;
    position: relative;
    overflow: hidden;
}

/* HEADER */

.top-bar {
    height: 62px;
    width: 100%;
    background: #07562f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 20;
}

.top-title {
    font-size: 19px;
    font-weight: bold;
}

.notification-button {
    border: none;
    background: transparent;
    color: white;
    font-size: 23px;
    cursor: pointer;
}

/* MAIN */

.main {
    position: absolute;
    top: 62px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow: hidden;
}

/* WELCOME */

#welcomeScreen {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    padding: 35px 22px 40px;
}

.welcome-icon {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #e7f5ee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin: 15px auto 20px;
}

.welcome-title {
    text-align: center;
    color: #07562f;
    font-size: 25px;
    margin-bottom: 10px;
}

.welcome-text {
    text-align: center;
    color: #666;
    line-height: 1.5;
    font-size: 14px;
    margin-bottom: 28px;
}

.form-group {
    margin-bottom: 16px;
}

.form-group label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    color: #333;
    margin-bottom: 7px;
}

.form-group input {
    width: 100%;
    height: 48px;
    border: 1px solid #d5d5d5;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 15px;
    outline: none;
    background: white;
}

.form-group input:focus {
    border-color: #07562f;
}

.start-chat-button {
    width: 100%;
    height: 50px;
    border: none;
    border-radius: 10px;
    background: #07562f;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.start-chat-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

/* CHAT SCREEN */
#chatScreen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    background: #f4f7f6;
    overflow: hidden;
}

#chatScreen.active {
    display: flex;
}

/* =========================
   CHAT HEADER — FIXED
========================= */

.chat-header {
    flex: 0 0 58px;
    height: 58px;
    background: #ffffff;
    border-bottom: 1px solid #ddd;

    display: flex;
    align-items: center;

    padding: 0 10px;
    gap: 10px;

    position: relative;
    z-index: 20;
}

/* =========================
   MESSAGES — ONLY THIS SCROLLS
========================= */

#messagesContainer {
    flex: 1 1 auto;
    min-height: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 15px 12px 20px;

    -webkit-overflow-scrolling: touch;
}

/* =========================
   COMPOSER — FIXED AT BOTTOM
========================= */

.composer {
    flex: 0 0 auto;

    width: 100%;

    background: #ffffff;
    border-top: 1px solid #ddd;

    padding: 8px;

    position: relative;
    z-index: 30;
}

/* =========================
   COMPOSER ROW
========================= */

.composer-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    }

/* MESSAGES */

#messagesContainer {
    flex: 1;
    overflow-y: auto;
    padding: 15px 12px;
    position: relative;
}

.empty-chat {
    position: absolute;
    left: 20px;
    right: 20px;
    top: 45%;
    transform: translateY(-50%);
    text-align: center;
    color: #777;
    font-size: 15px;
}

.empty-chat-icon {
    font-size: 40px;
    margin-bottom: 10px;
}

.message-wrapper {
    display: flex;
    width: 100%;
    margin-bottom: 10px;
}

.visitor-message {
    justify-content: flex-end;
}

.admin-message {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 78%;
    padding: 9px 12px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
}

.visitor-message .message-bubble {
    background: #07562f;
    color: white;
    border-bottom-right-radius: 4px;
}

.admin-message .message-bubble {
    background: white;
    color: #222;
    border: 1px solid #e0e0e0;
    border-bottom-left-radius: 4px;
}

.message-time {
    font-size: 9px;
    opacity: 0.65;
    text-align: right;
    margin-top: 4px;
}

.unsend-button {
    border: none;
    background: transparent;
    font-size: 10px;
    margin-top: 4px;
    cursor: pointer;
    color: inherit;
    opacity: 0.7;
}

/* COMPOSER */

.composer {
    background: white;
    border-top: 1px solid #ddd;
    padding: 8px;
}

.composer-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
}

.composer-button {
    flex: 0 0 42px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #edf3ef;
    color: #07562f;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.composer-button:disabled {
    opacity: 0.5;
}

#messageInput {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 120px;
    resize: none;
    border: 1px solid #d5d5d5;
    border-radius: 20px;
    padding: 11px 14px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    outline: none;
}

#messageInput:focus {
    border-color: #07562f;
}

.send-button {
    background: #07562f;
    color: white;
}

.recording {
    background: #b3261e !important;
    color: white !important;
}

/* SELECTED FILE */

#selectedFilePreview {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #f0f5f2;
    border-radius: 8px;
    padding: 7px 10px;
    margin-bottom: 7px;
    font-size: 12px;
    color: #333;
}

#selectedFilePreview button {
    border: none;
    background: transparent;
    color: #b3261e;
    font-size: 16px;
    cursor: pointer;
}

/* FILES AND IMAGES */

.chat-image {
    display: block;
    max-width: 220px;
    max-height: 250px;
    border-radius: 10px;
    margin-top: 4px;
    cursor: pointer;
}

.file-link {
    display: block;
    color: inherit;
    text-decoration: none;
    margin-top: 4px;
    font-weight: bold;
}

.voice-message {
    margin-top: 4px;
}

.voice-message audio {
    width: 230px;
    max-width: 100%;
}

/* HIDDEN */

.hidden {
    display: none !important;
}

/* LOADING */

#loadingOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.loading-box {
    background: white;
    border-radius: 12px;
    padding: 22px 28px;
    text-align: center;
    color: #07562f;
    font-weight: bold;
}

/* SMALL SCREENS */

@media (max-width: 360px) {

    .composer-button {
        width: 38px;
        flex-basis: 38px;
        height: 38px;
    }

    #messageInput {
        min-height: 38px;
    }

    .message-bubble {
        max-width: 84%;
    }

}

</style>

</head>

<body>

<div class="app">

    <!-- TOP BAR -->

    <div class="top-bar">

        <div class="top-title">
            💬 Chat G Nurse
        </div>

        <button
            type="button"
            class="notification-button"
            id="notificationButton"
            title="Notifications">
            🔔
        </button>

    </div>


    <div class="main">

        <!-- WELCOME SCREEN -->

        <section id="welcomeScreen">

            <div class="welcome-icon">
                💬
            </div>

            <h1 class="welcome-title">
                Chat G Nurse
            </h1>

            <p class="welcome-text">
                Start a direct conversation with G Nurse.
                No public account or visible signup is required.
                Enter your details below to begin.
            </p>


            <div class="form-group">

                <label for="visitorName">
                    Your Name
                </label>

                <input
                    type="text"
                    id="visitorName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label for="visitorEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="visitorEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="form-group">

                <label for="visitorPhone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="visitorPhone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                >

            </div>


            <button
                type="button"
                class="start-chat-button"
                id="startChatButton">

                Start Chat

            </button>

        </section>


        <!-- CHAT SCREEN -->

        <section id="chatScreen">

            <div class="chat-header">

                <button
                    type="button"
                    class="back-button"
                    id="backButton"
                    title="Back">

                    ‹

                </button>


                <div class="chat-avatar">
                    👩‍⚕️
                </div>


                <div class="chat-header-info">

                    <div class="chat-header-name">
                        G Nurse
                    </div>

                    <div class="chat-header-status">
                        Direct conversation
                    </div>

                </div>

            </div>


            <!-- MESSAGES -->

            <div id="messagesContainer">

                <div
                    class="empty-chat"
                    id="emptyChat">

                    <div class="empty-chat-icon">
                        💬
                    </div>

                    <div>
                        Start a conversation with G Nurse.
                    </div>

                </div>

            </div>


            <!-- COMPOSER -->

            <div
                class="composer"
                id="composer">

                <div
                    id="selectedFilePreview">

                </div>


                <div class="composer-row">

                    <button
                        type="button"
                        class="composer-button"
                        id="attachmentButton"
                        title="Attach file">

                        📎

                    </button>


                    <input
                        type="file"
                        id="fileInput"
                        hidden
                        accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt"
                    >


                    <textarea
                        id="messageInput"
                        placeholder="Type a message..."
                        rows="1"
                        autocomplete="off">
                    </textarea>


                    <button
                        type="button"
                        class="composer-button"
                        id="voiceButton"
                        title="Voice note">

                        🎤

                    </button>


                    <button
                        type="button"
                        class="composer-button send-button"
                        id="sendButton"
                        title="Send message">

                        ➤

                    </button>

                </div>

            </div>

        </section>

    </div>

</div>


<!-- LOADING -->

<div id="loadingOverlay">

    <div class="loading-box">
        Connecting to G Nurse...
    </div>

</div>

<script>
/* =========================================================
   G NURSE CHAT - PART 2
   Supabase connection + anonymous visitor + conversation
   ========================================================= */


/* =========================
   SUPABASE CONFIGURATION
========================= */

const SUPABASE_URL =
    "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   HTML ELEMENTS
========================= */

const startChatButton =
    document.getElementById("startChatButton");

const visitorName =
    document.getElementById("visitorName");

const visitorEmail =
    document.getElementById("visitorEmail");

const visitorPhone =
    document.getElementById("visitorPhone");

const welcomeScreen =
    document.getElementById("welcomeScreen");

const chatScreen =
    document.getElementById("chatScreen");

const backButton =
    document.getElementById("backButton");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachmentButton =
    document.getElementById("attachmentButton");

const fileInput =
    document.getElementById("fileInput");

const selectedFilePreview =
    document.getElementById("selectedFilePreview");
    fileInput.addEventListener("change", function () {
    const file = fileInput.files[0];

    if (file) {
        alert("File selected successfully:\n\n" + file.name);
    }
});

const voiceButton =
    document.getElementById("voiceButton");

const notificationButton =
    document.getElementById("notificationButton");

const messagesContainer =
    document.getElementById("messagesContainer");

const emptyChat =
    document.getElementById("emptyChat");

const loadingOverlay =
    document.getElementById("loadingOverlay");


/* =========================
   CHAT VARIABLES
========================= */

let currentUser = null;

let currentConversation = null;

let visitorToken = null;


/* =========================
   LOADING
========================= */

function showLoading(text) {

    if (!loadingOverlay) return;

    const box =
        loadingOverlay.querySelector(".loading-box");

    if (box) {
        box.textContent =
            text || "Connecting to G Nurse...";
    }

    loadingOverlay.style.display = "flex";
}


function hideLoading() {

    if (!loadingOverlay) return;

    loadingOverlay.style.display = "none";
}


/* =========================
   VISITOR TOKEN
========================= */

function getVisitorToken() {

    try {

        let token =
            localStorage.getItem(
                "g_nurse_visitor_token"
            );

        if (!token) {

            token =
                "visitor_" +
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2, 12);

            localStorage.setItem(
                "g_nurse_visitor_token",
                token
            );
        }

        return token;

    } catch (error) {

        console.error(
            "Visitor token error:",
            error
        );

        return (
            "visitor_" +
            Date.now()
        );
    }
}


/* =========================
   ANONYMOUS AUTHENTICATION
========================= */

async function ensureAuthenticated() {

    /* Check existing session first */

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();

    if (sessionError) {
        throw sessionError;
    }

    if (
        sessionData &&
        sessionData.session &&
        sessionData.session.user
    ) {

        currentUser =
            sessionData.session.user;

        return currentUser;
    }


    /* Create anonymous user */

    const {
        data,
        error
    } =
        await supabaseClient.auth.signInAnonymously();

    if (error) {
        throw error;
    }

    if (!data || !data.user) {

        throw new Error(
            "Anonymous authentication did not return a user."
        );
    }

    currentUser =
        data.user;

    return currentUser;
}


/* =========================
   FIND OR CREATE CONVERSATION
========================= */

async function getOrCreateConversation() {

    if (!currentUser) {

        throw new Error(
            "Visitor authentication is missing."
        );
    }

    visitorToken =
        getVisitorToken();


    /* First look for this visitor's conversation */

    const {
        data: existingConversation,
        error: findError
    } =
        await supabaseClient
            .from("g_nurse_conversations")
            .select("*")
            .eq(
                "visitor_user_id",
                currentUser.id
            )
            .order(
                "updated_at",
                { ascending: false }
            )
            .limit(1)
            .maybeSingle();


    if (findError) {
        throw findError;
    }


    /* Existing conversation found */

    if (existingConversation) {

        currentConversation =
            existingConversation;

        /* Update visitor information */

        const {
            data: updatedConversation,
            error: updateError
        } =
            await supabaseClient
                .from("g_nurse_conversations")
                .update({
                    visitor_token: visitorToken,
                    visitor_name:
                        visitorName.value.trim(),
                    visitor_email:
                        visitorEmail.value.trim(),
                    visitor_phone:
                        visitorPhone.value.trim(),
                    updated_at:
                        new Date().toISOString()
                })
                .eq(
                    "id",
                    existingConversation.id
                )
                .select("*")
                .single();


        if (updateError) {
            throw updateError;
        }

        currentConversation =
            updatedConversation;

        localStorage.setItem(
            "g_nurse_conversation_id",
            currentConversation.id
        );

        return currentConversation;
    }


    /* =========================
       CREATE NEW CONVERSATION
    ========================= */

    const {
        data: newConversation,
        error: createError
    } =
        await supabaseClient
            .from("g_nurse_conversations")
            .insert({
                visitor_token: visitorToken,
                visitor_name:
                    visitorName.value.trim(),
                visitor_email:
                    visitorEmail.value.trim(),
                visitor_phone:
                    visitorPhone.value.trim(),
                visitor_user_id:
                    currentUser.id,
                status: "open"
            })
            .select("*")
            .single();


    if (createError) {
        throw createError;
    }


    currentConversation =
        newConversation;


    localStorage.setItem(
        "g_nurse_conversation_id",
        currentConversation.id
    );


    return currentConversation;
}


/* =========================
   START CHAT
========================= */

startChatButton.onclick =
    async function () {

        const name =
            visitorName.value.trim();

        const email =
            visitorEmail.value.trim();

        const phone =
            visitorPhone.value.trim();


        /* Validate name */

        if (!name) {

            alert(
                "Please enter your name."
            );

            visitorName.focus();

            return;
        }


        /* Require email OR phone */

        if (!email && !phone) {

            alert(
                "Please enter your email address or phone number."
            );

            visitorEmail.focus();

            return;
        }


        /* Save visitor locally */

        try {

            localStorage.setItem(
                "g_nurse_visitor",
                JSON.stringify({
                    name: name,
                    email: email,
                    phone: phone
                })
            );

        } catch (error) {

            console.log(
                "Could not save visitor:",
                error
            );
        }


        /* Disable button */

        startChatButton.disabled =
            true;


        showLoading(
            "Connecting to G Nurse..."
        );


        try {

            /* Authenticate visitor */

            await ensureAuthenticated();


            /* Find/create conversation */

            await getOrCreateConversation();
            await loadMessages();


            /* Open chat */

            welcomeScreen.style.display =
                "none";

            chatScreen.style.display =
                "flex";


            messageInput.focus();


            console.log(
                "G Nurse conversation ready:",
                currentConversation
            );


        } catch (error) {

            console.error(
                "Start Chat error:",
                error
            );


            alert(
                "Unable to start the chat.\n\n" +
                (error.message ||
                 "Please try again.")
            );

        } finally {

            hideLoading();

            startChatButton.disabled =
                false;
        }
    };


/* =========================
   BACK BUTTON
========================= */

backButton.onclick =
    function () {

        chatScreen.style.display =
            "none";

        welcomeScreen.style.display =
            "block";
    };


/* =========================
   SEND BUTTON
========================= */




fileInput.onchange =
    function () {

        const file =
            fileInput.files[0];

        if (!file) return;


        selectedFilePreview.style.display =
            "flex";

        selectedFilePreview.innerHTML =
            "";


        const fileName =
            document.createElement("span");

        fileName.textContent =
            "📎 " + file.name;


        const removeButton =
            document.createElement("button");

        removeButton.type =
            "button";

        removeButton.textContent =
            "✕";


        removeButton.onclick =
            function () {

                fileInput.value =
                    "";

                selectedFilePreview.innerHTML =
                    "";

                selectedFilePreview.style.display =
                    "none";
            };


        selectedFilePreview.appendChild(
            fileName
        );

        selectedFilePreview.appendChild(
            removeButton
        );
    };


/* =========================
   VOICE
========================= */

voiceButton.onclick =
    function () {

        alert(
            "Voice recording will be connected in Part 4."
        );
    };


/* =========================
   NOTIFICATIONS
========================= */

notificationButton.onclick =
    function () {

        alert(
            "Notifications will be connected later."
        );
    };


/* =========================
   RESTORE VISITOR DETAILS
========================= +/
try {

    const savedVisitor =
        localStorage.getItem(
            "g_nurse_visitor"
        );

    if (savedVisitor) {

        const visitor =
            JSON.parse(savedVisitor);

        if (visitor.name) {
            visitorName.value = visitor.name;
        }

        if (visitor.email) {
            visitorEmail.value = visitor.email;
        }

        if (visitor.phone) {
            visitorPhone.value = visitor.phone;
        }
    }

} catch (error) {

    console.error(
        "Restore visitor details error:",
        error
    );
}

/* =========================================================
   PART 3 - TEXT MESSAGE SENDING
========================================================= */


/* =========================
   LOAD EXISTING MESSAGES
========================= */

async function loadMessages() {

    if (!currentConversation) {
        return;
    }

    const {
        data,
        error
    } = await supabaseClient
        .from("g_nurse_messages")
        .select("*")
        .eq(
            "conversation_id",
            currentConversation.id
        )
        .is("deleted_at", null)
        .order(
            "created_at",
            {
                ascending: true
            }
        );

    if (error) {
        console.error(
            "Load messages error:",
            error
        );
        return;
    }

    messagesContainer
        .querySelectorAll(".message-wrapper")
        .forEach(function(element) {
            element.remove();
        });


    if (!data || data.length === 0) {

        emptyChat.style.display =
            "block";

        return;
    }


    emptyChat.style.display =
        "none";


    data.forEach(function(message) {

        displayMessage(message);

    });


    scrollMessagesToBottom();
}


/* =========================
   DISPLAY MESSAGE
========================= */

function displayMessage(message) {

    const wrapper =
        document.createElement("div");

    const isVisitor =
        message.sender_type === "visitor";


    wrapper.className =
        "message-wrapper " +
        (
            isVisitor
                ? "visitor-message"
                : "admin-message"
        );


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    if (message.message) {

        const text =
            document.createElement("div");

        text.textContent =
            message.message;

        bubble.appendChild(text);
    }


    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    bubble.appendChild(time);


    wrapper.appendChild(
        bubble
    );


    messagesContainer.appendChild(
        wrapper
    );
}


/* =========================
   MESSAGE TIME
========================= */

function formatMessageTime(dateValue) {

    if (!dateValue) {
        return "";
    }

    const date =
        new Date(dateValue);

    if (isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================
   SCROLL TO BOTTOM
========================= */

function scrollMessagesToBottom() {

    setTimeout(function() {

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

    }, 50);
}


/* =========================
   SEND TEXT MESSAGE
========================= */

async function sendTextMessage() {

    const text =
        messageInput.value.trim();


    if (!text) {

        messageInput.focus();

        return;
    }


    if (!currentConversation) {

        alert(
            "Your chat connection is not ready. Please go back and start the chat again."
        );

        return;
    }


    sendButton.disabled =
        true;


    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("g_nurse_messages")
            .insert({
                conversation_id:
                    currentConversation.id,

                sender_type:
                    "visitor",

                message:
                    text
            })
            .select("*")
            .single();


        if (error) {
            throw error;
        }


        /* Clear input */

        messageInput.value =
            "";

        messageInput.style.height =
            "42px";


        /* Remove empty message */

        emptyChat.style.display =
            "none";


        /* Display immediately */

        displayMessage(data);


        /* Scroll down */

        scrollMessagesToBottom();


        /* Update conversation time */

        await supabaseClient
            .from("g_nurse_conversations")
            .update({
                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                currentConversation.id
            );


    } catch (error) {

        console.error(
            "Send message error:",
            error
        );


        alert(
            "Message could not be sent.\n\n" +
            (
                error.message ||
                "Please try again."
            )
        );

    } finally {

        sendButton.disabled =
            false;

        messageInput.focus();
    }
}


/* =========================
   SEND BUTTON
========================= */

sendButton.onclick =
    async function() {

        await sendTextMessage();

    };
    /* =========================================================
   PART 4 - FILE SENDING
========================================================= */

attachmentButton.onclick = function () {
    fileInput.click();
};


fileInput.onchange = async function () {

    const file = fileInput.files[0];

    if (!file) {
        return;
    }

    if (!currentConversation) {
        alert("Please start the chat first.");
        fileInput.value = "";
        return;
    }

    selectedFilePreview.textContent =
        "Uploading: " + file.name;

    attachmentButton.disabled = true;

    try {

        const fileExtension =
            file.name.includes(".")
                ? file.name.split(".").pop()
                : "file";

        const safeExtension =
            fileExtension.replace(
                /[^a-zA-Z0-9]/g,
                ""
            );

        const filePath =
            currentConversation.id +
            "/" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            safeExtension;


        /* =========================
           UPLOAD FILE
        ========================= */

        const {
            error: uploadError
        } = await supabaseClient
            .storage
            .from("g-nurse-files")
            .upload(
                filePath,
                file,
                {
                    cacheControl: "3600",
                    upsert: false
                }
            );


        if (uploadError) {
            throw uploadError;
        }


        /* =========================
           GET FILE URL
        ========================= */

        const {
            data: urlData
        } = supabaseClient
            .storage
            .from("g-nurse-files")
            .getPublicUrl(filePath);


        if (!urlData || !urlData.publicUrl) {
            throw new Error(
                "Unable to create file URL."
            );
        }


        /* =========================
           SAVE MESSAGE
        ========================= */

        const {
            data: messageData,
            error: messageError
        } = await supabaseClient
            .from("g_nurse_messages")
            .insert({
                conversation_id:
                    currentConversation.id,

                sender_type:
                    "visitor",

                message:
                    "📎 " + file.name,

                attachment_url:
                    urlData.publicUrl,

                attachment_name:
                    file.name,

                attachment_type:
                    file.type || "application/octet-stream"
            })
            .select("*")
            .single();


        if (messageError) {
            throw messageError;
        }


        /* =========================
           DISPLAY MESSAGE
        ========================= */

        emptyChat.style.display = "none";

        displayMessage(messageData);

        scrollMessagesToBottom();


        /* =========================
           UPDATE CONVERSATION
        ========================= */

        const {
            error: conversationError
        } = await supabaseClient
            .from("g_nurse_conversations")
            .update({
                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                currentConversation.id
            );

        if (conversationError) {
            console.error(
                "Conversation update error:",
                conversationError
            );
        }


        selectedFilePreview.textContent =
            "File sent successfully.";

        fileInput.value = "";


        setTimeout(function () {

            selectedFilePreview.textContent =
                "";

        }, 2000);


    } catch (error) {

        console.error(
            "File sending error:",
            error
        );

        selectedFilePreview.textContent =
            "";

        alert(
            "File could not be sent.\n\n" +
            (
                error.message ||
                "Please try again."
            )
        );

    } finally {

        attachmentButton.disabled = false;

    }
};


/* =========================
   ENTER TO SEND
========================= */

messageInput.onkeydown =
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendButton.click();
        }
    };
</script>
