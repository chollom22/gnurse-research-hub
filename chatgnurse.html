<script>

/* =========================================================
   SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   APPLICATION STATE
========================================================= */

let currentUser = null;

let currentConversation = null;

let realtimeChannel = null;

let selectedFile = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingSeconds = 0;


/* =========================================================
   ELEMENTS
========================================================= */

const welcomeScreen =
    document.getElementById("welcomeScreen");

const chatScreen =
    document.getElementById("chatScreen");

const visitorNameInput =
    document.getElementById("visitorName");

const visitorEmailInput =
    document.getElementById("visitorEmail");

const visitorPhoneInput =
    document.getElementById("visitorPhone");

const startChatButton =
    document.getElementById("startChatButton");

const backButton =
    document.getElementById("backButton");

const messages =
    document.getElementById("messages");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const voiceButton =
    document.getElementById("voiceButton");

const fileButton =
    document.getElementById("fileButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const recordingStatus =
    document.getElementById("recordingStatus");

const notificationButton =
    document.getElementById("notificationButton");

const notificationBadge =
    document.getElementById("notificationBadge");

const notificationPanel =
    document.getElementById("notificationPanel");

const notificationList =
    document.getElementById("notificationList");

const closeNotificationsButton =
    document.getElementById(
        "closeNotificationsButton"
    );

const markAllNotificationsButton =
    document.getElementById(
        "markAllNotificationsButton"
    );

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");


/* =========================================================
   LOADING
========================================================= */

function showLoading(
    text = "Please wait..."
) {

    loadingText.textContent = text;

    loading.style.display = "flex";
}


function hideLoading() {

    loading.style.display = "none";
}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;
}


/* =========================================================
   TIME
========================================================= */

function formatMessageTime(value) {

    if (!value) return "";

    const date = new Date(value);

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   VISITOR DETAILS
========================================================= */

function saveVisitorDetails(
    name,
    email,
    phone
) {

    localStorage.setItem(
        "g_nurse_visitor",
        JSON.stringify({
            name: name || "",
            email: email || "",
            phone: phone || ""
        })
    );
}


function loadVisitorDetails() {

    try {

        const value =
            localStorage.getItem(
                "g_nurse_visitor"
            );

        if (!value) return;

        const visitor = JSON.parse(value);

        if (visitor.name) {
            visitorName.value = visitor.name;
        }

        if (visitor.email) {
            visitorEmail.value = visitor.email;
        }

        if (visitor.phone) {
            visitorPhone.value = visitor.phone;
        }

    } catch (error) {

        console.error(
            "Unable to load visitor details:",
            error
        );

    }

}


function saveVisitorDetails() {

    const visitor = {
        name: visitorName.value.trim(),
        email: visitorEmail.value.trim(),
        phone: visitorPhone.value.trim()
    };

    localStorage.setItem(
        "g_nurse_visitor",
        JSON.stringify(visitor)
    );

}


async function restoreExistingChat() {

    try {

        const savedConversation =
            localStorage.getItem(
                "g_nurse_conversation"
            );

        if (!savedConversation) {
            return;
        }

        const conversation =
            JSON.parse(savedConversation);

        if (!conversation?.id) {
            return;
        }

        /*
         * Do not automatically force the visitor
         * into a signup/login screen.
         *
         * Authentication is handled silently in
         * the background when the visitor starts
         * or continues a chat.
         */

        loadVisitorDetails();

    } catch (error) {

        console.error(
            "Unable to restore previous chat:",
            error
        );

    }

}


async function startChat() {

    const name =
        visitorName.value.trim();

    const email =
        visitorEmail.value.trim();

    const phone =
        visitorPhone.value.trim();

    if (!name) {

        alert(
            "Please enter your name."
        );

        visitorName.focus();

        return;

    }

    if (!email && !phone) {

        alert(
            "Please enter your email address or phone number."
        );

        visitorEmail.focus();

        return;

    }

    try {

        startChatButton.disabled = true;

        startChatButton.textContent =
            "Connecting...";

        /*
         * Anonymous authentication happens
         * silently. The visitor does NOT create
         * a visible Supabase account.
         */

        await ensureAuthenticated();

        saveVisitorDetails();

        const visitorToken =
            localStorage.getItem(
                "g_nurse_visitor_token"
            ) ||
            crypto.randomUUID();

        localStorage.setItem(
            "g_nurse_visitor_token",
            visitorToken
        );


        /*
         * Look for an existing conversation
         * belonging to this visitor.
         */

        let conversation = null;

        const {
            data: existingConversation,
            error: existingError
        } = await supabaseClient
            .from("g_nurse_conversations")
            .select("*")
            .eq(
                "visitor_user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1)
            .maybeSingle();


        if (existingError) {

            console.error(
                "Conversation lookup error:",
                existingError
            );

        } else {

            conversation =
                existingConversation;

        }


        /*
         * Create a new conversation if none exists.
         */

        if (!conversation) {

            const {
                data: newConversation,
                error: createError
            } = await supabaseClient
                .from("g_nurse_conversations")
                .insert({

                    visitor_token:
                        visitorToken,

                    visitor_name:
                        name,

                    visitor_email:
                        email || null,

                    visitor_phone:
                        phone || null,

                    visitor_user_id:
                        currentUser.id,

                    status:
                        "open"

                })
                .select("*")
                .single();


            if (createError) {

                console.error(
                    "Create conversation error:",
                    createError
                );

                throw createError;

            }

            conversation =
                newConversation;

        } else {

            /*
             * Keep visitor information updated.
             */

            await supabaseClient
                .from("g_nurse_conversations")
                .update({

                    visitor_name:
                        name,

                    visitor_email:
                        email || null,

                    visitor_phone:
                        phone || null,

                    visitor_token:
                        visitorToken,

                    status:
                        "open",

                    updated_at:
                        new Date().toISOString()

                })
                .eq(
                    "id",
                    conversation.id
                );

        }


        currentConversation =
            conversation;


        localStorage.setItem(
            "g_nurse_conversation",
            JSON.stringify(conversation)
        );


        /*
         * Show the actual chat.
         */

        welcomeScreen.classList.add(
            "hidden"
        );

        chatScreen.classList.remove(
            "hidden"
        );


        await loadMessages();

        subscribeToRealtime();


        messageInput.focus();


    } catch (error) {

        console.error(
            "Start chat error:",
            error
        );

        alert(
            "Unable to connect to G Nurse. Please try again."
        );

    } finally {

        startChatButton.disabled =
            false;

        startChatButton.textContent =
            "Start Chat";

    }

    }


async function loadMessages() {

    if (!currentConversation?.id) {
        return;
    }

    try {

        const {
            data,
            error
        } = await supabaseClient
            .from("g_nurse_messages")
            .select("*")
            .eq(
                "conversation_id",
                currentConversation.id
            )
            .is(
                "deleted_at",
                null
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );

        if (error) {
            throw error;
        }

        messagesContainer.innerHTML = "";

        if (!data || data.length === 0) {

            emptyChat.style.display = "block";

            messagesContainer.appendChild(
                emptyChat
            );

            return;
        }

        emptyChat.style.display = "none";

        for (const message of data) {

            const element =
                await renderMessage(message);

            messagesContainer.appendChild(
                element
            );
        }

        scrollMessagesToBottom();

    } catch (error) {

        console.error(
            "Load messages error:",
            error
        );

    }

}


function scrollMessagesToBottom() {

    setTimeout(() => {

        messagesContainer.scrollTop =
            messagesContainer.scrollHeight;

    }, 50);

}


async function renderMessage(message) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message-wrapper " +
        (
            message.sender_type === "visitor"
                ? "visitor-message"
                : "admin-message"
        );


    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";


    if (message.message) {

        const text =
            document.createElement("div");

        text.className =
            "message-text";

        text.textContent =
            message.message;

        bubble.appendChild(text);

    }


    if (message.attachment_url) {

        const attachment =
            await createAttachmentElement(
                message
            );

        if (attachment) {

            bubble.appendChild(
                attachment
            );

        }

    }


    if (message.voice_url) {

        const voice =
            await createVoiceElement(
                message
            );

        if (voice) {

            bubble.appendChild(
                voice
            );

        }

    }


    const time =
        document.createElement("div");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    bubble.appendChild(time);


    if (
        message.sender_type === "visitor"
    ) {

        const unsend =
            document.createElement("button");

        unsend.type = "button";

        unsend.className =
            "unsend-button";

        unsend.textContent =
            "Unsend";

        unsend.onclick = function () {

            unsendMessage(
                message.id
            );

        };

        bubble.appendChild(
            unsend
        );

    }


    wrapper.appendChild(
        bubble
    );


    if (
        message.sender_type === "admin" &&
        !message.viewed
    ) {

        try {

            await supabaseClient.rpc(
                "g_nurse_mark_message_seen",
                {
                    p_message_id:
                        message.id
                }
            );

        } catch (error) {

            console.error(
                "Unable to mark message as seen:",
                error
            );

        }

    }


    return wrapper;

}


function formatMessageTime(dateString) {

    if (!dateString) {
        return "";
    }

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

    }
    async function sendMessage() {

    if (!currentConversation?.id) {
        alert("Please start a conversation first.");
        return;
    }

    const text =
        messageInput.value.trim();

    if (!text && !selectedFile) {
        return;
    }

    try {

        sendButton.disabled = true;

        let attachmentData = null;

        /*
         * Upload selected picture/file first.
         */
        if (selectedFile) {

            attachmentData =
                await uploadAttachment(
                    selectedFile
                );

        }

        /*
         * Insert the message.
         */
        const {
            data,
            error
        } = await supabaseClient
            .from("g_nurse_messages")
            .insert({

                conversation_id:
                    currentConversation.id,

                sender_type:
                    "visitor",

                message:
                    text || null,

                attachment_url:
                    attachmentData?.url || null,

                attachment_name:
                    attachmentData?.name || null,

                attachment_type:
                    attachmentData?.type || null

            })
            .select()
            .single();

        if (error) {
            throw error;
        }

        /*
         * Clear the composer.
         */
        messageInput.value = "";

        selectedFile = null;

        selectedFilePreview.style.display =
            "none";

        selectedFilePreview.innerHTML = "";

        messageInput.style.height =
            "auto";

        /*
         * Update conversation time.
         */
        await supabaseClient
            .from("g_nurse_conversations")
            .update({
                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "id",
                currentConversation.id
            );

        /*
         * Reload messages immediately.
         */
        await loadMessages();

        scrollMessagesToBottom();

    } catch (error) {

        console.error(
            "Send message error:",
            error
        );

        alert(
            "Message could not be sent. Please try again."
        );

    } finally {

        sendButton.disabled = false;

    }

}


async function uploadAttachment(file) {

    if (!file) {
        return null;
    }

    if (!currentUser?.id) {
        throw new Error(
            "Visitor authentication is missing."
        );
    }

    if (!currentConversation?.id) {
        throw new Error(
            "Conversation is missing."
        );
    }

    const isImage =
        file.type.startsWith("image/");

    const bucket =
        isImage
            ? "g-nurse-images"
            : "g-nurse-files";

    const folder =
        isImage
            ? "images"
            : "files";

    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );

    const fileName =
        Date.now() +
        "_" +
        safeName;

    const path =
        currentUser.id +
        "/" +
        currentConversation.id +
        "/" +
        fileName;


    const {
        error
    } = await supabaseClient
        .storage
        .from(bucket)
        .upload(
            path,
            file,
            {
                cacheControl: "3600",
                upsert: false
            }
        );

    if (error) {
        throw error;
    }


    return {

        url:
            folder +
            "/" +
            path,

        name:
            file.name,

        type:
            file.type || "application/octet-stream"

    };

}


async function createAttachmentElement(message) {

    if (!message.attachment_url) {
        return null;
    }

    const parts =
        message.attachment_url.split("/");

    const folder =
        parts.shift();

    const storagePath =
        parts.join("/");

    let bucket;

    if (folder === "images") {

        bucket =
            "g-nurse-images";

    } else {

        bucket =
            "g-nurse-files";

    }


    const {
        data,
        error
    } = await supabaseClient
        .storage
        .from(bucket)
        .createSignedUrl(
            storagePath,
            3600
        );

    if (error || !data?.signedUrl) {

        console.error(
            "Attachment URL error:",
            error
        );

        return null;
    }


    if (
        message.attachment_type &&
        message.attachment_type.startsWith(
            "image/"
        )
    ) {

        const image =
            document.createElement("img");

        image.src =
            data.signedUrl;

        image.className =
            "chat-image";

        image.alt =
            message.attachment_name ||
            "Image";

        image.onclick = function () {

            window.open(
                data.signedUrl,
                "_blank"
            );

        };

        return image;

    }


    const link =
        document.createElement("a");

    link.href =
        data.signedUrl;

    link.target =
        "_blank";

    link.rel =
        "noopener noreferrer";

    link.className =
        "file-link";

    link.textContent =
        "📎 " +
        (
            message.attachment_name ||
            "Open file"
        );

    return link;

    }
    async function createVoiceElement(message) {

    if (!message.voice_url) {
        return null;
    }

    let storagePath =
        message.voice_url;

    if (
        storagePath.startsWith("voice/")
    ) {
        storagePath =
            storagePath.substring(6);
    }

    const {
        data,
        error
    } = await supabaseClient
        .storage
        .from("g-nurse-voice")
        .createSignedUrl(
            storagePath,
            3600
        );

    if (
        error ||
        !data?.signedUrl
    ) {

        console.error(
            "Voice URL error:",
            error
        );

        return null;
    }


    const container =
        document.createElement("div");

    container.className =
        "voice-message";


    const audio =
        document.createElement("audio");

    audio.controls = true;

    audio.preload = "metadata";

    audio.src =
        data.signedUrl;


    audio.addEventListener(
        "play",
        async function () {

            try {

                await supabaseClient.rpc(
                    "g_nurse_mark_voice_listened",
                    {
                        p_message_id:
                            message.id
                    }
                );

            } catch (error) {

                console.error(
                    "Voice status error:",
                    error
                );

            }

        }
    );


    container.appendChild(
        audio
    );

    return container;

}


async function unsendMessage(messageId) {

    if (!messageId) {
        return;
    }

    const confirmUnsend =
        confirm(
            "Unsend this message?"
        );

    if (!confirmUnsend) {
        return;
    }


    try {

        const {
            error
        } = await supabaseClient.rpc(
            "g_nurse_unsend_message",
            {
                p_message_id:
                    messageId
            }
        );

        if (error) {
            throw error;
        }

        await loadMessages();

    } catch (error) {

        console.error(
            "Unsend error:",
            error
        );

        alert(
            "Unable to unsend this message."
        );

    }

}


function showSelectedFile(file) {

    if (!selectedFilePreview) {
        return;
    }

    if (!file) {

        selectedFilePreview.style.display =
            "none";

        selectedFilePreview.innerHTML =
            "";

        return;
    }


    selectedFilePreview.style.display =
        "flex";


    selectedFilePreview.innerHTML = "";


    const fileName =
        document.createElement("span");

    fileName.textContent =
        "📎 " + file.name;


    const removeButton =
        document.createElement("button");

    removeButton.type =
        "button";

    removeButton.textContent =
        "✕";

    removeButton.onclick =
        function () {

            selectedFile = null;

            fileInput.value = "";

            showSelectedFile(null);

        };


    selectedFilePreview.appendChild(
        fileName
    );

    selectedFilePreview.appendChild(
        removeButton
    );

    }
    async function uploadVoiceNote(blob) {

    if (!blob) {
        throw new Error(
            "No voice recording found."
        );
    }

    if (!currentUser?.id) {
        throw new Error(
            "Visitor authentication is missing."
        );
    }

    if (!currentConversation?.id) {
        throw new Error(
            "Conversation is missing."
        );
    }


    const extension =
        blob.type.includes("mp4")
            ? "m4a"
            : "webm";

    const fileName =
        "voice_" +
        Date.now() +
        "." +
        extension;


    const path =
        currentUser.id +
        "/" +
        currentConversation.id +
        "/" +
        fileName;


    const {
        error: uploadError
    } = await supabaseClient
        .storage
        .from("g-nurse-voice")
        .upload(
            path,
            blob,
            {
                cacheControl: "3600",
                upsert: false,
                contentType:
                    blob.type ||
                    "audio/webm"
            }
        );


    if (uploadError) {
        throw uploadError;
    }


    const voiceUrl =
        "voice/" + path;


    const {
        error: messageError
    } = await supabaseClient
        .from("g_nurse_messages")
        .insert({

            conversation_id:
                currentConversation.id,

            sender_type:
                "visitor",

            message:
                null,

            voice_url:
                voiceUrl

        });


    if (messageError) {
        throw messageError;
    }


    await supabaseClient
        .from("g_nurse_conversations")
        .update({

            updated_at:
                new Date().toISOString()

        })
        .eq(
            "id",
            currentConversation.id
        );

}


function subscribeToRealtime() {

    if (!currentConversation?.id) {
        return;
    }


    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;

    }


    realtimeChannel =
        supabaseClient
            .channel(
                "g-nurse-chat-" +
                currentConversation.id
            )


            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "g_nurse_messages",
                    filter:
                        "conversation_id=eq." +
                        currentConversation.id
                },
                async function () {

                    await loadMessages();

                }
            )


            .on(
                "postgres_changes",
                {
                    event: "UPDATE",
                    schema: "public",
                    table: "g_nurse_conversations",
                    filter:
                        "id=eq." +
                        currentConversation.id
                },
                function (payload) {

                    currentConversation =
                        payload.new;

                    localStorage.setItem(
                        "g_nurse_conversation",
                        JSON.stringify(
                            currentConversation
                        )
                    );

                }
            )


            .subscribe();

}


function closeChat() {

    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel = null;

    }


    chatScreen.classList.add(
        "hidden"
    );

    welcomeScreen.classList.remove(
        "hidden"
    );

}


function autoResizeMessageBox() {

    messageInput.style.height =
        "auto";

    messageInput.style.height =
        Math.min(
            messageInput.scrollHeight,
            120
        ) + "px";

        }
    attachmentButton.addEventListener(
    "click",
    function () {

        fileInput.click();

    }
);


fileInput.addEventListener(
    "change",
    function () {

        const file =
            fileInput.files &&
            fileInput.files[0];

        if (!file) {
            return;
        }

        selectedFile = file;

        showSelectedFile(file);

    }
);


sendButton.addEventListener(
    "click",
    function () {

        sendMessage();

    }
);


messageInput.addEventListener(
    "input",
    function () {

        autoResizeMessageBox();

    }
);


messageInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


voiceButton.addEventListener(
    "click",
    function () {

        if (
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ) {

            stopVoiceRecording();

        } else {

            startVoiceRecording();

        }

    }
);


startChatButton.addEventListener(
    "click",
    function () {

        startChat();

    }
);


backButton.addEventListener(
    "click",
    function () {

        closeChat();

    }
);


/*
 * Load previously saved visitor
 * information from the phone.
 */

loadVisitorDetails();


/*
 * Try to restore the previous conversation.
 */

restoreExistingChat();


console.log(
    "G Nurse Chat initialized successfully."
);
