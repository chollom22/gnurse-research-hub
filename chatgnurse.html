<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat G Nurse | G Nurse Research Hub Nigeria</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #f2f7f7;
    color: #172b2f;
}

body {
    overflow: hidden;
}

button,
input,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 62px;
    min-height: 62px;
    background: #07562f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    z-index: 10;
}

.header-title {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-title .icon {
    font-size: 27px;
}

.header-title h1 {
    font-size: 18px;
}

.header-title small {
    display: block;
    font-size: 11px;
    opacity: .8;
    margin-top: 2px;
}

.notification-button {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.15);
    color: white;
    font-size: 21px;
    position: relative;
}

.notification-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    background: #e53935;
    color: white;
    border-radius: 20px;
    font-size: 10px;
    display: none;
    align-items: center;
    justify-content: center;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-height: 0;
    position: relative;
}

.screen {
    width: 100%;
    height: 100%;
}

/* =========================
   START SCREEN
========================= */

.start-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-y: auto;
}

.start-card {
    width: min(440px, 100%);
    background: white;
    border-radius: 18px;
    padding: 28px 22px;
    box-shadow: 0 5px 25px rgba(0,0,0,.09);
}

.logo {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    margin: 0 auto 15px;
    background: #07562f;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 35px;
}

.start-card h2 {
    text-align: center;
    color: #07562f;
    margin-bottom: 8px;
}

.start-card p {
    text-align: center;
    color: #657477;
    font-size: 14px;
    line-height: 1.5;
    margin-bottom: 24px;
}

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 6px;
}

.field input {
    width: 100%;
    height: 46px;
    border: 1px solid #ccd8d9;
    border-radius: 10px;
    padding: 0 13px;
    outline: none;
    background: #fbfdfd;
}

.field input:focus {
    border-color: #07562f;
}

.primary-button {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 11px;
    background: #07562f;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

.primary-button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.status {
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 9px;
    font-size: 13px;
    line-height: 1.4;
    display: none;
}

.status.error {
    display: block;
    background: #ffebee;
    color: #b71c1c;
}

.status.success {
    display: block;
    background: #e8f5e9;
    color: #1b5e20;
}

.status.info {
    display: block;
    background: #e3f2fd;
    color: #0d47a1;
}

/* =========================
   CHAT SCREEN
========================= */

.chat-screen {
    display: none;
    flex-direction: column;
    height: 100%;
}

.messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 15px 12px 10px;
    background:
        radial-gradient(
            circle at center,
            rgba(7,86,47,.025),
            transparent 65%
        );
}

.empty-chat {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #718083;
    font-size: 14px;
    padding: 30px;
}

.message-row {
    display: flex;
    margin-bottom: 10px;
}

.message-row.visitor {
    justify-content: flex-end;
}

.message-row.admin {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 82%;
    border-radius: 15px;
    padding: 9px 11px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
}

.message-row.visitor .message-bubble {
    background: #d8f3df;
    border-bottom-right-radius: 4px;
}

.message-row.admin .message-bubble {
    background: white;
    border-bottom-left-radius: 4px;
}

.message-text {
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14px;
    line-height: 1.45;
}

.message-meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 5px;
    margin-top: 4px;
    font-size: 10px;
    color: #718083;
}

.message-image {
    max-width: 230px;
    max-height: 300px;
    display: block;
    border-radius: 10px;
    object-fit: cover;
    margin-bottom: 5px;
}

.file-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    border-radius: 9px;
    background: rgba(0,0,0,.05);
    color: #07562f;
    text-decoration: none;
    font-size: 13px;
    word-break: break-word;
}

.voice-player {
    width: 230px;
    max-width: 100%;
}

/* =========================
   COMPOSER
========================= */

.composer {
    background: white;
    border-top: 1px solid #dce5e5;
    padding: 8px;
}

.attachment-preview {
    display: none;
    padding: 5px 7px 8px;
}

.attachment-preview-inner {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #f0f5f5;
    border-radius: 9px;
    padding: 8px;
    font-size: 12px;
}

.remove-attachment {
    margin-left: auto;
    border: none;
    background: none;
    color: #c62828;
    font-size: 18px;
}

.composer-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
}

.tool-button {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border: none;
    border-radius: 50%;
    background: #edf3f3;
    color: #07562f;
    font-size: 20px;
}

.message-input {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 110px;
    resize: none;
    border: 1px solid #ccd8d9;
    border-radius: 13px;
    padding: 11px 12px;
    outline: none;
}

.message-input:focus {
    border-color: #07562f;
}

.send-button {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    border: none;
    border-radius: 50%;
    background: #07562f;
    color: white;
    font-size: 18px;
}

/* =========================
   RECORDING
========================= */

.recording-panel {
    display: none;
    background: #fff4f4;
    border: 1px solid #ffcdd2;
    border-radius: 10px;
    padding: 9px;
    margin-bottom: 7px;
    align-items: center;
    justify-content: space-between;
}

.recording-panel.active {
    display: flex;
}

.recording-info {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #c62828;
    font-size: 13px;
    font-weight: bold;
}

.recording-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e53935;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    50% {
        opacity: .3;
    }
}

.stop-recording {
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    background: #c62828;
    color: white;
    font-size: 12px;
}

/* =========================
   LOADING
========================= */

.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
}

.loading-box {
    text-align: center;
    color: #07562f;
}

.spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #d9e8df;
    border-top-color: #07562f;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto 12px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   NOTIFICATIONS
========================= */

.notification-panel {
    position: fixed;
    top: 70px;
    right: 10px;
    width: min(350px, calc(100% - 20px));
    max-height: 70vh;
    overflow-y: auto;
    background: white;
    border-radius: 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.2);
    z-index: 50;
    display: none;
}

.notification-panel.open {
    display: block;
}

.notification-header {
    padding: 14px;
    border-bottom: 1px solid #e5eeee;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.notification-header strong {
    color: #07562f;
}

.mark-all {
    border: none;
    background: none;
    color: #07562f;
    font-size: 12px;
}

.notification-item {
    padding: 12px 14px;
    border-bottom: 1px solid #edf2f2;
}

.notification-item.unread {
    background: #eef8f1;
}

.notification-item strong {
    font-size: 13px;
}

.notification-item p {
    font-size: 12px;
    color: #607174;
    margin-top: 4px;
}

.notification-item small {
    display: block;
    margin-top: 5px;
    color: #8a999b;
    font-size: 10px;
}

.no-notifications {
    padding: 25px 15px;
    text-align: center;
    color: #788789;
    font-size: 13px;
}

/* =========================
   HIDDEN FILE INPUT
========================= */

.hidden-file {
    display: none;
}

/* =========================
   UNSEND
========================= */

.unsend-button {
    border: none;
    background: none;
    color: #888;
    font-size: 10px;
    margin-left: 4px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 500px) {

    .header {
        height: 58px;
        min-height: 58px;
    }

    .message-bubble {
        max-width: 88%;
    }

    .start-card {
        padding: 24px 18px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="header-title">

            <div class="icon">💬</div>

            <div>
                <h1>Chat G Nurse</h1>
                <small>Direct communication with G Nurse</small>
            </div>

        </div>

        <button
            type="button"
            class="notification-button"
            id="notificationButton"
            aria-label="Notifications"
        >
            🔔
            <span
                class="notification-badge"
                id="notificationBadge"
            >0</span>
        </button>

    </header>


    <!-- MAIN -->
    <main class="main">

        <!-- START SCREEN -->
        <section
            class="screen start-screen"
            id="startScreen"
        >

            <div class="start-card">

                <div class="logo">👩‍⚕️</div>

                <h2>Chat with G Nurse</h2>

                <p>
                    Send a message directly to G Nurse.
                    You can also send pictures, files and voice notes.
                </p>


                <div class="field">

                    <label for="visitorName">
                        Your name
                    </label>

                    <input
                        id="visitorName"
                        type="text"
                        placeholder="Enter your name"
                        autocomplete="name"
                    >

                </div>


                <div class="field">

                    <label for="visitorEmail">
                        Email address
                    </label>

                    <input
                        id="visitorEmail"
                        type="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>


                <div class="field">

                    <label for="visitorPhone">
                        Phone number
                    </label>

                    <input
                        id="visitorPhone"
                        type="tel"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                    >

                </div>


                <button
                    type="button"
                    class="primary-button"
                    id="startChatButton"

                    Start Chat
                </button>


                <div

                    id="startStatus"
                ></div>

            </div>

        </section>


        <!-- CHAT SCREEN -->
        <section
            class="screen chat-screen"
            id="chatScreen"
        >

            <div
                class="messages"
                id="messages"
            >

                <div
                    class="empty-chat"
                    id="emptyChat"
                >
                    No messages yet.<br>
                    Send a message to G Nurse.
                </div>

            </div>


            <div class="composer">

                <!-- ATTACHMENT PREVIEW -->

                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                >

                    <div class="attachment-preview-inner">

                        <span id="attachmentPreviewText">
                            File selected
                        </span>

                        <button
                            type="button"
                            class="remove-attachment"
                            id="removeAttachment"
                        >
                            ×
                        </button>

                    </div>

                </div>


                <!-- RECORDING PANEL -->

                <div
                    class="recording-panel"
                    id="recordingPanel"
                >

                    <div class="recording-info">

                        <span class="recording-dot"></span>

                        <span id="recordingTimer">
                            00:00
                        </span>

                        <span>
                            Recording voice note
                        </span>

                    </div>

                    <button
                        type="button"
                        class="stop-recording"
                        id="stopRecordingButton"
                    >
                        Stop
                    </button>

                </div>


                <div class="composer-row">

                    <button
                        type="button"
                        class="tool-button"
                        id="attachmentButton"
                        title="Attach file"
                    >
                        📎
                    </button>

                    <input
                        type="file"
                        id="fileInput"
                        class="hidden-file"
                        accept="*/*"
                    >


                    <button
                        type="button"
                        class="tool-button"
                        id="voiceButton"
                        title="Voice note"
                    >
                        🎤
                    </button>


                    <textarea
                        id="messageInput"
                        class="message-input"
                        rows="1"
                        placeholder="Type a message..."
                    ></textarea>


                    <button
                        type="button"
                        class="send-button"
                        id="sendButton"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </section>

    </main>

</div>


<!-- NOTIFICATION PANEL -->

<div
    class="notification-panel"
    id="notificationPanel"
>

    <div class="notification-header">

        <strong>Notifications</strong>

        <button
            type="button"
            class="mark-all"
            id="markAllNotifications"
        >
            Mark all read
        </button>

    </div>

    <div id="notificationList">

        <div class="no-notifications">
            No notifications
        </div>

    </div>

</div>


<!-- LOADING -->

<div
    class="loading-overlay"
    id="loadingOverlay"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <div id="loadingText">
            Connecting...
        </div>

    </div>

</div>


<script>

/* =========================================================
   1. SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9JL2ALhTGlVZ57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   2. GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let currentConversation = null;

let realtimeChannel = null;

let mediaRecorder = null;

let recordedChunks = [];

let recordingTimer = null;

let recordingSeconds = 0;

let selectedFile = null;

let notificationAudioContext = null;


/* =========================================================
   3. ELEMENTS
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const chatScreen =
    document.getElementById("chatScreen");

const visitorName =
    document.getElementById("visitorName");

const visitorEmail =
    document.getElementById("visitorEmail");

const visitorPhone =
    document.getElementById("visitorPhone");

const startChatButton =
    document.getElementById("startChatButton");

const startStatus =
    document.getElementById("startStatus");

const messages =
    document.getElementById("messages");

const emptyChat =
    document.getElementById("emptyChat");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachmentButton =
    document.getElementById("attachmentButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const attachmentPreviewText =
    document.getElementById("attachmentPreviewText");

const removeAttachment =
    document.getElementById("removeAttachment");

const voiceButton =
    document.getElementById("voiceButton");

const recordingPanel =
    document.getElementById("recordingPanel");

const recordingTimer =
    document.getElementById("recordingTimer");

const stopRecordingButton =
    document.getElementById("stopRecordingButton");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingText =
    document.getElementById("loadingText");

const notificationButton =
    document.getElementById("notificationButton");

const notificationBadge =
    document.getElementById("notificationBadge");

const notificationPanel =
    document.getElementById("notificationPanel");

const notificationList =
    document.getElementById("notificationList");

const markAllNotifications =
    document.getElementById("markAllNotifications");


/* =========================================================
   4. UI HELPERS
========================================================= */

function showLoading(text) {

    loadingText.textContent =
        text || "Loading...";

    loadingOverlay.style.display =
        "flex";
}


function hideLoading() {

    loadingOverlay.style.display =
        "none";
}


function showStatus(message, type) {

    startStatus.textContent =
        message || "";

    startStatus.className =
        "status " + (type || "info");
}


function clearStatus() {

    startStatus.textContent =
        "";

    startStatus.className =
        "status";
}


function showChatScreen() {

    startScreen.style.display =
        "none";

    chatScreen.style.display =
        "flex";
}


function scrollMessagesToBottom() {

    requestAnimationFrame(() => {

        messages.scrollTop =
            messages.scrollHeight;

    });
}


/* =========================================================
   5. VISITOR DETAILS
========================================================= */

function saveVisitorDetails() {

    localStorage.setItem(
        "gnurse_chat_visitor",
        JSON.stringify({
            name: visitorName.value.trim(),
            email: visitorEmail.value.trim(),
            phone: visitorPhone.value.trim()
        })
    );
}


function loadVisitorDetails() {

    try {

        const saved =
            JSON.parse(
                localStorage.getItem(
                    "gnurse_chat_visitor"
                ) || "null"
            );

        if (!saved) {
            return;
        }

        visitorName.value =
            saved.name || "";

        visitorEmail.value =
            saved.email || "";

        visitorPhone.value =
            saved.phone || "";

    } catch (error) {

        console.error(
            "Could not load saved visitor details:",
            error
        );

    }
}


/* =========================================================
   6. ANONYMOUS AUTHENTICATION
========================================================= */

async function getOrCreateAnonymousUser() {

    const {
        data,
        error
    } = await supabaseClient.auth.getUser();

    if (!error && data?.user) {

        return data.user;
    }

    const {
        data: anonymousData,
        error: anonymousError
    } =
        await supabaseClient.auth.signInAnonymously();

    if (anonymousError) {

        throw new Error(
            "Anonymous sign-in failed: " +
            anonymousError.message
        );
    }

    if (!anonymousData?.user) {

        throw new Error(
            "Supabase did not return a user."
        );
    }

    return anonymousData.user;
}


/* =========================================================
   7. FIND EXISTING CONVERSATION
========================================================= */

async function findExistingConversation() {

    const {
        data,
        error
    } = await supabaseClient
        .from("g_nurse_conversations")
        .select("*")
        .eq(
            "visitor_user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        )
        .limit(1);

    if (error) {

        throw new Error(
            "Could not check conversations: " +
            error.message
        );
    }

    return data?.[0] || null;
}


/* =========================================================
   8. CREATE CONVERSATION
========================================================= */

async function createConversation() {

    const {
        data,
        error
    } = await supabaseClient
        .from("g_nurse_conversations")
        .insert({
            visitor_user_id:
                currentUser.id,

            visitor_token:
                crypto.randomUUID(),

            visitor_name:
                visitorName.value.trim(),

            visitor_email:
                visitorEmail.value.trim() || null,

            visitor_phone:
                visitorPhone.value.trim() || null,

            status:
                "open"
        })
        .select()
        .single();

    if (error) {

        throw new Error(
            "Could not create conversation: " +
            error.message
        );
    }

    return data;
}


/* =========================================================
   9. UPDATE CONVERSATION
========================================================= */

async function updateConversationInformation() {

    const {
        error
    } = await supabaseClient
        .from("g_nurse_conversations")
        .update({
            visitor_name:
                visitorName.value.trim(),

            visitor_email:
                visitorEmail.value.trim() || null,

            visitor_phone:
                visitorPhone.value.trim() || null,

            updated_at:
                new Date().toISOString()
        })
        .eq(
            "id",
            currentConversation.id
        )
        .eq(
            "visitor_user_id",
            currentUser.id
        );

    if (error) {

        throw new Error(
            "Could not update conversation: " +
            error.message
        );
    }
}


/* =========================================================
   10. LOAD OR CREATE CONVERSATION
========================================================= */

async function loadOrCreateConversation() {

    let conversation =
        await findExistingConversation();

    if (!conversation) {

        conversation =
            await createConversation();

    }

    currentConversation =
        conversation;

    if (conversation) {

        await updateConversationInformation();

    }

    return conversation;
}


/* =========================================================
   11. START CHAT
========================================================= */

async function startChat() {

    if (startChatButton.disabled) {
        return;
    }

    const name =
        visitorName.value.trim();

    const email =

/* =========================================================
   12. MESSAGE TIME
========================================================= */

function formatMessageTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleTimeString(
        [],
        {
            hour: "numeric",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   13. HTML ESCAPE
========================================================= */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   14. PRIVATE FILE URL
========================================================= */

async function getPrivateFileUrl(reference) {

    if (!reference) {
        return null;
    }

    const parts =
        reference.split("/");

    if (parts.length < 2) {
        return reference;
    }

    const bucket =
        parts.shift();

    const path =
        parts.join("/");

    const {
        data,
        error
    } = await supabaseClient
        .storage
        .from(bucket)
        .createSignedUrl(
            path,
            3600
        );

    if (error) {

        console.error(
            "Signed URL error:",
            error
        );

        return null;
    }

    return data?.signedUrl || null;
            }
    /* =========================================================
   15. RENDER ONE MESSAGE
========================================================= */

async function renderMessage(message) {

    if (!message) {
        return;
    }

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (message.sender_type === "visitor"
            ? "visitor"
            : "admin");

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    let content = "";

    /* ---------- TEXT ---------- */

    if (message.message) {

        content += `
            <div class="message-text">
                ${escapeHTML(message.message)}
            </div>
        `;
    }


    /* ---------- IMAGE ---------- */

    if (
        message.attachment_url &&
        message.attachment_type &&
        message.attachment_type.startsWith("image/")
    ) {

        const imageUrl =
            await getPrivateFileUrl(
                message.attachment_url
            );

        if (imageUrl) {

            content += `
                <img
                    class="message-image"
                    src="${imageUrl}"
                    alt="Image"
                    loading="lazy"
                >
            `;
        }
    }


    /* ---------- FILE ---------- */

    else if (message.attachment_url) {

        const fileUrl =
            await getPrivateFileUrl(
                message.attachment_url
            );

        if (fileUrl) {

            content += `
                <a
                    class="file-link"
                    href="${fileUrl}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    📎
                    <span>
                        ${escapeHTML(
                            message.attachment_name ||
                            "Attached file"
                        )}
                    </span>
                </a>
            `;
        }
    }


    /* ---------- VOICE ---------- */

    if (message.voice_url) {

        const voiceUrl =
            await getPrivateFileUrl(
                message.voice_url
            );

        if (voiceUrl) {

            content += `
                <audio
                    class="voice-player"
                    controls
                    preload="metadata"
                    data-message-id="${message.id}"
                >
                    <source src="${voiceUrl}">
                </audio>
            `;
        }
    }


    if (!content) {

        content = `
            <div class="message-text">
                Message unavailable
            </div>
        `;
    }


    bubble.innerHTML =
        content;


    /* ---------- META ---------- */

    const meta =
        document.createElement("div");

    meta.className =
        "message-meta";

    const time =
        document.createElement("span");

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    meta.appendChild(time);


    /* ---------- VISITOR MESSAGE STATUS ---------- */

    if (
        message.sender_type === "visitor"
    ) {

        const status =
            document.createElement("span");

        if (message.viewed) {

            status.textContent =
                "✓✓";

        } else {

            status.textContent =
                "✓";

        }

        meta.appendChild(status);


        /* ---------- UNSEND ---------- */

        if (!message.deleted_at) {

            const unsend =
                document.createElement("button");

            unsend.type =
                "button";

            unsend.className =
                "unsend-button";

            unsend.textContent =
                "Unsend";

            unsend.addEventListener(
                "click",
                () => unsendMessage(message.id)
            );

            meta.appendChild(unsend);
        }
    }


    bubble.appendChild(meta);

    row.appendChild(bubble);

    messages.appendChild(row);


    /* ---------- ADMIN MESSAGE SEEN ---------- */

    if (
        message.sender_type === "admin" &&
        !message.viewed
    ) {

        markMessageSeen(
            message.id
        );
    }


    /* ---------- VOICE LISTENED ---------- */

    const audio =
        bubble.querySelector(
            "audio[data-message-id]"
        );

    if (audio) {

        audio.addEventListener(
            "play",
            () => {

                markVoiceListened(
                    message.id
                );

            },
            {
                once: true
            }
        );
    }
}

    /* =========================================================
   26. UPLOAD FILE TO SUPABASE STORAGE
========================================================= */

async function uploadFileToStorage(
    file,
    bucket
) {

    if (!file) {
        throw new Error(
            "No file selected."
        );
    }

    if (!currentUser) {
        throw new Error(
            "User session not available."
        );
    }

    if (!currentConversation) {
        throw new Error(
            "Conversation not available."
        );
    }


    const safeName =
        file.name
            .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


    const uniqueName =
        Date.now() +
        "_" +
        crypto.randomUUID() +
        "_" +
        safeName;


    const path =
        currentUser.id +
        "/" +
        currentConversation.id +
        "/" +
        uniqueName;


    const {
        error
    } = await supabaseClient
        .storage
        .from(bucket)
        .upload(
            path,
            file,
            {
                cacheControl:
                    "3600",

                upsert:
                    false,

                contentType:
                    file.type ||
                    "application/octet-stream"
            }
        );


    if (error) {

        throw new Error(
            "File upload failed: " +
            error.message
        );
    }


    return path;
}

/* =========================================================
   30. VOICE RECORDING
========================================================= */

async function startVoiceRecording() {

    if (!currentConversation) {

        alert(
            "Please start the chat first."
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Voice recording is not supported by this browser."
        );

        return;
    }


    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });


        recordedChunks =
            [];


        let options = {};


        if (
            MediaRecorder.isTypeSupported(
                "audio/webm;codecs=opus"
            )
        ) {

            options.mimeType =
                "audio/webm;codecs=opus";

        } else if (
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            options.mimeType =
                "audio/webm";
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        mediaRecorder.ondataavailable =
            function(event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async function() {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                const mimeType =
                    mediaRecorder.mimeType ||
                    "audio/webm";


                const blob =
                    new Blob(
                        recordedChunks,
                        {
                            type: mimeType
                        }
                    );


                if (
                    blob.size === 0
                ) {

                    recordingPanel
                        .classList
                        .remove("active");

                    return;
                }


                try {

                    await sendVoiceNote(
                        blob
                    );

                } catch (error) {

                    console.error(
                        "Voice send error:",
                        error
                    );

                    alert(
                        error.message ||
                        "Unable to send voice note."
                    );
                }
            };


        mediaRecorder.start();


        recordingSeconds =
            0;

        recordingTimer.textContent =
            "00:00";

        recordingPanel
            .classList
            .add("active");


        recordingTimer =
            window.setInterval(
                function() {

                    recordingSeconds++;

                    const minutes =
                        Math.floor(
                            recordingSeconds / 60
                        );

                    const seconds =
                        recordingSeconds % 60;

                    document.getElementById(
                        "recordingTimer"
                    ).textContent =
                        String(minutes)
                            .padStart(2, "0") +
                        ":" +
                        String(seconds)
                            .padStart(2, "0");

                },
                1000
            );


    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        alert(
            "Microphone permission is required to record a voice note."
        );
    }
}


/* =========================================================
   31. STOP VOICE RECORDING
========================================================= */

function stopVoiceRecording() {

    if (
        recordingTimer
    ) {

        clearInterval(
            recordingTimer
        );

        recordingTimer =
            null;
    }


    recordingPanel
        .classList
        .remove("active");


    if (
        mediaRecorder &&
        mediaRecorder.state !== "inactive"
    ) {

        mediaRecorder.stop();
    }
}

/* =========================================================
   35. NOTIFICATION AUDIO
========================================================= */

function playNotificationSound() {

    try {

        if (!notificationAudioContext) {

            notificationAudioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }


        const oscillator =
            notificationAudioContext
                .createOscillator();

        const gain =
            notificationAudioContext
                .createGain();


        oscillator.frequency.value =
            880;

        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            0.0001,
            notificationAudioContext
                .currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.08,
            notificationAudioContext
                .currentTime + 0.01
        );

        gain.gain.exponentialRampToValueAtTime(
            0.0001,
            notificationAudioContext
                .currentTime + 0.18
        );


        oscillator.connect(
            gain
        );

        gain.connect(
            notificationAudioContext
                .destination
        );


        oscillator.start();

        oscillator.stop(
            notificationAudioContext
                .currentTime + 0.2
        );

    } catch (error) {

        console.error(
            "Notification sound error:",
            error
        );
    }
    }

}

/* =========================================================

========================================================= */

function renderNotifications(
    notificationData
) {

    notificationList.innerHTML =
        "";


    if (
        !notificationData ||
        notificationData.length === 0
    ) {

        notificationList.innerHTML = `
            <div class="no-notifications">
                No notifications
            </div>
        `;

        notificationBadge.style.display =
            "none";

        return;
    }


    let unreadCount =
        0;


    notificationData.forEach(
        function(notification) {

            if (
                !notification.is_read
            ) {

                unreadCount++;
            }


            const item =
                document.createElement("div");

            item.className =
                "notification-item" +
                (
                    notification.is_read
                        ? ""
                        : " unread"
                );


            item.innerHTML = `
                <strong>
                    ${escapeHTML(
                        notification.title ||
                        "G Nurse"
                    )}
                </strong>

                <p>
                    ${escapeHTML(
                        notification.body ||
                        "New message"
                    )}
                </p>

                <small>
                    ${formatMessageTime(
                        notification.created_at
                    )}
                </small>
            `;


            item.addEventListener(
                "click",
                async function() {

                    if (
                        !notification.is_read
                    ) {

                        await markNotificationRead(
                            notification.id
                        );

                        notification.is_read =
                            true;

                        item.classList
                            .remove(
                                "unread"
                            );

                        unreadCount =
                            Math.max(
                                0,
                                unreadCount - 1
                            );

                        updateNotificationBadge(
                            unreadCount
                        );
                    }


                    notificationPanel
                        .classList
                        .remove(
                            "open"
                        );
                }
            );


            notificationList.appendChild(
                item
            );
        }
    );


    updateNotificationBadge(
        unreadCount
    );
}


/* =========================================================
   40. NOTIFICATION BADGE
========================================================= */

function updateNotificationBadge(
    count
) {

    if (!count || count <= 0) {

        notificationBadge.style.display =
            "none";

        notificationBadge.textContent =
            "0";

        return;
    }


    notificationBadge.textContent =
        count > 99
            ? "99+"
            : String(count);


    notificationBadge.style.display =
        "flex";
}


/* =========================================================
   41. MARK ONE NOTIFICATION READ
========================================================= */

async function markNotificationRead(
    notificationId
) {

    if (!notificationId) {
        return;
    }


    try {

        const {
            error
        } = await supabaseClient
            .rpc(
                "g_nurse_mark_notification_read",
                {
                    p_notification_id:
                        notificationId
                }
            );


        if (error) {

            console.error(
                "Mark notification read error:",
                error
            );
        }

    } catch (error) {

        console.error(
            "Notification read error:",
            error
        );
    }
}


/* =========================================================
   42. MARK ALL NOTIFICATIONS READ
========================================================= */

async function markAllNotificationsRead() {

    try {

        const {
            error
        } = await supabaseClient
            .rpc(
                "g_nurse_mark_all_notifications_read"
            );


        if (error) {

            throw error;
        }


        await loadNotifications();


    } catch (error) {

        console.error(
            "Mark all notifications error:",
            error
        );
    }
}


/* =========================================================
   43. NOTIFICATION BUTTON
========================================================= */

notificationButton.addEventListener(
    "click",
    async function() {

        notificationPanel
            .classList
            .toggle("open");


        if (
            notificationPanel
                .classList
                .contains("open")
        ) {

            await loadNotifications();
        }
    }
);


/* =========================================================
   44. MARK ALL BUTTON
========================================================= */

markAllNotifications.addEventListener(
    "click",
    async function(event) {

        event.stopPropagation();

        await markAllNotificationsRead();
    }
);


/* =========================================================
   45. REALTIME CHANNEL
========================================================= */

function startRealtime() {

    if (
        !currentConversation ||
        !currentUser
    ) {
        return;
    }


    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel =
            null;
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "g-nurse-chat-" +
                currentConversation.id
            );


    /* NEW MESSAGE */

    realtimeChannel
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "g_nurse_messages",
                filter:
                    "conversation_id=eq." +
                    currentConversation.id
            },
            async function(payload) {

                const message =
                    payload.new;


                if (
                    !message ||
                    message.deleted_at
                ) {
                    return;
                }


                await renderMessage(
                    message
                );


                scrollMessagesToBottom();


                if (
                    message.sender_type ===
                    "admin"
                ) {

                    playNotificationSound();
                }
            }
        );


    /* MESSAGE UPDATE */

    realtimeChannel
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "g_nurse_messages",
                filter:
                    "conversation_id=eq." +
                    currentConversation.id
            },
            async function() {

                await loadMessages();
            }
        );


    /* NEW NOTIFICATION */

    realtimeChannel
        .on(
            "postgres_changes",
            {
                event: "INSERT",
                schema: "public",
                table: "g_nurse_notifications",
                filter:
                    "recipient_user_id=eq." +
                    currentUser.id
            },
            async function(payload) {

                const notification =
                    payload.new;


                playNotificationSound();


                showBrowserNotification(
                    notification
                );


                await loadNotifications();
            }
        );


    /* NOTIFICATION UPDATE */

    realtimeChannel
        .on(
            "postgres_changes",
            {
                event: "UPDATE",
                schema: "public",
                table: "g_nurse_notifications",
                filter:
                    "recipient_user_id=eq." +
                    currentUser.id
            },
            async function() {

                await loadNotifications();
            }
        );


    realtimeChannel.subscribe(
        function(status) {

            console.log(
                "G Nurse realtime status:",
                status
            );
        }
    );
    }
/* =========================================================
   46. CLOSE NOTIFICATION PANEL WHEN CLICKING OUTSIDE
========================================================= */

document.addEventListener(
    "click",
    function(event) {

        if (
            !notificationPanel.contains(event.target) &&
            !notificationButton.contains(event.target)
        ) {

            notificationPanel
                .classList
                .remove("open");
        }
    }
);


/* =========================================================
   47. VISIBILITY CHANGE
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function() {

        if (
            document.visibilityState === "visible" &&
            currentConversation
        ) {

            await loadMessages();

            await loadNotifications();
        }
    }
);


/* =========================================================
   48. PAGE LEAVE CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    function() {

        if (realtimeChannel) {

            supabaseClient
                .removeChannel(
                    realtimeChannel
                );

            realtimeChannel =
                null;
        }

        if (
            recordingTimer
        ) {

            clearInterval(
                recordingTimer
            );

            recordingTimer =
                null;
        }

        if (
            mediaRecorder &&
            mediaRecorder.state !== "inactive"
        ) {

            mediaRecorder.stop();
        }
    }
);


/* =========================================================
   49. INITIALIZE PAGE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadVisitorDetails();

        console.log(
            "G Nurse Chat loaded."
        );
    }
);

</script>
