<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Chat G Nurse</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #eef4f1;
        }

        body {
            display: flex;
            justify-content: center;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            cursor: pointer;
            border: none;
        }

        /* =========================
           MAIN APP
        ========================= */

        #app {
            width: 100%;
            max-width: 520px;
            height: 100dvh;
            background: #f7faf8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* =========================
           TOP BAR
        ========================= */

        .topbar {
            height: 58px;
            min-height: 58px;
            background: #07562f;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            z-index: 20;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: transparent;
            color: white;
            font-size: 24px;
        }

        .back-btn:active {
            background: rgba(255,255,255,.15);
        }

        .title-area {
            flex: 1;
            min-width: 0;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 11px;
            opacity: .85;
            margin-top: 2px;
        }

        .notification-btn {
            position: relative;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: transparent;
            color: white;
            font-size: 22px;
        }

        .notification-count {
            position: absolute;
            top: 2px;
            right: 1px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            border-radius: 10px;
            background: #e53935;
            color: white;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* =========================
           CONTENT
        ========================= */

        #content {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .screen {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .screen.active {
            display: flex;
        }

        /* =========================
           START SCREEN
        ========================= */

        #startScreen {
            overflow-y: auto;
            padding: 16px;
        }

        .welcome-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
            margin-bottom: 14px;
        }

        .welcome-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #07562f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 31px;
            margin-bottom: 14px;
        }

        .welcome-card h2 {
            margin: 0 0 8px;
            color: #07562f;
            font-size: 22px;
        }

        .welcome-card p {
            margin: 0;
            color: #555;
            line-height: 1.5;
            font-size: 14px;
        }

        .form-card {
            background: white;
            border-radius: 18px;
            padding: 18px;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .field {
            margin-bottom: 13px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .field input {
            width: 100%;
            height: 46px;
            border: 1px solid #ccd5d0;
            border-radius: 10px;
            padding: 0 12px;
            outline: none;
            font-size: 15px;
            background: white;
        }

        .field input:focus {
            border-color: #07562f;
        }

        .start-btn {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            background: #07562f;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-top: 5px;
        }

        .start-btn:active {
            transform: scale(.99);
        }

        .status-box {
            margin-top: 13px;
            padding: 11px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
        }

        .status-box.error {
            display: block;
            background: #ffebee;
            color: #b71c1c;
        }

        .status-box.success {
            display: block;
            background: #e8f5e9;
            color: #1b5e20;
        }

        /* =========================
           CHAT SCREEN
        ========================= */

        #chatScreen {
            overflow: hidden;
        }

        .chat-status {
            height: 34px;
            min-height: 34px;
            display: flex;
            align-items: center;
            padding: 0 13px;
            background: #e8f5e9;
            color: #1b5e20;
            font-size: 12px;
            border-bottom: 1px solid #d7e3da;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #43a047;
            margin-right: 7px;
        }

        /* =========================
           ONLY THIS AREA SCROLLS
        ========================= */

        #messagesContainer {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px 11px;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        .empty-chat {
            text-align: center;
            color: #777;
            font-size: 13px;
            padding: 35px 20px;
        }

        .message-row {
            display: flex;
            margin-bottom: 9px;
            width: 100%;
        }

        .message-row.visitor {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 82%;
            padding: 9px 11px;
            border-radius: 15px;
            word-break: break-word;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        .message-row.visitor .message-bubble {
            background: #07562f;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.admin .message-bubble {
            background: white;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .message-text {
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.4;
        }

        .message-time {
            font-size: 9px;
            opacity: .65;
            text-align: right;
            margin-top: 4px;
        }

        .attachment-image {
            display: block;
            width: 100%;
            max-width: 240px;
            max-height: 280px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        .attachment-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 10px;
            border-radius: 9px;
            background: rgba(0,0,0,.06);
            color: inherit;
            text-decoration: none;
            font-size: 13px;
        }

        .voice-player {
            width: 220px;
            max-width: 100%;
        }

        /* =========================
           COMPOSER
        ========================= */

        .composer {
            min-height: 64px;
            padding: 8px 8px;
            background: white;
            border-top: 1px solid #d8dedb;
            display: flex;
            align-items: flex-end;
            gap: 6px;
            z-index: 10;
        }

        .composer-btn {
            flex: 0 0 40px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #edf2ef;
            color: #07562f;
            font-size: 19px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .composer-btn.recording {
            background: #e53935;
            color: white;
        }

        #messageInput {
            flex: 1;
            min-width: 0;
            min-height: 42px;
            max-height: 120px;
            padding: 10px 13px;
            border: 1px solid #ccd5d0;
            border-radius: 21px;
            outline: none;
            background: white;
            font-family: inherit;
            font-size: 15px;
            line-height: 21px;
            resize: none;
            overflow-y: hidden;
        }

        #messageInput:focus {
            border-color: #07562f;
        }

        .send-btn {
            flex: 0 0 42px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #07562f;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #fileInput {
            display: none;
        }

        /* =========================
           NOTIFICATIONS
        ========================= */

        #notificationPanel {
            position: absolute;
            top: 58px;
            right: 8px;
            width: min(340px, calc(100% - 16px));
            max-height: 70vh;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.2);
            z-index: 100;
            display: none;
        }

        #notificationPanel.show {
            display: block;
        }

        .notification-header {
            padding: 14px;
            border-bottom: 1px solid #eee;
            font-weight: bold;
            color: #07562f;
        }

        .notification-item {
            padding: 12px 14px;
            border-bottom: 1px solid #eee;
        }

        .notification-item.unread {
            background: #f1f8f3;
        }

        .notification-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .notification-body {
            font-size: 12px;
            color: #555;
            line-height: 1.4;
        }

        .notification-empty {
            padding: 20px;
            text-align: center;
            color: #777;
            font-size: 13px;
        }

        /* =========================
           IMAGE VIEWER
        ========================= */

        #imageViewer {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            padding: 15px;
        }

        #imageViewer.show {
            display: flex;
        }

        #imageViewer img {
            max-width: 100%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 5px;
        }

        .close-viewer {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: white;
            color: #222;
            font-size: 22px;
        }

        /* =========================
           LOADING
        ========================= */

        #loadingOverlay {
            position: fixed;
            inset: 0;
            background: rgba(255,255,255,.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #loadingOverlay.show {
            display: flex;
        }

        .loader-box {
            background: white;
            padding: 20px 25px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
            text-align: center;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #dce8df;
            border-top-color: #07562f;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 521px) {
            body {
                background: #dce7e1;
            }

            #app {
                box-shadow: 0 0 25px rgba(0,0,0,.15);
            }
        }
    </style>
</head>

<script>

/* =========================
   SUPABASE CONFIGURATION
========================= */

const SUPABASE_URL =
    "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   GLOBAL VARIABLES
========================= */

let currentUser = null;
let currentConversation = null;

let messageChannel = null;
let notificationChannel = null;

let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;


/* =========================
   ELEMENTS
========================= */

const startScreen =
    document.getElementById("startScreen");

const chatScreen =
    document.getElementById("chatScreen");

const visitorName =
    document.getElementById("visitorName");

const visitorEmail =
    document.getElementById("visitorEmail");

const visitorPhone =
    document.getElementById("visitorPhone");

const startStatus =
    document.getElementById("startStatus");

const startChatBtn =
    document.getElementById("startChatBtn");

const messagesContainer =
    document.getElementById("messagesContainer");

const messageInput =
    document.getElementById("messageInput");

const fileInput =
    document.getElementById("fileInput");

const voiceBtn =
    document.getElementById("voiceBtn");

const notificationCount =
    document.getElementById("notificationCount");

const notificationPanel =
    document.getElementById("notificationPanel");

const notificationList =
    document.getElementById("notificationList");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingText =
    document.getElementById("loadingText");

const connectionStatus =
    document.getElementById("connectionStatus");


/* =========================
   LOADING FUNCTIONS
========================= */

function showLoading(
    text = "Please wait..."
) {

    loadingText.textContent = text;

    loadingOverlay.classList.add(
        "show"
    );
}


function hideLoading() {

    loadingOverlay.classList.remove(
        "show"
    );
}


/* =========================
   STATUS MESSAGE
========================= */

function showStartStatus(
    message,
    type = "error"
) {

    startStatus.textContent =
        message;

    startStatus.className =
        "status-box " + type;
}


/* =========================
   RESTORE VISITOR DETAILS
========================= */

function restoreVisitorDetails() {

    visitorName.value =
        localStorage.getItem(
            "g_nurse_visitor_name"
        ) || "";

    visitorEmail.value =
        localStorage.getItem(
            "g_nurse_visitor_email"
        ) || "";

    visitorPhone.value =
        localStorage.getItem(
            "g_nurse_visitor_phone"
        ) || "";
}


/* =========================
   SAVE VISITOR DETAILS
========================= */

function saveVisitorDetails() {

    localStorage.setItem(
        "g_nurse_visitor_name",
        visitorName.value.trim()
    );

    localStorage.setItem(
        "g_nurse_visitor_email",
        visitorEmail.value.trim()
    );

    localStorage.setItem(
        "g_nurse_visitor_phone",
        visitorPhone.value.trim()
    );
}


/* =========================
   VISITOR TOKEN
========================= */

function getVisitorToken() {

    let token =
        localStorage.getItem(
            "g_nurse_visitor_token"
        );

    if (!token) {

        if (
            window.crypto &&
            typeof window.crypto.randomUUID ===
            "function"
        ) {

            token =
                window.crypto.randomUUID();

        } else {

            token =
                "visitor-" +
                Date.now() +
                "-" +
                Math.random()
                    .toString(36)
                    .substring(2);
        }

        localStorage.setItem(
            "g_nurse_visitor_token",
            token
        );
    }

    return token;
}


/* =========================
   AUTHENTICATION
========================= */

async function ensureAuthenticated() {

    const {
        data: sessionData,
        error: sessionError
    } =
        await supabaseClient.auth.getSession();

    if (sessionError) {
        throw sessionError;
    }

    if (
        sessionData &&
        sessionData.session &&
        sessionData.session.user
    ) {

        currentUser =
            sessionData.session.user;

        return currentUser;
    }

    const {
        data,
        error
    } =
        await supabaseClient.auth
            .signInAnonymously();

    if (error) {
        throw error;
    }

    if (
        !data ||
        !data.user
    ) {

        throw new Error(
            "Anonymous authentication did not return a user."
        );
    }

    currentUser =
        data.user;

    return currentUser;
}


/* =========================
   CREATE OR RESTORE
   CONVERSATION
========================= */

async function createOrRestoreConversation() {

    const token =
        getVisitorToken();

    const name =
        visitorName.value.trim();

    const email =
        visitorEmail.value.trim();

    const phone =
        visitorPhone.value.trim();


    let conversation = null;


    /* =========================
       FIND BY USER ID
    ========================= */

    const {
        data: userConversation,
        error: userConversationError
    } =
        await supabaseClient
            .from("g_nurse_conversations")
            .select("*")
            .eq(
                "visitor_user_id",
                currentUser.id
            )
            .order(
                "updated_at",
                {
                    ascending: false
                }
            )
            .limit(1)
            .maybeSingle();


    if (
        userConversationError &&
        userConversationError.code !==
        "PGRST116"
    ) {

        throw userConversationError;
    }


    if (userConversation) {

        conversation =
            userConversation;

    } else {

        /* =========================
           FIND BY VISITOR TOKEN
        ========================= */

        const {
            data: tokenConversation,
            error: tokenError
        } =
            await supabaseClient
                .from(
                    "g_nurse_conversations"
                )
                .select("*")
                .eq(
                    "visitor_token",
                    token
                )
                .order(
                    "updated_at",
                    {
                        ascending: false
                    }
                )
                .limit(1)
                .maybeSingle();


        if (
            tokenError &&
            tokenError.code !==
            "PGRST116"
        ) {

            throw tokenError;
        }


        if (tokenConversation) {

            conversation =
                tokenConversation;


            const {
                data: updatedConversation,
                error: updateError
            } =
                await supabaseClient
                    .from(
                        "g_nurse_conversations"
                    )
                    .update({
                        visitor_name:
                            name,

                        visitor_email:
                            email,

                        visitor_phone:
                            phone,

                        visitor_user_id:
                            currentUser.id,

                        updated_at:
                            new Date()
                                .toISOString()
                    })
                    .eq(
                        "id",
                        conversation.id
                    )
                    .select("*")
                    .single();


            if (updateError) {
                throw updateError;
            }

            conversation =
                updatedConversation;

        } else {

            /* =========================
               CREATE NEW CONVERSATION
            ========================= */

            const {
                data: newConversation,
                error: createError
            } =
                await supabaseClient
                    .from(
                        "g_nurse_conversations"
                    )
                    .insert({
                        visitor_token:
                            token,

                        visitor_name:
                            name,

                        visitor_email:
                            email,

                        visitor_phone:
                            phone,

                        status:
                            "open",

                        visitor_user_id:
                            currentUser.id
                    })
                    .select("*")
                    .single();


            if (createError) {
                throw createError;
            }

            conversation =
                newConversation;
        }
    }


    if (!conversation) {

        throw new Error(
            "Conversation could not be created."
        );
    }


    currentConversation =
        conversation;


    localStorage.setItem(
        "g_nurse_conversation_id",
        conversation.id
    );
}

/* =========================
   DISPLAY MESSAGE
========================= */

function displayMessage(
    message,
    scroll = true
) {

    if (!message) {
        return;
    }


    const empty =
        document.getElementById(
            "emptyChat"
        );

    if (empty) {
        empty.remove();
    }


    const row =
        document.createElement(
            "div"
        );


    const sender =
        message.sender_type ===
        "visitor"
            ? "visitor"
            : "admin";


    row.className =
        "message-row " +
        sender;


    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "message-bubble";


    /* =========================
       ATTACHMENT
    ========================= */

    if (
        message.attachment_url
    ) {

        const type =
            message.attachment_type ||
            "";


        if (
            type.startsWith(
                "image/"
            )
        ) {

            const image =
                document.createElement(
                    "img"
                );

            image.className =
                "attachment-image";

            image.src =
                message.attachment_url;

            image.alt =
                message.attachment_name ||
                "Image";


            image.addEventListener(
                "click",
                function () {

                    openImageViewer(
                        message.attachment_url
                    );
                }
            );


            bubble.appendChild(
                image
            );

        } else {

            const link =
                document.createElement(
                    "a"
                );

            link.className =
                "attachment-link";

            link.href =
                message.attachment_url;

            link.target =
                "_blank";

            link.rel =
                "noopener noreferrer";

            link.textContent =
                "📎 " +
                (
                    message.attachment_name ||
                    "Open attachment"
                );


            bubble.appendChild(
                link
            );
        }
    }


    /* =========================
       VOICE NOTE
    ========================= */

    if (
        message.voice_url
    ) {

        const audio =
            document.createElement(
                "audio"
            );

        audio.className =
            "voice-player";

        audio.controls =
            true;

        audio.preload =
            "metadata";

        audio.src =
            message.voice_url;


        bubble.appendChild(
            audio
        );
    }


    /* =========================
       TEXT
    ========================= */

    if (
        message.message &&
        message.message.trim()
    ) {

        const text =
            document.createElement(
                "div"
            );

        text.className =
            "message-text";

        text.textContent =
            message.message;


        bubble.appendChild(
            text
        );
    }


    /* =========================
       TIME
    ========================= */

    const time =
        document.createElement(
            "div"
        );

    time.className =
        "message-time";

    time.textContent =
        formatTime(
            message.created_at
        );


    bubble.appendChild(
        time
    );


    row.appendChild(
        bubble
    );

    messagesContainer.appendChild(
        row
    );


    /* =========================
       MARK ADMIN MESSAGE VIEWED
    ========================= */

    if (
        message.sender_type !==
        "visitor" &&
        !message.viewed
    ) {

        markMessageViewed(
            message.id
        );
    }


    if (scroll) {

        scrollMessagesToBottom();
    }
}

/* =========================
   SEND FILE
========================= */

async function sendFile(
    file
) {

    if (!currentConversation) {

        alert(
            "Please start the chat first."
        );

        return;
    }


    if (!file) {
        return;
    }


    showLoading(
        "Uploading file..."
    );


    try {

        const safeName =
            file.name.replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
            );


        const filePath =
            "visitors/" +
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeName;


        /* =========================
           UPLOAD FILE
        ========================= */

        const {
            error: uploadError
        } =
            await supabaseClient
                 await supabaseClient
                .storage
                .from(
                    "g-nurse-files"
                )
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl:
                            "3600",

                        upsert:
                            false,

                        contentType:
                            file.type ||
                            "application/octet-stream"
                    }
                );


        if (uploadError) {
            throw uploadError;
        }


        /* =========================
           CREATE TEMPORARY URL
        ========================= */

        const {
            data: signedUrlData,
            error: signedUrlError
        } =
            await supabaseClient
                .storage
                .from(
                    "g-nurse-files"
                )
                .createSignedUrl(
                    filePath,
                    60 * 60 * 24
                );


        if (signedUrlError) {
            throw signedUrlError;
        }


        const fileUrl =
            signedUrlData &&
            signedUrlData.signedUrl;


        if (!fileUrl) {

            throw new Error(
                "Could not create file URL."
            );
        }


        /* =========================
           SAVE FILE MESSAGE
        ========================= */

        const {
            data,
            error
        } =
            await supabaseClient
                .from(
                    "g_nurse_messages"
                )
                .insert({
                    conversation_id:
                        currentConversation.id,

                    sender_type:
                        "visitor",

                    attachment_url:
                        fileUrl,

                    attachment_name:
                        file.name,

                    attachment_type:
                        file.type ||
                        "application/octet-stream"
                })
                .select("*")
                .single();


        if (error) {
            throw error;
        }


        if (data) {

            displayMessage(
                data,
                true
            );
        }

    } catch (error) {

        console.error(
            "FILE SEND ERROR:",
            error
        );

        alert(
            getReadableError(error)
        );

    } finally {

        hideLoading();
    }
}

/* =========================
   START RECORDING
========================= */

async function startRecording() {

    if (!currentConversation) {

        alert(
            "Please start the chat first."
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Voice recording is not supported by this browser."
        );

        return;
    }


    try {

        const stream =
            await navigator.mediaDevices
                .getUserMedia({
                    audio: true
                });


        audioChunks = [];


        if (
            typeof MediaRecorder ===
            "undefined"
        ) {

            stream
                .getTracks()
                .forEach(
                    function (track) {
                        track.stop();
                    }
                );

            throw new Error(
                "Voice recording is not supported."
            );
        }


        let options = {};


        if (
            MediaRecorder.isTypeSupported &&
            MediaRecorder.isTypeSupported(
                "audio/webm"
            )
        ) {

            options = {
                mimeType:
                    "audio/webm"
            };
        }


        mediaRecorder =
            new MediaRecorder(
                stream,
                options
            );


        mediaRecorder.addEventListener(
            "dataavailable",
            function (event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            }
        );


        mediaRecorder.addEventListener(
            "stop",
            async function () {

                stream
                    .getTracks()
                    .forEach(
                        function (track) {
                            track.stop();
                        }
                    );


                const blob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                                mediaRecorder.mimeType ||
                                "audio/webm"
                        }
                    );


                isRecording =
                    false;


                voiceBtn.classList.remove(
                    "recording"
                );

                voiceBtn.textContent =
                    "🎙️";


                await sendVoiceNote(
                    blob
                );
            }
        );


        mediaRecorder.start();

        isRecording =
            true;


        voiceBtn.classList.add(
            "recording"
        );

        voiceBtn.textContent =
            "⏹️";

    } catch (error) {

        console.error(
            "RECORDING ERROR:",
            error
        );

        alert(
            error.message ||
            "Microphone permission is required to record a voice note."
        );
    }
}


/* =========================
   STOP RECORDING
========================= */

function stopRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ) {

        mediaRecorder.stop();
    }
}

/* =========================
   REALTIME
========================= */

function setupRealtime() {

    cleanupRealtime();


    if (!currentConversation) {
        return;
    }


    /* =========================
       MESSAGE REALTIME
    ========================= */

    messageChannel =
        supabaseClient
            .channel(
                "g-nurse-message-" +
                currentConversation.id
            )
            .on(
                "postgres_changes",
                {
                    event:
                        "INSERT",

                    schema:
                        "public",

                    table:
                        "g_nurse_messages",

                    filter:
                        "conversation_id=eq." +
                        currentConversation.id
                },
                function (payload) {

                    const message =
                        payload.new;


                    if (
                        message &&
                        message.sender_type !==
                        "visitor"
                    ) {

                        displayMessage(
                            message,
                            true
                        );

                        loadNotifications();
                    }
                }
            )
            .subscribe(
                function (status) {

                    console.log(
                        "Message realtime:",
                        status
                    );


                    if (
                        status ===
                        "SUBSCRIBED"
                    ) {

                        connectionStatus.textContent =
                            "Connected to G Nurse";

                    } else if (
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        connectionStatus.textContent =
                            "Realtime connection error";
                    }
                }
            );


    /* =========================
       NOTIFICATION REALTIME
    ========================= */

    if (currentUser) {

        notificationChannel =
            supabaseClient
                .channel(
                    "g-nurse-notification-" +
                    currentUser.id
                )
                .on(
                    "postgres_changes",
                    {
                        event:
                            "INSERT",

                        schema:
                            "public",

                        table:
                            "g_nurse_notifications",

                        filter:
                            "recipient_user_id=eq." +
                            currentUser.id
                    },
                    function () {

                        loadNotifications();
                    }
                )
                .subscribe(
                    function (status) {

                        console.log(
                            "Notification realtime:",
                            status
                        );
                    }
                );
    }
}


/* =========================
   CLEAN REALTIME
========================= */

function cleanupRealtime() {

    if (messageChannel) {

        supabaseClient.removeChannel(
            messageChannel
        );

        messageChannel =
            null;
    }


    if (notificationChannel) {

        supabaseClient.removeChannel(
            notificationChannel
        );

        notificationChannel =
            null;
    }
}


/* =========================
   LOAD NOTIFICATIONS
========================= */

async function loadNotifications() {

    if (!currentUser) {
        return;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .from(
                "g_nurse_notifications"
            )
            .select("*")
            .eq(
                "recipient_user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(30);


    if (error) {

        console.warn(
            "NOTIFICATION ERROR:",
            error
        );

        return;
    }


    notificationList.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        notificationList.innerHTML =
            '<div class="notification-empty">' +
            'No notifications' +
            '</div>';

        notificationCount.style.display =
            "none";

        return;
    }


    let unread =
        0;


    data.forEach(
        function (notification) {

            if (
                !notification.is_read
            ) {

                unread++;
            }


            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "notification-item" +
                (
                    notification.is_read
                        ? ""
                        : " unread"
                );


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "notification-title";

            title.textContent =
                notification.title ||
                "G Nurse";


            const body =
                document.createElement(
                    "div"
                );

            body.className =
                "notification-body";

            body.textContent =
                notification.body ||
                "";


            item.appendChild(
                title
            );

            item.appendChild(
                body
            );


            notificationList.appendChild(
                item
            );
        }
    );


    if (unread > 0) {

        notificationCount.textContent =
            unread > 99
                ? "99+"
                : unread;

        notificationCount.style.display =
            "flex";

    } else {

        notificationCount.style.display =
            "none";
    }
}

/* =========================
   FORMAT TIME
========================= */

function formatTime(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "";
    }


    return date.toLocaleTimeString(
        [],
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );
}


/* =========================
   READABLE ERRORS
========================= */

function getReadableError(
    error
) {

    if (!error) {

        return (
            "An unknown error occurred."
        );
    }


    const message =
        error.message ||
        error.error_description ||
        error.details ||
        String(error);


    if (
        message
            .toLowerCase()
            .includes(
                "signups not allowed"
            )
    ) {

        return (
            "Anonymous sign-in is disabled in Supabase. " +
            "Enable Anonymous Sign-ins in Authentication settings."
        );
    }


    if (
        message
            .toLowerCase()
            .includes(
                "row-level security"
            )
    ) {

        return (
            "Supabase security policy blocked this action. " +
            "Please check the RLS policy for this table."
        );
    }


    if (
        message
            .toLowerCase()
            .includes(
                "permission denied"
            )
    ) {

        return (
            "Permission denied by Supabase. " +
            "Please check the relevant RLS or Storage policy."
        );
    }


    return message;
}

                "show"
            ) &&
            !panel.contains(
                event.target
            ) &&
                     !button.contains(
                event.target
            )
        ) {

            panel.classList.remove(
                "show"
            );
        }
    }
);


/* =========================
   IMAGE VIEWER
========================= */

const imageViewer =
    document.getElementById(
        "imageViewer"
    );

const fullImage =
    document.getElementById(
        "fullImage"
    );

const closeImageBtn =
    document.getElementById(
        "closeImageBtn"
    );


function openImage(
    imageUrl
) {

    if (!imageViewer ||
        !fullImage) {
        return;
    }

    fullImage.src =
        imageUrl;

    imageViewer.classList.add(
        "show"
    );
}


if (closeImageBtn) {

    closeImageBtn.addEventListener(
        "click",
        function () {

            imageViewer.classList.remove(
                "show"
            );

            fullImage.src = "";
        }
    );
}


if (imageViewer) {

    imageViewer.addEventListener(
        "click",
        function (event) {

            if (
                event.target ===
                imageViewer
            ) {

                imageViewer.classList.remove(
                    "show"
                );

                fullImage.src = "";
            }
        }
    );
}


/* =========================
   BACK BUTTON
========================= */

const backBtn =
    document.getElementById(
        "backBtn"
    );


if (backBtn) {

    backBtn.addEventListener(
        "click",
        function () {

            if (
                chatScreen &&
                startScreen &&
                chatScreen.classList.contains(
                    "active"
                )
            ) {

                chatScreen.classList.remove(
                    "active"
                );

                startScreen.classList.add(
                    "active"
                );

            } else {

                window.history.back();
            }
        }
    );
}


/* =========================
   GLOBAL ERROR HANDLING
========================= */

window.addEventListener(
    "error",
    function (event) {

        console.error(
            "PAGE ERROR:",
            event.error ||
            event.message
        );
    }
);


/* =========================
   START APPLICATION
========================= */

async function initializeApp() {

    try {

        showLoading(
            "Connecting to G Nurse..."
        );

        await ensureAuthenticated();

        await loadNotifications();

        hideLoading();

    } catch (error) {

        console.error(
            "INITIALIZATION ERROR:",
            error
        );

        hideLoading();

        alert(
            getReadableError(
                error
            )
        );
    }
}


/* =========================
   RUN
========================= */

initializeApp();

</script>

</body>
</html>
