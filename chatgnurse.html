<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chat G Nurse</title>

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f3f7f8;
            color: #17252a;
        }

        body {
            overflow: hidden;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==============================
           HEADER
        ============================== */

        .topbar {
            height: 64px;
            flex-shrink: 0;
            background: #07562f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
            z-index: 20;
        }

        .topbar-title {
            display: flex;
            align-items: center;
            gap: 9px;
            font-weight: 700;
            font-size: 18px;
        }

        .topbar-title span {
            font-size: 25px;
        }

        .notification-button {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: rgba(255,255,255,.15);
            color: white;
            position: relative;
            font-size: 20px;
        }

        .notification-badge {
            position: absolute;
            top: -2px;
            right: -2px;
            min-width: 19px;
            height: 19px;
            padding: 0 5px;
            border-radius: 20px;
            background: #e53935;
            color: white;
            font-size: 11px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* ==============================
           MAIN
        ============================== */

        .main {
            flex: 1;
            min-height: 0;
            position: relative;
            overflow: hidden;
        }

        .start-screen,
        .chat-screen {
            width: 100%;
            height: 100%;
        }

        .start-screen {
            overflow-y: auto;
            padding: 25px 16px 40px;
        }

        .welcome {
            max-width: 600px;
            margin: 25px auto;
            background: white;
            border-radius: 18px;
            padding: 25px 20px;
            box-shadow: 0 4px 18px rgba(0,0,0,.08);
        }

        .welcome-icon {
            text-align: center;
            font-size: 55px;
            margin-bottom: 8px;
        }

        .welcome h1 {
            text-align: center;
            margin: 0 0 10px;
            color: #07562f;
            font-size: 25px;
        }

        .welcome p {
            text-align: center;
            color: #607078;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            border: 1px solid #ccd7da;
            border-radius: 10px;
            padding: 13px;
            outline: none;
            background: #fff;
        }

        .form-group input:focus {
            border-color: #07562f;
        }

        .primary-button {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 14px;
            background: #07562f;
            color: white;
            font-weight: 700;
            font-size: 16px;
        }

        .primary-button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        /* ==============================
           CHAT SCREEN
        ============================== */

        .chat-screen {
            display: none;
            flex-direction: column;
            background: #e9f1ef;
        }

        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 15px;
        }

        .empty-chat {
            text-align: center;
            color: #718087;
            margin-top: 35px;
            font-size: 14px;
        }

        .message-row {
            display: flex;
            margin-bottom: 10px;
        }

        .message-row.visitor {
            justify-content: flex-end;
        }

        .message-row.admin {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 82%;
            padding: 10px 12px;
            border-radius: 14px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }

        .message-row.visitor .message-bubble {
            background: #07562f;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-row.admin .message-bubble {
            background: white;
            color: #17252a;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            display: block;
            margin-top: 5px;
            font-size: 10px;
            opacity: .7;
            text-align: right;
        }

        .message-file {
            display: block;
            margin-top: 7px;
            text-decoration: none;
            color: inherit;
            font-weight: 600;
        }

        .message-image {
            display: block;
            max-width: 220px;
            max-height: 260px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* ==============================
           COMPOSER
        ============================== */

        .composer {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #d7e0e2;
            padding: 8px;
        }

        .composer-row {
            display: flex;
            align-items: flex-end;
            gap: 7px;
        }

        .composer textarea {
            flex: 1;
            min-height: 43px;
            max-height: 110px;
            resize: none;
            border: 1px solid #ccd7da;
            border-radius: 12px;
            padding: 11px;
            outline: none;
        }

        .composer textarea:focus {
            border-color: #07562f;
        }

        .icon-button {
            width: 43px;
            height: 43px;
            flex-shrink: 0;
            border: none;
            border-radius: 50%;
            background: #eef3f2;
            color: #07562f;
            font-size: 19px;
        }

        .send-button {
            background: #07562f;
            color: white;
        }

        .recording-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: #fff3f3;
            border: 1px solid #ffcaca;
            border-radius: 10px;
            padding: 8px 10px;
            margin-bottom: 7px;
            color: #b42318;
            font-size: 13px;
        }

        .recording-bar.active {
            display: flex;
        }

        .recording-stop {
            border: none;
            background: #d32f2f;
            color: white;
            border-radius: 8px;
            padding: 7px 10px;
        }

        .attachment-preview {
            display: none;
            background: #f1f5f4;
            border-radius: 9px;
            padding: 7px 10px;
            margin-bottom: 7px;
            font-size: 12px;
        }

        /* ==============================
           NOTIFICATIONS
        ============================== */

        .notification-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            width: min(340px, calc(100% - 20px));
            max-height: 70%;
            overflow-y: auto;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,.2);
            display: none;
            z-index: 50;
        }

        .notification-panel.open {
            display: block;
        }

        .notification-header {
            padding: 12px;
            border-bottom: 1px solid #e4eaeb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .mark-all-button {
            border: none;
            background: none;
            color: #07562f;
            font-size: 12px;
        }

        .notification-item {
            padding: 12px;
            border-bottom: 1px solid #edf1f2;
        }

        .notification-item.unread {
            background: #edf8f2;
        }

        .notification-item strong {
            display: block;
            margin-bottom: 4px;
        }

        .notification-item small {
            color: #748087;
        }

        /* ==============================
           LOADING
        ============================== */

        .loading {
            position: absolute;
            inset: 0;
            background: rgba(255,255,255,.82);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading.active {
            display: flex;
        }

        .loading-box {
            background: white;
            padding: 22px 28px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.15);
            text-align: center;
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 4px solid #dbe7e3;
            border-top-color: #07562f;
            border-radius: 50%;
            animation: spin .8s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 480px) {

            .topbar {
                height: 58px;
            }

            .welcome {
                margin: 10px auto;
                padding: 20px 16px;
            }

            .message-bubble {
                max-width: 88%;
            }

        }

    </style>

</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="topbar-title">
            <span>💬</span>
            <div>Chat G Nurse</div>
        </div>

        <button
            type="button"
            class="notification-button"
            id="notificationButton"
        >
            🔔

            <span
                class="notification-badge"
                id="notificationBadge"
            >
                0
            </span>

        </button>

    </header>

    <main class="main">

        <!-- START SCREEN -->

        <section
            class="start-screen"
            id="startScreen"
        >

            <div class="welcome">

                <div class="welcome-icon">
                    👩‍⚕️
                </div>

                <h1>
                    Chat G Nurse
                </h1>

                <p>
                    Send a message directly to G Nurse.
                    You can also send pictures, files
                    and voice notes.
                </p>

                <div class="form-group">

                    <label for="visitorName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="visitorName"
                        placeholder="Enter your name"
                        autocomplete="name"
                    >

                </div>

                <div class="form-group">

                    <label for="visitorEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="visitorEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                </div>

                <div class="form-group">

                    <label for="visitorPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="visitorPhone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                    >

                </div>

                <button
                    type="button"
                    class="primary-button"
                    id="startChatButton"
                >
                    Start Chat
                </button>

            </div>

        </section>

        <!-- CHAT SCREEN -->

        <section
            class="chat-screen"
            id="chatScreen"
        >

            <div
                class="messages"
                id="messages"
            >

                <div
                    class="empty-chat"
                    id="emptyChat"
                >
                    No messages yet. Start the conversation.
                </div>

            </div>

            <div class="composer">

                <div
                    class="recording-bar"
                    id="recordingBar"
                >

                    <span id="recordingTime">
                        🔴 Recording 00:00
                    </span>

                    <button
                        type="button"
                        class="recording-stop"
                        id="stopRecordingButton"
                    >
                        Stop
                    </button>

                </div>

                <div
                    class="attachment-preview"
                    id="attachmentPreview"
                >
                    <span id="attachmentName"></span>
                </div>

                <div class="composer-row">

                    <button
                        type="button"
                        class="icon-button"
                        id="attachmentButton"
                        title="Attach file"
                    >
                        📎
                    </button>

                    <textarea
                        id="messageInput"
                        placeholder="Type a message..."
                        rows="1"
                    ></textarea>

                    <button
                        type="button"
                        class="icon-button"
                        id="voiceButton"
                        title="Voice note"
                    >
                        🎙️
                    </button>

                    <button
                        type="button"
                        class="icon-button send-button"
                        id="sendButton"
                        title="Send"
                    >
                        ➤
                    </button>

                </div>

                <input
                    type="file"
                    id="fileInput"
                    class="hidden"
                    accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.zip"
                >

            </div>

        </section>

        <!-- NOTIFICATIONS -->

        <div
            class="notification-panel"
            id="notificationPanel"
        >

            <div class="notification-header">

                <span>
                    Notifications
                </span>

                <button
                    type="button"
                    class="mark-all-button"
                    id="markAllNotifications"
                >
                    Mark all read
                </button>

            </div>

            <div id="notificationList"></div>

        </div>

        <!-- LOADING -->

        <div
            class="loading"
            id="loading"
        >

            <div class="loading-box">

                <div class="spinner"></div>

                <div id="loadingText">
                    Please wait...
                </div>

            </div>

        </div>

    </main>

    </div>
    <script>

/* =========================================================
   1. SUPABASE CONFIGURATION
========================================================= */

const SUPABASE_URL =
    "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_9JL2ALhTGlVZ57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   2. APPLICATION STATE
========================================================= */

let currentUser = null;
let currentConversation = null;
let realtimeChannel = null;

let mediaRecorder = null;
let recordedChunks = [];
let recordingTimer = null;
let recordingSeconds = 0;

let selectedFile = null;


/* =========================================================
   3. ELEMENTS
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const chatScreen =
    document.getElementById("chatScreen");

const visitorName =
    document.getElementById("visitorName");

const visitorEmail =
    document.getElementById("visitorEmail");

const visitorPhone =
    document.getElementById("visitorPhone");

const startChatButton =
    document.getElementById("startChatButton");

const messages =
    document.getElementById("messages");

const emptyChat =
    document.getElementById("emptyChat");

const messageInput =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const attachmentButton =
    document.getElementById("attachmentButton");

const fileInput =
    document.getElementById("fileInput");

const attachmentPreview =
    document.getElementById("attachmentPreview");

const attachmentName =
    document.getElementById("attachmentName");

const voiceButton =
    document.getElementById("voiceButton");

const recordingBar =
    document.getElementById("recordingBar");

const recordingTime =
    document.getElementById("recordingTime");

const stopRecordingButton =
    document.getElementById(
        "stopRecordingButton"
    );

const notificationButton =
    document.getElementById(
        "notificationButton"
    );

const notificationBadge =
    document.getElementById(
        "notificationBadge"
    );

const notificationPanel =
    document.getElementById(
        "notificationPanel"
    );

const notificationList =
    document.getElementById(
        "notificationList"
    );

const markAllNotifications =
    document.getElementById(
        "markAllNotifications"
    );

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");


/* =========================================================
   4. LOADING FUNCTIONS
========================================================= */

function showLoading(text) {

    loadingText.textContent =
        text || "Please wait...";

    loading.classList.add("active");
}


function hideLoading() {

    loading.classList.remove("active");
}


/* =========================================================
   5. SAFE TEXT
========================================================= */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   6. DATE / TIME
========================================================= */

function formatMessageTime(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   7. LOCAL VISITOR DETAILS
========================================================= */

function saveVisitorDetails() {

    const details = {

        name:
            visitorName.value.trim(),

        email:
            visitorEmail.value.trim(),

        phone:
            visitorPhone.value.trim()

    };

    localStorage.setItem(
        "g_nurse_visitor_details",
        JSON.stringify(details)
    );
}


function loadVisitorDetails() {

    const saved =
        localStorage.getItem(
            "g_nurse_visitor_details"
        );

    if (!saved) {
        return;
    }

    try {

        const details =
            JSON.parse(saved);

        visitorName.value =
            details.name || "";

        visitorEmail.value =
            details.email || "";

        visitorPhone.value =
            details.phone || "";

    } catch (error) {

        console.error(
            "Visitor details error:",
            error
        );

    }
}


/* =========================================================
   8. ANONYMOUS AUTHENTICATION
========================================================= */

async function ensureAuthenticated() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getUser();

        if (
            !error &&
            data &&
            data.user
        ) {

            currentUser =
                data.user;

            return currentUser;
        }


        const {
            data: authData,
            error: authError
        } =
            await supabaseClient.auth
                .signInAnonymously();

        if (authError) {

            console.error(
                "Anonymous authentication error:",
                authError
            );

            throw authError;
        }

        currentUser =
            authData.user;

        return currentUser;

    } catch (error) {

        console.error(
            "Authentication failed:",
            error
        );

        throw error;
    }
}


/* =========================================================
   9. GET EXISTING VISITOR CONVERSATION
========================================================= */

async function findMyConversation() {

    if (!currentUser) {
        return null;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("g_nurse_conversations")
            .select("*")
            .eq(
                "visitor_user_id",
                currentUser.id
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            )
            .limit(1)
            .maybeSingle();

    if (error) {

        console.error(
            "Conversation lookup error:",
            error
        );

        throw error;
    }

    return data || null;
}


/* =========================================================
   10. CREATE CONVERSATION
========================================================= */

async function createConversation() {

    const name =
        visitorName.value.trim();

    const email =
        visitorEmail.value.trim();

    const phone =
        visitorPhone.value.trim();

    if (!name) {

        alert(
            "Please enter your name."
        );

        visitorName.focus();

        return null;
    }

    if (!email && !phone) {

        alert(
            "Please enter your email or phone number."
        );

        visitorEmail.focus();

        return null;
    }

    const visitorToken =
        crypto.randomUUID();

    const {
        data,
        error
    } =
        await supabaseClient
            .from("g_nurse_conversations")
            .insert({

                visitor_token:
                    visitorToken,

                visitor_name:
                    name,

                visitor_email:
                    email || null,

                visitor_phone:
                    phone || null,

                visitor_user_id:
                    currentUser.id,

                status:
                    "open"

            })
            .select()
            .single();

    if (error) {

        console.error(
            "Conversation creation error:",
            error
        );

        throw error;
    }

    return data;
}


/* =========================================================
   11. OPEN VISITOR CHAT
========================================================= */

async function openChat() {

    showLoading(
        "Opening your chat..."
    );

    try {

        await ensureAuthenticated();

        let conversation =
            await findMyConversation();

        if (!conversation) {

            conversation =
                await createConversation();
        }

        if (!conversation) {
            return;
        }

        currentConversation =
            conversation;

        saveVisitorDetails();

        startScreen.style.display =
            "none";

        chatScreen.style.display =
            "flex";

        await loadMessages();

        await loadNotifications();

        startRealtime();

    } catch (error) {

        console.error(
            "Open chat error:",
            error
        );

        alert(
            "Unable to open Chat G Nurse. Please try again."
        );

    } finally {

        hideLoading();
    }
}


/* =========================================================
   12. START CHAT BUTTON
========================================================= */

startChatButton.addEventListener(
    "click",
    openChat
);


/* =========================================================
   13. MESSAGE LOADING
========================================================= */

async function loadMessages() {

    if (!currentConversation) {
        return;
    }

    const {
        data,
        error
    } =
        await supabaseClient
            .from("g_nurse_messages")
            .select("*")
            .eq(
                "conversation_id",
                currentConversation.id
            )
            .order(
                "created_at",
                {
                    ascending: true
                }
            );

    if (error) {

        console.error(
            "Message loading error:",
            error
        );

        return;
    }

    messages.innerHTML = "";

    if (!data || data.length === 0) {

        messages.appendChild(
            emptyChat
        );

    } else {

        data.forEach(
            function(message) {

                renderMessage(
                    message
                );

            }
        );
    }

    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================================
   14. RENDER MESSAGE
========================================================= */

function renderMessage(message) {

    const row =
        document.createElement("div");

    row.className =
        "message-row " +
        (
            message.sender_type === "visitor"
                ? "visitor"
                : "admin"
        );

    const bubble =
        document.createElement("div");

    bubble.className =
        "message-bubble";

    if (message.deleted_at) {

        bubble.innerHTML =
            "<em>This message was unsent.</em>";

    } else {

        if (message.message) {

            const text =
                document.createElement("div");

            text.innerHTML =
                escapeHTML(
                    message.message
                ).replace(
                    /\n/g,
                    "<br>"
                );

            bubble.appendChild(
                text
            );
        }


        if (message.attachment_url) {

            const attachment =
                document.createElement("div");

            attachment.className =
                "message-file";

            attachment.textContent =
                "📎 " +
                (
                    message.attachment_name ||
                    "Attachment"
                );

            attachment.style.cursor =
                "pointer";

            attachment.addEventListener(
                "click",
                function() {

                    openPrivateFile(
                        message
                    );

                }
            );

            bubble.appendChild(
                attachment
            );
        }


        if (message.voice_url) {

            const audio =
                document.createElement("audio");

            audio.controls = true;

            audio.style.width =
                "220px";

            audio.style.marginTop =
                "7px";

            audio.dataset.messageId =
                message.id;

            audio.addEventListener(
                "play",
                function() {

                    markVoiceListened(
                        message.id
                    );

                }
            );

            getPrivateUrl(
                message.voice_url
            ).then(
                function(url) {

                    if (url) {
                        audio.src = url;
                    }

                }
            );

            bubble.appendChild(
                audio
            );
        }


        if (
            message.attachment_type &&
            message.attachment_type.startsWith(
                "image/"
            )
        ) {

            getPrivateUrl(
                message.attachment_url
            ).then(
                function(url) {

                    if (!url) {
                        return;
                    }

                    const image =
                        document.createElement(
                            "img"
                        );

                    image.className =
                        "message-image";

                    image.src =
                        url;

                    image.alt =
                        message.attachment_name ||
                        "Image";

                    bubble.insertBefore(
                        image,
                        bubble.firstChild
                    );

                }
            );
        }
    }


    const time =
        document.createElement("span");

    time.className =
        "message-time";

    time.textContent =
        formatMessageTime(
            message.created_at
        );

    bubble.appendChild(
        time
    );

    row.appendChild(
        bubble
    );

    messages.appendChild(
        row
    );

    if (
        message.sender_type === "admin" &&
        !message.viewed
    ) {

        markMessageSeen(
            message.id
        );
    }
}

/* =========================================================
   8. PRIVATE STORAGE URL
========================================================= */

async function getPrivateUrl(
    storagePath
) {

    if (!storagePath) {
        return null;
    }

    let bucketName = "";

    if (
        storagePath.startsWith("images/")
    ) {

        bucketName =
            "g-nurse-images";

        storagePath =
            storagePath.replace(
                "images/",
                ""
            );

    } else if (
        storagePath.startsWith("files/")
    ) {

        bucketName =
            "g-nurse-files";

        storagePath =
            storagePath.replace(
                "files/",
                ""
            );

    } else if (
        storagePath.startsWith("voice/")
    ) {

        bucketName =
            "g-nurse-voice";

        storagePath =
            storagePath.replace(
                "voice/",
                ""
            );

    } else {

        return null;
    }


    const {
        data,
        error
    } =
        await supabaseClient
            .storage
            .from(bucketName)
            .createSignedUrl(
                storagePath,
                3600
            );


    if (error) {

        console.error(
            "Signed URL error:",
            error
        );

        return null;
    }


    return data?.signedUrl || null;
}


/* =========================================================
   9. OPEN PRIVATE FILE
========================================================= */

async function openPrivateFile(
    message
) {

    if (!message?.attachment_url) {
        return;
    }


    showLoading(

    );

        await getPrivateUrl(

        alert(

        );

        return;
    }


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );
}


/* =========================================================
   10. MARK ADMIN MESSAGE AS SEEN
========================================================= */

async function markMessageSeen(

) {

/* =========================================================
   12. DETERMINE STORAGE BUCKET
========================================================= */

function getBucketForFile(
    file
) {

    if (!file) {
        return null;
    }


    if (
        file.type &&
        file.type.startsWith(
            "image/"
        )
    ) {

        return "g-nurse-images";
    }


    return "g-nurse-files";
}


/* =========================================================
   13. CREATE STORAGE PATH
========================================================= */

function createStoragePath(
    file
) {

    const extension =
        file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "file";


    const randomPart =
        Math.random()
            .toString(36)
            .substring(2, 10);


    return (
        currentUser.id +
        "/" +
        currentConversation.id +
        "/" +
        Date.now() +
        "_" +
        randomPart +
        "." +
        extension
    );
}


/* =========================================================
   14. UPLOAD ATTACHMENT
========================================================= */

async function uploadAttachment(
    file
) {

    if (!file) {
        return null;
    }


    const bucket =
        getBucketForFile(
            file
        );


    const path =
        createStoragePath(
            file
        );


    const {
        error
    } =
        await supabaseClient
            .storage
            .from(bucket)
            .upload(
                path,
                file,
                {
                    cacheControl:
                        "3600",

                    upsert:
                        false
                }
            );


    if (error) {
        throw error;
    }


    let attachmentPrefix =
        "files/";

    if (
        bucket ===
        "g-nurse-images"
    ) {

        attachmentPrefix =
            "images/";
    }


    return {
        path:
            attachmentPrefix +
            path,

        name:
            file.name,

        type:
            file.type ||
            "application/octet-stream"
    };
}

/* =========================================================
   17. FILE SIZE
========================================================= */

function formatFileSize(
    bytes
) {

    if (!bytes) {
        return "0 B";
    }


    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];


    let size =
        bytes;

    let index =
        0;


    while (
        size >= 1024 &&
        index <
            units.length - 1
    ) {

        size /=
            1024;

        index++;
    }


    return (
        size.toFixed(
            index === 0
                ? 0
                : 1
        ) +
        " " +
        units[index]
    );
}

/* =========================================================
   23. VOICE RECORDING
========================================================= */

async function startVoiceRecording() {

    if (!currentConversation) {

        alert(
            "Please start the chat first."
        );

        return;
    }


    if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ) {

        alert(
            "Voice recording is not supported on this device/browser."
        );

        return;
    }


    try {

        const stream =
            await navigator
                .mediaDevices
                .getUserMedia({
                    audio: true
                });


        recordedChunks =
            [];


        mediaRecorder =
            new MediaRecorder(
                stream
            );


        mediaRecorder.ondataavailable =
            function (event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    recordedChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            async function () {

                stream
                    .getTracks()
                    .forEach(
                        track =>
                            track.stop()
                    );


                await finishVoiceRecording();
            };


        mediaRecorder.start();


        recordingSeconds =
            0;


        updateRecordingUI();


        recordingTimer =
            setInterval(
                function () {

                    recordingSeconds++;

                    updateRecordingUI();

                },
                1000
            );

    } catch (error) {

        console.error(
            "Microphone error:",
            error
        );

        alert(
            "Microphone permission is required."
        );
    }
}


/* =========================================================
   24. UPDATE RECORDING UI
========================================================= */

function updateRecordingUI() {

    if (!recordingStatus) {
        return;
    }


    const minutes =
        Math.floor(
            recordingSeconds / 60
        );


    const seconds =
        recordingSeconds % 60;


    recordingStatus.textContent =
        "Recording " +
        String(minutes).padStart(
            2,
            "0"
        ) +
        ":" +
        String(seconds).padStart(
            2,
            "0"
        );
}


/* =========================================================
   25. STOP VOICE RECORDING
========================================================= */

function stopVoiceRecording() {

    if (
        mediaRecorder &&
        mediaRecorder.state !==
            "inactive"
    ) {

        mediaRecorder.stop();
    }


    if (recordingTimer) {

        clearInterval(
            recordingTimer
        );

        recordingTimer =
            null;
    }


    if (recordingStatus) {

        recordingStatus.textContent =
            "";
    }
}


/* =========================================================
   26. FINISH VOICE RECORDING
========================================================= */

async function finishVoiceRecording() {

    if (
        !recordedChunks.length ||
        !currentConversation
    ) {

        return;
    }


    try {

        showLoading(
            "Sending voice note..."
        );


        const mimeType =
            mediaRecorder?.mimeType ||
            "audio/webm";


        const blob =
            new Blob(
                recordedChunks,
                {
                    type:
                        mimeType
                }
            );


        const extension =
            mimeType.includes(
                "mp4"
            )
                ? "m4a"
                : "webm";


        const path =
            currentUser.id +
            "/" +
            currentConversation.id +
            "/" +
            Date.now() +
            "_voice." +
            extension;


        const {
            error:
                uploadError
        } =
            await supabaseClient
                .storage
                .from(
                    "g-nurse-voice"
                )
                .upload(
                    path,
                    blob,
                    {
                        contentType:
                            mimeType,

                        cacheControl:
                            "3600",

                        upsert:
                            false
                    }
                );


        if (uploadError) {
            throw uploadError;
        }


        const {
            error:
                messageError
        } =
            await supabaseClient
                .from(
                    "g_nurse_messages"
                )
                .insert({

                    conversation_id:
                        currentConversation.id,

                    sender_type:
                        "visitor",

                    voice_url:
                        "voice/" +
                        path

                });


        if (messageError) {
            throw messageError;
        }


        recordedChunks =
            [];


        await loadMessages();

    } catch (error) {

        console.error(
            "Voice error:",
            error
        );

        alert(
            "Voice note could not be sent."
        );

    } finally {

        hideLoading();
    }
}

/* =========================================================
   29. RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(
    notifications
) {

    if (!notificationList) {
        return;
    }
    notificationList.innerHTML = "";


    const unread =
        notifications.filter(
            item => !item.is_read
        ).length;


    updateNotificationBadge(
        unread
    );


    if (!notifications.length) {

        notificationList.innerHTML = `
            <div class="empty-notifications">
                No notifications yet.
            </div>
        `;

        return;
    }


    notifications.forEach(
        function (notification) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "notification-item" +
                (
                    notification.is_read
                        ? ""
                        : " unread"
                );


            item.innerHTML = `
                <strong>
                    ${escapeHTML(
                        notification.title ||
                        "New message"
                    )}
                </strong>

                <div>
                    ${escapeHTML(
                        notification.body ||
                        ""
                    )}
                </div>

                <small>
                    ${formatMessageTime(
                        notification.created_at
                    )}
                </small>
            `;


            item.addEventListener(
                "click",
                async function () {

                    if (
                        !notification.is_read
                    ) {

                        await supabaseClient
                            .rpc(
                                "g_nurse_mark_notification_read",
                                {
                                    p_notification_id:
                                        notification.id
                                }
                            );
                    }


                    if (
                        notification.conversation_id
                    ) {

                        if (
                            currentConversation?.id !==
                            notification.conversation_id
                        ) {

                            await openExistingConversation(
                                notification.conversation_id
                            );
                        }

                        await loadMessages();
                    }


                    await loadNotifications();
                }
            );


            notificationList.appendChild(
                item
            );
        }
    );
}

/* =========================================================
   31. REALTIME CONNECTION
========================================================= */

function startRealtime() {

    if (!currentUser) {
        return;
    }


    if (realtimeChannel) {

        supabaseClient
            .removeChannel(
                realtimeChannel
            );

        realtimeChannel =
            null;
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "g-nurse-visitor-" +
                currentUser.id
            );


    realtimeChannel
        .on(
            "postgres_changes",
            {
                event:
                    "INSERT",

                schema:
                    "public",

                table:
                    "g_nurse_messages"
            },
            async function (payload) {

                if (
                    !currentConversation
                ) {
                    return;
                }


                if (
                    payload.new
                        ?.conversation_id !==
                    currentConversation.id
                ) {
                    return;
                }


                await loadMessages();
            }
        )
        .on(
            "postgres_changes",
            {
                event:
                    "UPDATE",

                schema:
                    "public",

                table:
                    "g_nurse_messages"
            },
            async function (payload) {

                if (
                    !currentConversation
                ) {
                    return;
                }


                if (
                    payload.new
                        ?.conversation_id !==
                    currentConversation.id
                ) {
                    return;
                }


                await loadMessages();
            }
        )
        .on(
            "postgres_changes",
            {
                event:
                    "*",

                schema:
                    "public",

                table:
                    "g_nurse_notifications",

                filter:
                    "recipient_user_id=eq." +
                    currentUser.id
            },
            async function () {

                await loadNotifications();
            }
        )
        .subscribe(
            function (status) {

                console.log(
                    "G Nurse realtime:",
                    status
                );
            }
        );
}

            throw error;
        }


        if (!data) {
            return;
        }


        currentConversation =
            data;


        const saved =
            loadVisitorDetails();


        if (
            saved &&
            saved.name
        ) {

            await openExistingConversation(
                data.id
            );
        }

    } catch (error) {

        console.error(
            "Restore chat error:",
            error
        );
    }
}


/* =========================================================
   38. PAGE STARTUP
========================================================= */

async function initializeChat() {

    try {

        showLoading(
            "Connecting to G Nurse..."
        );


        restoreVisitorDetails();


        const authenticated =
            await ensureAuthenticated();


        if (!authenticated) {

            hideLoading();

            return;
        }


        await restoreExistingChat();


        await loadNotifications();


        startRealtime();


    } catch (error) {

        console.error(
            "Initialization error:",
            error
        );

        alert(
            "Unable to connect to G Nurse. Please refresh the page."
        );

    } finally {

        hideLoading();
    }
}


/* =========================================================
   39. PAGE VISIBILITY
========================================================= */

document.addEventListener(
    "visibilitychange",
    async function () {

        if (
            document.visibilityState ===
            "visible"
        ) {

            if (currentUser) {

                await loadNotifications();


                if (
                    currentConversation
                ) {

                    await loadMessages();
                }
            }
        }
    }
);


/* =========================================================
   40. CLEAN REALTIME ON PAGE EXIT
========================================================= */

window.addEventListener(
    "beforeunload",
    function () {

        if (realtimeChannel) {

            supabaseClient
                .removeChannel(
                    realtimeChannel
                );
        }
    }
);


/* =========================================================
   41. INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        initializeChat();
    }
);

</script>
