<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://bmiechymiyedubezhcq.supabase.co";

/*
 IMPORTANT:
 Replace ONLY the value below with your SUPABASE
 PUBLISHABLE KEY.

 DO NOT use the service_role / secret key.
*/

const SUPABASE_KEY =
  "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   GLOBAL STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let currentFriend = null;
let chatChannel = null;
let friendChannel = null;

let mediaRecorder = null;
let voiceChunks = [];
let recording = false;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
  return document.getElementById(id);
}


function showStatus(message, type=""){
  const box = $("status");

  box.textContent = message;
  box.className = "";

  if(type){
    box.classList.add(type);
  }

  box.style.display = "block";

  clearTimeout(window.statusTimer);

  window.statusTimer =
    setTimeout(()=>{
      box.style.display = "none";
    },5000);
}


function showAuthMessage(message, error=true){
  $("authMessage").textContent = message;
  $("authMessage").style.color =
    error ? "#c62828" : "#07562f";
}


function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function initials(name){
  const text = String(name || "G").trim();

  if(!text){
    return "G";
  }

  return text
    .split(/\s+/)
    .slice(0,2)
    .map(x => x[0])
    .join("")
    .toUpperCase();
}


function avatarHtml(profile, className="avatar"){
  const name =
    profile?.full_name ||
    profile?.username ||
    "G";

  if(profile?.avatar_url){

    return `
      <div class="${className}">
        <img
          src="${escapeHtml(profile.avatar_url)}"
          alt=""
        >
      </div>
    `;

  }

  return `
    <div class="${className}">
      ${escapeHtml(initials(name))}
    </div>
  `;
}


function formatTime(date){
  try{
    return new Date(date).toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );
  }catch(e){
    return "";
  }
}


/* =========================================================
   START
========================================================= */

async function start(){

  if(
    SUPABASE_KEY ===
    "PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE"
  ){

    showAuthMessage(
      "Paste your Supabase Publishable Key into the code first."
    );

    return;
  }

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();

    if(error){
      throw error;
    }

    if(data.session){

      currentUser =
        data.session.user;

      await openApp();

    }else{

      showAuth();

    }

  }catch(error){

    console.error(error);

    showAuthMessage(
      "Supabase connection error: " +
      error.message
    );

  }


  supabaseClient.auth.onAuthStateChange(
    async (event, session)=>{

      if(
        session &&
        !currentUser
      ){

        currentUser =
          session.user;

        await openApp();

      }

      if(
        event === "SIGNED_OUT"
      ){

        currentUser = null;
        currentProfile = null;

        showAuth();

      }

    }
  );
}


/* =========================================================
   AUTH
========================================================= */

function showAuth(){

  $("authPage").classList.remove("hidden");
  $("app").classList.add("hidden");

}


async function login(){

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPassword").value;

  if(!email || !password){

    showAuthMessage(
      "Enter your email and password."
    );

    return;
  }

  showAuthMessage(
    "Logging in...",
    false
  );

  const {
    data,
    error
  } =
  await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if(error){

    showAuthMessage(
      error.message
    );

    return;
  }

  currentUser =
    data.user;

  await openApp();
}


async function signup(){

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPassword").value;

  if(!email || !password){

    showAuthMessage(
      "Enter your email and password."
    );

    return;
  }

  if(password.length < 6){

    showAuthMessage(
      "Password must contain at least 6 characters."
    );

    return;
  }

  showAuthMessage(
    "Creating account...",
    false
  );

  const {
    data,
    error
  } =
  await supabaseClient.auth.signUp({
    email,
    password
  });

  if(error){

    showAuthMessage(
      error.message
    );

    return;
  }

  if(!data.session){

    showAuthMessage(
      "Account created. Check your email to confirm the account, then login.",
      false
    );

    return;
  }

  currentUser =
    data.user;

  await openApp();
}


async function logout(){

  await supabaseClient.auth.signOut();

  currentUser = null;
  currentProfile = null;

  if(chatChannel){

    await supabaseClient
      .removeChannel(chatChannel);

    chatChannel = null;

  }

  if(friendChannel){

    await supabaseClient
      .removeChannel(friendChannel);

    friendChannel = null;

  }

  showAuth();
}


/* =========================================================
   OPEN APP
========================================================= */

async function openApp(){

  $("authPage").classList.add("hidden");
  $("app").classList.remove("hidden");

   await loadProfile();
  await loadRequests();
  await loadFriends();

  subscribeFriendRequests();
}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .eq("id", currentUser.id)
    .maybeSingle();

  if(error){

    showStatus(
      "Profile error: " + error.message,
      "error"
    );

    return;
  }

  if(!data){

    const username =
      "user_" + currentUser.id.slice(0,8);

    const {
      data:created,
      error:createError
    } =
    await supabaseClient
      .from("profiles")
      .insert({
        id:currentUser.id,
        username:username,
        full_name:"",
        email:currentUser.email || ""
      })
      .select()
      .single();

    if(createError){

      showStatus(
        "Could not create profile: " +
        createError.message,
        "error"
      );

      return;
    }

    currentProfile = created;

  }else{

    currentProfile = data;

  }

  renderMyProfile();
}

/* =========================================================
   FRIEND REQUESTS
========================================================= */

async function sendFriendRequest(receiverId){

  if(receiverId === currentUser.id){
    return;
  }

  const {
    data:existing,
    error:checkError
  } =
  await supabaseClient
    .from("friend_requests")
    .select("id,status")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${receiverId}),and(sender_id.eq.${receiverId},receiver_id.eq.${currentUser.id})`
    )
    .limit(1);

  if(checkError){

    showStatus(
      "Could not check request: " +
      checkError.message,
      "error"
    );

    return;
  }

  if(existing && existing.length){

    showStatus(
      "A friend request already exists.",
      "error"
    );

    return;
  }

  const {
    error
  } =
  await supabaseClient
    .from("friend_requests")
    .insert({
      sender_id:currentUser.id,
      receiver_id:receiverId,
      status:"pending"
    });

  if(error){

    showStatus(
      "Friend request failed: " +
      error.message,
      "error"
    );

    return;
  }

  showStatus(
    "Friend request sent.",
    "success"
  );
}


async function loadRequests(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .eq("status","pending")
    .order("created_at",{ascending:false});

  if(error){

    showStatus(
      "Request error: " +
      error.message,
      "error"
    );

    return;
  }

  if(!data || data.length === 0){

    $("requests").innerHTML = `
      <div class="empty">
        No friend requests.
      </div>
    `;

    return;
  }

  let html = "";

  for(const request of data){

    const {
      data:profile
    } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id",request.sender_id)
      .maybeSingle();

    html += `

      <div class="card">

        <div class="userRow">

          ${avatarHtml(profile || {})}

          <div class="userDetails">

            <strong>
              ${escapeHtml(
                profile?.full_name ||
                profile?.username ||
                "User"
              )}
            </strong>

            <span>
              @${escapeHtml(
                profile?.username ||
                "user"
              )}
            </span>

          </div>

          <button
            class="smallBtn greenBtn"
            onclick="acceptRequest('${request.id}')"
          >
            Accept
          </button>

        </div>

      </div>

    `;
  }

  $("requests").innerHTML = html;
}


async function acceptRequest(requestId){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("friend_requests")
    .update({
      status:"accepted",
      updated_at:new Date().toISOString()
    })
    .eq("id",requestId)
    .eq("receiver_id",currentUser.id)
    .select()
    .single();

  if(error){

    showStatus(
      "Could not accept request: " +
      error.message,
      "error"
    );

    return;
  }

  await loadRequests();
  await loadFriends();

  showStatus(
    "Friend added.",
    "success"
  );
 }
 /* =========================================================
   FRIENDS
========================================================= */

async function loadFriends(){

  const {
    data:sent,
    error:sentError
  } =
  await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq("sender_id",currentUser.id)
    .eq("status","accepted");

  if(sentError){

    showStatus(
      "Friends error: " + sentError.message,
      "error"
    );

    return;
  }

  const {
    data:received,
    error:receivedError
  } =
  await supabaseClient
    .from("friend_requests")
    .select("*")
    .eq("receiver_id",currentUser.id)
    .eq("status","accepted");

  if(receivedError){

    showStatus(
      "Friends error: " + receivedError.message,
      "error"
    );

    return;
  }

  const friendIds = [];

  for(const row of (sent || [])){
    friendIds.push(row.receiver_id);
  }

  for(const row of (received || [])){
    friendIds.push(row.sender_id);
  }

  const uniqueIds =
    [...new Set(friendIds)];

  if(uniqueIds.length === 0){

    $("friends").innerHTML = `
      <div class="empty">
        No friends yet.
      </div>
    `;

    return;
  }

  const {
    data:profiles,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("*")
    .in("id",uniqueIds);

  if(profileError){

    showStatus(
      "Could not load friends: " +
      profileError.message,
      "error"
    );

    return;
  }

  $("friends").innerHTML =
    (profiles || []).map(function(friend){

      const name =
        friend.full_name ||
        friend.username ||
        "Friend";

      return `
        <div
          class="card"
          onclick="openChat('${friend.id}')"
          style="cursor:pointer"
        >

          <div class="userRow">

            ${avatarHtml(friend)}

            <div class="userDetails">

              <strong>
                ${escapeHtml(name)}
              </strong>

              <span>
                @${escapeHtml(
                  friend.username || "user"
                )}
              </span>

            </div>

            <button
              class="smallBtn lightBtn"
              onclick="event.stopPropagation();openChat('${friend.id}')"
            >
              Chat
            </button>

          </div>

        </div>
      `;

    }).join("");
}

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  if(!currentFriend){
    return;
  }

  const {
    data,
    error
  } =
  await supabaseClient
    .from("chat_messages")
    .select("*")
    .or(
      `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentFriend.id}),and(sender_id.eq.${currentFriend.id},receiver_id.eq.${currentUser.id})`
    )
    .order("created_at",{ascending:true});

  if(error){

    showStatus(
      "Could not load messages: " +
      error.message,
      "error"
    );

    return;
  }

  renderMessages(data || []);
}


function renderMessages(messages){

  const box =
    $("chatMessages");

  if(!messages.length){

    box.innerHTML = `
      <div
        style="
          text-align:center;
          color:#758078;
          font-size:12px;
          padding:30px 10px;
        "
      >
        No messages yet.<br>
        Start the conversation.
      </div>
    `;

    return;
  }

  box.innerHTML =
    messages.map(function(message){

      const mine =
        message.sender_id ===
        currentUser.id;

      let content = "";

      if(message.media_url){

        if(
          message.media_type &&
          message.media_type.startsWith("image/")
        ){

          content += `
            <a
              href="${escapeHtml(message.media_url)}"
              target="_blank"
            >
              <img
                src="${escapeHtml(message.media_url)}"
                alt="Photo"
              >
            </a>
          `;

        }else if(
          message.message_type === "voice"
        ){

          content += `
            <audio
              class="voicePlayer"
              controls
              src="${escapeHtml(message.media_url)}"
            ></audio>
          `;

        }else{

          content += `
            <a
              class="fileLink"
              href="${escapeHtml(message.media_url)}"
              target="_blank"
            >
              📎
              ${escapeHtml(
                message.media_name ||
                "Open file"
              )}
            </a>
          `;

        }
      }

      if(message.message){

        content += `
          <div>
            ${escapeHtml(message.message)}
          </div>
        `;

      }

      return `
        <div class="message ${
          mine ? "mine" : "theirs"
        }">

          ${content}

          <span class="time">
            ${formatTime(message.created_at)}
          </span>

        </div>
      `;

    }).join("");

  box.scrollTop =
    box.scrollHeight;
 }
 async function sendMessage(){

  if(!currentFriend){
    return;
  }

  const input =
    $("messageInput");

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  input.value = "";

  const { error } =
    await supabaseClient
      .from("chat_messages")
      .insert({
        sender_id:currentUser.id,
        receiver_id:currentFriend.id,
        message:text,
        message_type:"text"
      });

  if(error){

    input.value = text;

    showStatus(
      "Message failed: " +
      error.message,
      "error"
    );

    return;
  }

  await loadMessages();
}


function subscribeMessages(){

  if(!currentFriend){
    return;
  }

  if(chatChannel){

    supabaseClient
      .removeChannel(chatChannel);
  }

  const friendId =
    currentFriend.id;

  chatChannel =
    supabaseClient
      .channel(
        "chatroom-messages-" +
        currentUser.id +
        "-" +
        friendId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"chat_messages"
        },
        async payload => {

          const row =
            payload.new;

          const belongsToChat =
            (
              row.sender_id ===
              currentUser.id &&
              row.receiver_id ===
              friendId
            ) ||
            (
              row.sender_id ===
              friendId &&
              row.receiver_id ===
              currentUser.id
            );

          if(belongsToChat){

            await loadMessages();

          }

        }
      )
      .subscribe(status => {

        console.log(
          "Chat realtime:",
          status
        );

      });
}

/* PHOTO / FILE UPLOAD */

async function uploadMedia(file){

  if(!currentFriend){

    showStatus(
      "Open a chat first.",
      "error"
    );

    return;
  }

  showStatus(
    "Uploading " +
    file.name +
    "...",
    ""
  );

  const safeName =
    file.name.replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

  const path =
    currentUser.id +
    "/" +
    crypto.randomUUID() +
    "-" +
    safeName;


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("chatroom-media")
      .upload(
        path,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:
            file.type ||
            undefined
        }
      );


  if(uploadError){

    showStatus(
      "Upload failed: " +
      uploadError.message,
      "error"
    );

    return;
  }


  const {
    data:urlData
  } =
    supabaseClient
      .storage
      .from("chatroom-media")
      .getPublicUrl(path);


  const publicUrl =
    urlData.publicUrl;


  const {
    error:messageError
  } =
    await supabaseClient
      .from("chat_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          currentFriend.id,

        message:"",

        message_type:"text",

        media_url:
          publicUrl,

        media_name:
          file.name,

        media_type:
          file.type ||
          "application/octet-stream"

      });


  if(messageError){

    showStatus(
      "File uploaded but message failed: " +
      messageError.message,
      "error"
    );

    return;
  }


  showStatus(
    "File sent.",
    "success"
  );

  await loadMessages();

 }
 /* =========================
   VOICE NOTE
========================= */

async function toggleVoice(){

  if(recording){

    stopVoice();

  }else{

    await startVoice();

  }

}


async function startVoice(){

  if(!currentFriend){

    showStatus(
      "Open a chat first.",
      "error"
    );

    return;
  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showStatus(
      "Your browser does not support microphone recording.",
      "error"
    );

    return;
  }


  try{

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:true
        });


    voiceChunks = [];


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      function(event){

        if(event.data.size > 0){

          voiceChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      async function(){

        stream
          .getTracks()
          .forEach(function(track){

            track.stop();

          });


        const blob =
          new Blob(
            voiceChunks,
            {
              type:"audio/webm"
            }
          );


        await uploadVoice(blob);

      };


    mediaRecorder.start();

    recording = true;


    $("voiceButton")
      .classList
      .add("voiceActive");


    $("voiceButton")
      .textContent = "⏹";


    showStatus(
      "Recording voice note...",
      ""
    );


  }catch(error){

    showStatus(
      "Microphone error: " +
      error.message,
      "error"
    );

  }

}


function stopVoice(){

  if(
    mediaRecorder &&
    recording
  ){

    mediaRecorder.stop();

    recording = false;


    $("voiceButton")
      .classList
      .remove("voiceActive");


    $("voiceButton")
      .textContent = "🎤";

  }

}


async function uploadVoice(blob){

  if(!currentFriend){

    showStatus(
      "Open a chat first.",
      "error"
    );

    return;
  }


  showStatus(
    "Uploading voice note...",
    ""
  );


  const path =
    currentUser.id +
    "/" +
    crypto.randomUUID() +
    ".webm";


  const {
    error:uploadError
  } =
    await supabaseClient
      .storage
      .from("chatroom-media")
      .upload(
        path,
        blob,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:"audio/webm"
        }
      );


  if(uploadError){

    showStatus(
      "Voice upload failed: " +
      uploadError.message,
      "error"
    );

    return;
  }


  const {
    data:urlData
  } =
    supabaseClient
      .storage
      .from("chatroom-media")
      .getPublicUrl(path);


  const {
    error:messageError
  } =
    await supabaseClient
      .from("chat_messages")
      .insert({

        sender_id:
          currentUser.id,

        receiver_id:
          currentFriend.id,

        message:"",

        message_type:"voice",

        media_url:
          urlData.publicUrl,

        media_name:
          "Voice note",

        media_type:
          "audio/webm"

      });


  if(messageError){

    showStatus(
      "Voice message failed: " +
      messageError.message,
      "error"
    );

    return;
  }


  showStatus(
    "Voice note sent.",
    "success"
  );


  await loadMessages();

}
