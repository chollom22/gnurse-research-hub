<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G Nurse Chat Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1f5f3;color:#111}
header{background:#07562f;color:white;padding:14px;text-align:center;font-size:20px;font-weight:bold}
main{max-width:600px;margin:auto;background:white;min-height:100vh}
section{display:none;padding:14px}.active{display:block}
input,button,textarea{width:100%;padding:12px;margin:5px 0;border:1px solid #ccc;border-radius:10px}
button{background:#07562f;color:white;border:0;font-weight:bold}
.small{font-size:13px;color:#666}.item{padding:12px;border-bottom:1px solid #eee}
.msg{padding:9px 12px;margin:6px 0;border-radius:14px;max-width:80%;background:#eee}
.mine{margin-left:auto;background:#d9f2df}
#messages{height:58vh;overflow:auto;padding:10px}
.chathead{display:flex;gap:8px;align-items:center}
.row{display:flex;gap:6px}.row button{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;max-width:600px;margin:auto}
nav button{border-radius:0;margin:0;background:white;color:#07562f}
a{color:#07562f}
img.chatpic{max-width:220px;border-radius:10px}
audio{max-width:220px}
</style>
</head>

<body>
<main>
<header>G Nurse Chat Room</header>

<section id="auth" class="active">
<h2>Login</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="username" placeholder="Username (for new account)">
<button onclick="login()">Login</button>
<button onclick="signup()">Create Account</button>
<p id="status" class="small"></p>
</section>

<section id="home">
<h3>My Profile</h3>
<input id="profileName" placeholder="Username">
<input id="bio" placeholder="Bio">
<button onclick="saveProfile()">Save Profile</button>

<h3>Find Friends</h3>
<input id="search" placeholder="Search username" oninput="searchUsers()">
<div id="searchResults"></div>

<h3>Friend Requests</h3>
<div id="requests"></div>

<h3>Friends</h3>
<div id="friends"></div>
</section>

<section id="chat">
<div class="chathead">
<button onclick="show('home')" style="width:70px">←</button>
<b id="chatName"></b>
</div>

<div id="messages"></div>

<div class="row">
<button onclick="pickPhoto()">🖼️</button>
<button onclick="pickFile()">📎</button>
<button onclick="recordVoice()" id="voiceBtn">🎤</button>
</div>

<div class="row">
<textarea id="message" rows="1" placeholder="Message..."></textarea>
<button onclick="sendText()" style="width:80px">➤</button>
</div>

<input id="photo" type="file" accept="image/*" hidden onchange="sendMedia(this,'image')">
<input id="file" type="file" hidden onchange="sendMedia(this,'file')">
</section>

<nav>
<button onclick="show('home');loadAll()">👥 Friends</button>
<button onclick="show('chat')">💬 Chat</button>
<button onclick="logout()">Logout</button>
</nav>
</main>

<script>
const SUPABASE_URL="https://bmiechymiyedubezhcq.supabase.co";
const SUPABASE_KEY="sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let me=null,friend=null,channel=null,recorder=null,chunks=[];

function show(id){
 document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}

async function login(){
 const email=emailEl().value.trim(),password=pass().value;
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error)return msg(error.message);
 me=data.user; await start();
}

async function signup(){
 const email=emailEl().value.trim(),password=pass().value;
 const username=document.getElementById("username").value.trim();
 if(!email||!password||!username)return msg("Complete all fields.");
 const {data,error}=await sb.auth.signUp({email,password});
 if(error)return msg(error.message);
 if(!data.user)return msg("Check your email to confirm your account.");
 me=data.user;
 if(data.session){
  await sb.from("profiles").upsert({
   id:me.id,username,email:me.email
  });
  await start();
 }else msg("Account created. Confirm your email, then login.");
}

function emailEl(){return document.getElementById("email")}
function pass(){return document.getElementById("password")}
function msg(x){document.getElementById("status").textContent=x}

async function start(){
 const {data}=await sb.from("profiles").select("*").eq("id",me.id).maybeSingle();
 if(!data){
  await sb.from("profiles").insert({
   id:me.id,username:me.email.split("@")[0],email:me.email
  });
 }
 await loadProfile();
 await loadAll();
 show("home");
 subscribe();
}

async function loadProfile(){
 const {data}=await sb.from("profiles").select("*").eq("id",me.id).single();
 if(data){
  profileName.value=data.username||"";
  bio.value=data.bio||"";
 }
}

async function saveProfile(){
 const {error}=await sb.from("profiles").update({
  username:profileName.value.trim(),bio:bio.value.trim(),
  is_online:true,last_seen:new Date().toISOString()
 }).eq("id",me.id);
 alert(error?error.message:"Profile saved");
}

async function searchUsers(){
 const q=document.getElementById("search").value.trim();
 if(!q)return searchResults.innerHTML="";
 const {data,error}=await sb.from("profiles")
 .select("id,username,bio")
 .ilike("username","%"+q+"%")
 .neq("id",me.id).limit(10);
 if(error)return searchResults.textContent=error.message;
 searchResults.innerHTML=data.map(u=>
 `<div class="item"><b>${esc(u.username)}</b><br>
 <span class="small">${esc(u.bio||"")}</span>
 <button onclick="requestFriend('${u.id}')">Add Friend</button></div>`
 ).join("");
}

async function requestFriend(id){
 const {error}=await sb.from("friend_requests").insert({
  sender_id:me.id,receiver_id:id,status:"pending"
 });
 alert(error?error.message:"Friend request sent");
}

async function loadAll(){
 await loadRequests();
 await loadFriends();
}

async function loadRequests(){
 const {data}=await sb.from("friend_requests")
 .select("*").eq("receiver_id",me.id).eq("status","pending");
 requests.innerHTML=(data||[]).map(r=>
 `<div class="item">Friend request
 <button onclick="accept('${r.id}')">Accept</button></div>`).join("");
}

async function accept(id){
 const {error}=await sb.from("friend_requests")
 .update({status:"accepted",updated_at:new Date().toISOString()})
 .eq("id",id);
 if(error)alert(error.message); else loadAll();
}

async function loadFriends(){
 const {data,error}=await sb.from("friend_requests")
 .select("*")
 .eq("status","accepted")
 .or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`);
 if(error)return friends.textContent=error.message;

 const ids=(data||[]).map(x=>x.sender_id===me.id?x.receiver_id:x.sender_id);
 if(!ids.length){friends.innerHTML="<p>No friends yet.</p>";return}

 const r=await sb.from("profiles").select("id,username,bio").in("id",ids);
 friends.innerHTML=(r.data||[]).map(u=>
 `<div class="item"><b>${esc(u.username)}</b>
 <button onclick="openChat('${u.id}','${esc(u.username)}')">Chat</button></div>`
 ).join("");
}

async function openChat(id,name){
 friend=id;chatName.textContent=name;
 show("chat");await loadMessages();subscribeChat();
}

async function loadMessages(){
 const {data,error}=await sb.from("chat_messages")
 .select("*")
 .or(`and(sender_id.eq.${me.id},receiver_id.eq.${friend}),and(sender_id.eq.${friend},receiver_id.eq.${me.id})`)
 .order("created_at",{ascending:true});
 if(error)return messages.textContent=error.message;
 messages.innerHTML="";
 (data||[]).forEach(draw);
 messages.scrollTop=messages.scrollHeight;
}

function draw(m){
 const box=document.createElement("div");
 box.className="msg "+(m.sender_id===me.id?"mine":"");
 if(m.message)box.innerHTML=esc(m.message);
 if(m.message_type==="voice"&&m.media_url)
  box.innerHTML+=`<br><audio controls src="${m.media_url}"></audio>`;
 if(m.media_url&&m.message_type==="text"){
  if((m.media_type||"").startsWith("image/"))
   box.innerHTML+=`<br><img class="chatpic" src="${m.media_url}">`;
  else box.innerHTML+=`<br><a href="${m.media_url}" target="_blank" download>📎 ${esc(m.media_name||"File")}</a>`;
 }
 messages.appendChild(box);
}

async function sendText(){
 const text=message.value.trim();
 if(!text||!friend)return;
 const {error}=await sb.from("chat_messages").insert({
  sender_id:me.id,receiver_id:friend,message:text,message_type:"text"
 });
 if(error)alert(error.message);else message.value="";
}

async function sendMedia(input,type){
 const f=input.files[0];if(!f||!friend)return;
 const path=`${me.id}/${crypto.randomUUID()}-${f.name}`;
 const up=await sb.storage.from("chatroom-media").upload(path,f,{
  upsert:false,contentType:f.type
 });
 if(up.error)return alert(up.error.message);

 const {data}=sb.storage.from("chatroom-media").getPublicUrl(path);
 const {error}=await sb.from("chat_messages").insert({
  sender_id:me.id,receiver_id:friend,
  message:type==="image"?"🖼️ Picture":"📎 File",
  message_type:"text",
  media_url:data.publicUrl,
  media_name:f.name,
  media_type:f.type
 });
 if(error)alert(error.message);
 input.value="";
}

function pickPhoto(){photo.click()}
function pickFile(){file.click()}

async function recordVoice(){
 if(recorder){
  recorder.stop();recorder=null;voiceBtn.textContent="🎤";return;
 }
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 chunks=[];recorder=new MediaRecorder(stream);
 recorder.ondataavailable=e=>chunks.push(e.data);
 recorder.onstop=async()=>{
  stream.getTracks().forEach(t=>t.stop());
  const blob=new Blob(chunks,{type:"audio/webm"});
  const path=`${me.id}/${crypto.randomUUID()}.webm`;
  const up=await sb.storage.from("chatroom-media").upload(path,blob,{
   upsert:false,contentType:"audio/webm"
  });
  if(up.error)return alert(up.error.message);
  const {data}=sb.storage.from("chatroom-media").getPublicUrl(path);
  await sb.from("chat_messages").insert({
   sender_id:me.id,receiver_id:friend,
   message_type:"voice",media_url:data.publicUrl,
   media_name:"voice-note.webm",media_type:"audio/webm"
  });
 };
 recorder.start();voiceBtn.textContent="⏹️";
}

function subscribe(){
 sb.channel("chatroom-global")
 .on("postgres_changes",{event:"*",schema:"public",table:"friend_requests"},()=>loadAll())
 .subscribe();
}

function subscribeChat(){
 if(channel)sb.removeChannel(channel);
 channel=sb.channel("chat-"+me.id+"-"+friend)
 .on("postgres_changes",{
  event:"INSERT",schema:"public",table:"chat_messages"
 },p=>{
  const m=p.new;
  if((m.sender_id===me.id&&m.receiver_id===friend)||
     (m.sender_id===friend&&m.receiver_id===me.id)){
   draw(m);messages.scrollTop=messages.scrollHeight;
  }
 }).subscribe();
}

async function logout(){
 await sb.auth.signOut();location.reload();
}

function esc(s){
 return String(s||"").replace(/[&<>"']/g,x=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#039;"
 }[x]));
}

(async()=>{
 const {data}=await sb.auth.getSession();
 if(data.session){me=data.session.user;await start();}
})();
</script>
</body>
    </html>
