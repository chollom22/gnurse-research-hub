<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>G Nurse Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#eef3f1;
    color:#17201d;
}

header{
    height:60px;
    background:#07562f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

header h2{
    margin:0;
    font-size:19px;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    cursor:pointer;
}

#login{
    max-width:380px;
    margin:70px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px #0002;
}

input,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd5d0;
    border-radius:7px;
    margin-bottom:10px;
    font:inherit;
}

#login button{
    width:100%;
    background:#07562f;
    color:white;
}

#error{
    color:#c62828;
    margin-top:10px;
}

#app{
    display:none;
    height:calc(100vh - 60px);
}

#conversations{
    width:32%;
    max-width:360px;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.conversation{
    padding:14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation:hover,
.conversation.active{
    background:#e8f3ed;
}

.name{
    font-weight:bold;
}

.small{
    font-size:12px;
    color:#65716c;
    margin-top:4px;
}

#chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

#visitor{
    background:white;
    padding:12px;
    border-bottom:1px solid #ddd;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg{
    max-width:78%;
    padding:10px 12px;
    border-radius:12px;
    margin-bottom:10px;
    word-wrap:break-word;
}

.visitor{
    background:white;
    margin-right:auto;
}

.admin{
    background:#d5efdf;
    margin-left:auto;
}

.time{
    font-size:10px;
    color:#69756f;
    margin-top:5px;
}

.msg img{
    max-width:240px;
    max-height:260px;
    display:block;
    border-radius:8px;
    margin-top:7px;
}

.msg a{
    display:block;
    margin-top:7px;
    color:#07562f;
    font-weight:bold;
}

#composer{
    background:white;
    border-top:1px solid #ddd;
    padding:10px;
    display:flex;
    gap:8px;
}

#reply{
    margin:0;
    resize:none;
    max-height:110px;
}

#send{
    background:#07562f;
    color:white;
    align-self:flex-end;
}

#empty{
    margin:auto;
    color:#68746f;
}

audio{
    max-width:100%;
    margin-top:7px;
}

@media(max-width:700px){

    #app{
        display:none;
        flex-direction:column;
    }

    #conversations{
        width:100%;
        max-width:none;
        height:38%;
        border-right:0;
        border-bottom:1px solid #ddd;
    }

    #chat{
        height:62%;
    }
}
</style>
</head>

<body>

<header>
    <h2>G Nurse Admin</h2>

    <button
        id="logout"
        style="display:none"
    >
        Logout
    </button>
</header>

<section id="login">

    <h2>Admin Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        Login
    </button>

    <div id="error"></div>

</section>

<div id="app">

    <aside id="conversations">

        <div style="padding:15px;font-weight:bold">
            Conversations
        </div>

        <div id="conversationList"></div>

    </aside>

    <main id="chat">

        <div id="visitor">
            Select a conversation
        </div>

        <div id="messages">

            <div id="empty">
                Select a visitor to view messages.
            </div>

        </div>

        <div id="composer">

            <textarea
                id="reply"
                rows="1"
                placeholder="Type your reply..."
            ></textarea>

            <button id="send">
                Send
            </button>

        </div>

    </main>

</div>

<script>

const SUPABASE_URL =
"https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentConversation = null;
let messageChannel = null;
let conversationChannel = null;

const loginBox =
document.getElementById("login");

const app =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logout");

const errorBox =
document.getElementById("error");

const conversationList =
document.getElementById("conversationList");

const messagesBox =
document.getElementById("messages");

const visitorBox =
document.getElementById("visitor");

const replyBox =
document.getElementById("reply");

const sendBtn =
document.getElementById("send");

function showError(message){

    errorBox.textContent = message;

}

async function login(){

    showError("");

    const email =
    document.getElementById("email")
    .value
    .trim();

    const password =
    document.getElementById("password")
    .value;

    if(!email || !password){

        showError(
            "Enter your email and password."
        );

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const {error} =
    await supabaseClient.auth
    .signInWithPassword({
        email,
        password
    });

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

    if(error){

        showError(error.message);
        return;
    }

    openAdmin();
}

async function openAdmin(){

    loginBox.style.display = "none";

    app.style.display = "flex";

    logoutBtn.style.display = "block";

    await loadConversations();

    subscribeConversations();
}
    async function loadConversations(){

    conversationList.innerHTML =
        "<div style='padding:15px'>Loading...</div>";

    const {data,error} =
        await supabaseClient
        .from("g_nurse_conversations")
        .select("*")
        .order("updated_at",{ascending:false});

    if(error){

        conversationList.innerHTML =
            "<div style='padding:15px;color:#c62828'>" +
            error.message +
            "</div>";

        return;
    }

    conversationList.innerHTML = "";

    if(!data || !data.length){

        conversationList.innerHTML =
            "<div style='padding:15px'>" +
            "No conversations yet." +
            "</div>";

        return;
    }

    data.forEach(c => {

        const div =
            document.createElement("div");

        div.className = "conversation";

        div.dataset.id = c.id;

        div.innerHTML =
            "<div class='name'>" +
            escapeHTML(
                c.visitor_name || "Visitor"
            ) +
            "</div>" +

            "<div class='small'>" +
            escapeHTML(
                c.visitor_email ||
                c.visitor_phone ||
                ""
            ) +
            "</div>" +

            "<div class='small'>" +
            escapeHTML(
                c.status || ""
            ) +
            "</div>";

        div.onclick = function(){

            openConversation(c);

        };

        conversationList.appendChild(div);

    });
}


async function openConversation(c){

    currentConversation = c;

    document
    .querySelectorAll(".conversation")
    .forEach(function(x){

        x.classList.remove("active");

    });

    const selected =
        document.querySelector(
            ".conversation[data-id='" +
            c.id +
            "']"
        );

    if(selected){

        selected.classList.add("active");

    }

    visitorBox.innerHTML =
        "<b>" +
        escapeHTML(
            c.visitor_name ||
            "Visitor"
        ) +
        "</b><br>" +

        escapeHTML(
            c.visitor_email || ""
        ) +

        (
            c.visitor_phone
            ? "<br>" +
              escapeHTML(
                  c.visitor_phone
              )
            : ""
        );

    await loadMessages();

    subscribeMessages();
}


async function loadMessages(){

    messagesBox.innerHTML = "";

    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .select("*")
        .eq(
            "conversation_id",
            currentConversation.id
        )
        .order(
            "created_at",
            {ascending:true}
        );

    if(error){

        messagesBox.innerHTML =
            "<div style='color:#c62828'>" +
            error.message +
            "</div>";

        return;
    }

    if(!data || !data.length){

        messagesBox.innerHTML =
            "<div id='empty'>" +
            "No messages yet." +
            "</div>";

        return;
    }

    data.forEach(function(message){

        addMessage(message);

    });

    scrollMessages();
}


function addMessage(message){

    const div =
        document.createElement("div");

    div.className =
        "msg " +
        (
            message.sender_type === "admin"
            ? "admin"
            : "visitor"
        );

    let html = "";

    if(message.message){

        html +=
            "<div>" +
            escapeHTML(
                message.message
            ) +
            "</div>";
    }

    if(message.attachment_url){

        const type =
            message.attachment_type || "";

        if(type.startsWith("image/")){

            html +=
                "<img src='" +
                escapeAttr(
                    message.attachment_url
                ) +
                "' alt='Attachment'>";

        }else{

            html +=
                "<a href='" +
                escapeAttr(
                    message.attachment_url
                ) +
                "' target='_blank' " +
                "rel='noopener'>" +

                "📎 " +

                escapeHTML(
                    message.attachment_name ||
                    "Open attachment"
                ) +

                "</a>";
        }
    }

    if(message.voice_url){

        html +=
            "<audio controls src='" +
            escapeAttr(
                message.voice_url
            ) +
            "'></audio>";
    }

    html +=
        "<div class='time'>" +
        new Date(
            message.created_at
        ).toLocaleString() +
        "</div>";

    div.innerHTML = html;

    messagesBox.appendChild(div);
}


async function sendReply(){

    if(!currentConversation){

        alert(
            "Select a conversation first."
        );

        return;
    }

    const text =
        replyBox.value.trim();

    if(!text){

        return;
    }

    sendBtn.disabled = true;

    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .insert({
            conversation_id:
                currentConversation.id,

            sender_type:
                "admin",

            message:
                text
        })
        .select("*")
        .single();

    sendBtn.disabled = false;

    if(error){

        alert(error.message);

        return;
    }

    replyBox.value = "";

    addMessage(data);

    scrollMessages();

    await supabaseClient
    .from("g_nurse_conversations")
    .update({
        updated_at:
            new Date().toISOString(),

        status:
            "open"
    })
    .eq(
        "id",
        currentConversation.id
    );

    if(currentConversation.visitor_user_id){

        await supabaseClient
        .from("g_nurse_notifications")
        .insert({

            recipient_user_id:
                currentConversation.visitor_user_id,

            conversation_id:
                currentConversation.id,

            message_id:
                data.id,

            notification_type:
                "message",

            title:
                "New message from G Nurse",

            body:
                text,

            is_read:
                false
        });
    }
    }
    function subscribeMessages(){

    if(messageChannel){

        supabaseClient
        .removeChannel(messageChannel);
    }

    messageChannel =
        supabaseClient
        .channel(
            "admin-messages-" +
            currentConversation.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"g_nurse_messages",
                filter:
                    "conversation_id=eq." +
                    currentConversation.id
            },
            function(payload){

                if(
                    payload.new.sender_type !==
                    "admin"
                ){

                    addMessage(
                        payload.new
                    );

                    scrollMessages();
                }
            }
        )
        .subscribe();
}


function subscribeConversations(){

    if(conversationChannel){

        supabaseClient
        .removeChannel(
            conversationChannel
        );
    }

    conversationChannel =
        supabaseClient
        .channel(
            "admin-conversations"
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"g_nurse_conversations"
            },
            function(){

                loadConversations();
            }
        )
        .subscribe();
}


function scrollMessages(){

    messagesBox.scrollTop =
        messagesBox.scrollHeight;
}


function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function escapeAttr(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


loginBtn.onclick = function(){

    login();
};


sendBtn.onclick = function(){

    sendReply();
};


replyBox.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendReply();
        }
    }
);


logoutBtn.onclick = async function(){

    await supabaseClient
    .auth
    .signOut();

    if(messageChannel){

        await supabaseClient
        .removeChannel(
            messageChannel
        );
    }

    if(conversationChannel){

        await supabaseClient
        .removeChannel(
            conversationChannel
        );
    }

    currentConversation = null;

    app.style.display = "none";

    logoutBtn.style.display = "none";

    loginBox.style.display = "block";

};


(async function(){

    const {data} =
        await supabaseClient
        .auth
        .getSession();

    if(data.session){

        openAdmin();
    }

})();

</script>

</body>
</html>
