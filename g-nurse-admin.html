<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>G Nurse Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f8;
    color:#222;
}

header{
    height:60px;
    background:#07562f;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

header h2{
    margin:0;
    font-size:19px;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
    font-size:14px;
}

#logout{
    background:white;
    color:#07562f;
}

#login{
    width:min(420px,92%);
    margin:60px auto;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

#login h2{
    margin-top:0;
    color:#07562f;
}

#login input{
    width:100%;
    padding:13px;
    margin:7px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

#loginBtn{
    width:100%;
    margin-top:10px;
    background:#07562f;
    color:white;
}

#error{
    color:#c62828;
    margin-top:12px;
    font-size:14px;
}

#app{
    display:none;
    height:calc(100vh - 60px);
}

#conversations{
    width:300px;
    background:white;
    border-right:1px solid #ddd;
    overflow-y:auto;
}

.conversation{
    padding:14px;
    border-bottom:1px solid #eee;
    cursor:pointer;
}

.conversation:hover,
.conversation.active{
    background:#e8f5ee;
}

.name{
    font-weight:bold;
}

.small{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

#chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

#visitor{
    background:white;
    border-bottom:1px solid #ddd;
    padding:12px 15px;
    min-height:65px;
}

#messages{
    flex:1;
    overflow-y:auto;
    padding:15px;
}

.msg{
    max-width:75%;
    padding:10px;
    margin:8px 0;
    border-radius:12px;
    word-wrap:break-word;
}

.msg.visitor{
    background:white;
    margin-right:auto;
}

.msg.gnurse{
    background:#d9f3e3;
    margin-left:auto;
}

.msg img{
    display:block;
    max-width:280px;
    max-height:280px;
    margin-top:7px;
    border-radius:8px;
    cursor:pointer;
}

.msg a{
    display:block;
    margin-top:7px;
    color:#07562f;
    word-break:break-word;
}

.msg audio{
    width:240px;
    max-width:100%;
    margin-top:7px;
}

.time{
    font-size:10px;
    color:#777;
    margin-top:6px;
}

#composer{
    background:white;
    border-top:1px solid #ddd;
    padding:10px;
    display:flex;
    align-items:flex-end;
    gap:7px;
}

#reply{
    flex:1;
    min-width:0;
    min-height:42px;
    max-height:120px;
    resize:none;
    overflow-y:auto;
    padding:11px;
    border:1px solid #ccc;
    border-radius:10px;
    font-family:Arial,sans-serif;
    font-size:14px;
}

.iconBtn{
    width:43px;
    height:43px;
    padding:0;
    border-radius:50%;
    background:#e9f1ec;
    color:#07562f;
    font-size:20px;
}

#voiceBtn.recording{
    background:#c62828;
    color:white;
}

#send{
    background:#07562f;
    color:white;
    height:43px;
}

@media(max-width:700px){

    #conversations{
        width:110px;
    }

    .conversation{
        padding:10px;
    }

    .msg{
        max-width:88%;
    }

    .msg img{
        max-width:220px;
    }

    #composer{
        gap:4px;
        padding:7px;
    }

    .iconBtn{
        width:38px;
        height:38px;
        font-size:17px;
    }

    #send{
        height:38px;
        padding:8px;
    }
}

</style>
</head>

<body>

<header>

    <h2>G Nurse Admin</h2>

    <button id="logout" style="display:none">
        Logout
    </button>

</header>


<section id="login">

    <h2>Admin Login</h2>

    <input
        id="email"
        type="email"
        placeholder="Admin email"
        autocomplete="email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        Login
    </button>

    <div id="error"></div>

</section>


<div id="app">

    <aside id="conversations">

        <div style="padding:15px;font-weight:bold">
            Conversations
        </div>

        <div id="conversationList"></div>

    </aside>


    <main id="chat">

        <div id="visitor">
            Select a conversation
        </div>


        <div id="messages">

            <div id="empty">
                Select a visitor to view messages.
            </div>

        </div>


        <div id="composer">

            <textarea
                id="reply"
                rows="1"
                placeholder="Type your reply..."
            ></textarea>


            <button
                id="fileBtn"
                class="iconBtn"
                title="Send file"
            >
                📎
            </button>


            <button
                id="imageBtn"
                class="iconBtn"
                title="Send image"
            >
                🖼️
            </button>


            <button
                id="voiceBtn"
                class="iconBtn"
                title="Record voice note"
            >
                🎤
            </button>


            <button id="send">
                Send
            </button>

        </div>

    </main>

</div>


<input
    id="fileInput"
    type="file"
    style="display:none"
>

<input
    id="imageInput"
    type="file"
    accept="image/*"
    style="display:none"
>


<script>

const SUPABASE_URL =
"https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentConversation = null;

let messageChannel = null;

let conversationChannel = null;

let mediaRecorder = null;

let voiceChunks = [];

let isRecording = false;


const loginBox =
document.getElementById("login");

const app =
document.getElementById("app");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logout");

const errorBox =
document.getElementById("error");

const conversationList =
document.getElementById("conversationList");

const messagesBox =
document.getElementById("messages");

const visitorBox =
document.getElementById("visitor");

const replyBox =
document.getElementById("reply");

const sendBtn =
document.getElementById("send");

const fileBtn =
document.getElementById("fileBtn");

const imageBtn =
document.getElementById("imageBtn");

const voiceBtn =
document.getElementById("voiceBtn");

const fileInput =
document.getElementById("fileInput");

const imageInput =
document.getElementById("imageInput");


function showError(message){

    errorBox.textContent = message;

}


async function login(){

    showError("");

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;


    if(!email || !password){

        showError(
            "Enter your email and password."
        );

        return;
    }


    loginBtn.disabled = true;

    loginBtn.textContent =
        "Logging in...";


    const {error} =
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });


    loginBtn.disabled = false;

    loginBtn.textContent =
        "Login";


    if(error){

        showError(error.message);

        return;
    }


    await openAdmin();

}


async function openAdmin(){

    loginBox.style.display =
        "none";

    app.style.display =
        "flex";

    logoutBtn.style.display =
        "block";


    await loadConversations();

    subscribeConversations();

}
    
async function loadConversations(){

    conversationList.innerHTML =
        "<div style='padding:15px'>Loading...</div>";


    const {data,error} =
        await supabaseClient
        .from("g_nurse_conversations")
        .select("*")
        .order(
            "updated_at",
            {ascending:false}
        );


    if(error){

        conversationList.innerHTML =
            "<div style='padding:15px;color:#c62828'>" +
            escapeHTML(error.message) +
            "</div>";

        return;
    }


    conversationList.innerHTML = "";


    if(!data || !data.length){

        conversationList.innerHTML =
            "<div style='padding:15px'>" +
            "No conversations yet." +
            "</div>";

        return;
    }


    data.forEach(function(c){

        const div =
            document.createElement("div");

        div.className =
            "conversation";

        div.dataset.id =
            c.id;


        div.innerHTML =
            "<div class='name'>" +
            escapeHTML(
                c.visitor_name || "Visitor"
            ) +
            "</div>" +

            "<div class='small'>" +
            escapeHTML(
                c.visitor_email ||
                c.visitor_phone ||
                ""
            ) +
            "</div>" +

            "<div class='small'>" +
            escapeHTML(
                c.status || ""
            ) +
            "</div>";


        div.onclick =
            function(){

                openConversation(c);

            };


        conversationList.appendChild(div);

    });

}


async function openConversation(c){

    currentConversation = c;


    document
    .querySelectorAll(".conversation")
    .forEach(function(x){

        x.classList.remove("active");

    });


    const selected =
        document.querySelector(
            ".conversation[data-id='" +
            c.id +
            "']"
        );


    if(selected){

        selected.classList.add("active");

    }


    visitorBox.innerHTML =
        "<b>" +
        escapeHTML(
            c.visitor_name ||
            "Visitor"
        ) +
        "</b><br>" +

        escapeHTML(
            c.visitor_email || ""
        ) +

        (
            c.visitor_phone
            ?
            "<br>" +
            escapeHTML(c.visitor_phone)
            :
            ""
        );


    await loadMessages();

    subscribeMessages();

}


async function loadMessages(){

    messagesBox.innerHTML = "";


    if(!currentConversation){

        return;

    }


    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .select("*")
        .eq(
            "conversation_id",
            currentConversation.id
        )
        .order(
            "created_at",
            {ascending:true}
        );


    if(error){

        messagesBox.innerHTML =
            "<div style='color:#c62828'>" +
            escapeHTML(error.message) +
            "</div>";

        return;
    }


    if(!data || !data.length){

        messagesBox.innerHTML =
            "<div id='empty'>" +
            "No messages yet." +
            "</div>";

        return;
    }


    data.forEach(function(message){

        addMessage(message);

    });


    scrollMessages();

}


function addMessage(message){

    const div =
        document.createElement("div");


    div.className =
        "msg " +
        (
            message.sender_type === "gnurse"
            ?
            "gnurse"
            :
            "visitor"
        );


    let html = "";


    if(message.message){

        html +=
            "<div>" +
            escapeHTML(message.message) +
            "</div>";

    }


    if(message.attachment_url){

        const type =
            message.attachment_type || "";


        if(type.startsWith("image/")){

            html +=
                "<img src='" +
                escapeAttr(
                    message.attachment_url
                ) +
                "' " +
                "alt='Image attachment' " +
                "onclick=\"openImage(this.src)\">";

        }else{

            html +=
                "<a href='" +
                escapeAttr(
                    message.attachment_url
                ) +
                "' " +
                "target='_blank' " +
                "rel='noopener'>" +

                "📎 " +

                escapeHTML(
                    message.attachment_name ||
                    "Open attachment"
                ) +

                "</a>";

        }

    }


    if(message.voice_url){

        html +=
            "<audio controls src='" +
            escapeAttr(
                message.voice_url
            ) +
            "'></audio>";

    }


    html +=
        "<div class='time'>" +
        new Date(
            message.created_at
        ).toLocaleString() +
        "</div>";


    div.innerHTML = html;

    messagesBox.appendChild(div);

}


async function sendReply(){

    if(!currentConversation){

        alert(
            "Select a conversation first."
        );

        return;
    }


    const text =
        replyBox.value.trim();


    if(!text){

        return;

    }


    sendBtn.disabled = true;


    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .insert({

            conversation_id:
                currentConversation.id,

            sender_type:
                "gnurse",

            message:
                text

        })
        .select("*")
        .single();


    sendBtn.disabled = false;


    if(error){

        alert(error.message);

        return;
    }


    replyBox.value = "";


    addMessage(data);

    scrollMessages();


    await updateConversation();


    await sendVisitorNotification(
        data.id,
        text
    );

}


async function updateConversation(){

    if(!currentConversation){

        return;
    }


    await supabaseClient
    .from("g_nurse_conversations")
    .update({

        updated_at:
            new Date().toISOString(),

        status:
            "open"

    })
    .eq(
        "id",
        currentConversation.id
    );

}


async function sendVisitorNotification(
    messageId,
    body
){

    if(!currentConversation){

        return;
    }


    if(!currentConversation.visitor_user_id){

        return;
    }


    await supabaseClient
    .from("g_nurse_notifications")
    .insert({

        recipient_user_id:
            currentConversation.visitor_user_id,

        conversation_id:
            currentConversation.id,

        message_id:
            messageId,

        notification_type:
            "message",

        title:
            "New message from G Nurse",

        body:
            body,

        is_read:
            false

    });

}


async function uploadAdminFile(file){

    if(!currentConversation){

        alert(
            "Select a conversation first."
        );

        return;
    }


    if(!file){

        return;
    }


    const fileName =
        Date.now() +
        "_" +
        file.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


    const path =
        "admin/" +
        currentConversation.id +
        "/" +
        fileName;


    fileBtn.disabled = true;

    imageBtn.disabled = true;


    const {error:uploadError} =
        await supabaseClient
        .storage
        .from("g-nurse-files")
        .upload(
            path,
            file,
            {
                contentType:
                    file.type ||
                    "application/octet-stream",

                upsert:false
            }
        );


    if(uploadError){

        fileBtn.disabled = false;

        imageBtn.disabled = false;

        alert(uploadError.message);

        return;
    }


    const {data:urlData,error:urlError} =
        await supabaseClient
        .storage
        .from("g-nurse-files")
        .createSignedUrl(
            path,
            60 * 60 * 24
        );


    if(urlError){

        fileBtn.disabled = false;

        imageBtn.disabled = false;

        alert(urlError.message);

        return;
    }


    const fileUrl =
        urlData.signedUrl;


    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .insert({

            conversation_id:
                currentConversation.id,

            sender_type:
                "gnurse",

            message:
                "",

            attachment_url:
                fileUrl,

            attachment_name:
                file.name,

            attachment_type:
                file.type ||
                "application/octet-stream"

        })
        .select("*")
        .single();


    fileBtn.disabled = false;

    imageBtn.disabled = false;


    if(error){

        alert(error.message);

        return;
    }


    addMessage(data);

    scrollMessages();


    await updateConversation();


    await sendVisitorNotification(
        data.id,
        "G Nurse sent you a file."
    );

    }
    
async function startVoiceRecording(){

    if(!currentConversation){

        alert(
            "Select a conversation first."
        );

        return;
    }


    if(isRecording){

        stopVoiceRecording();

        return;
    }


    try{

        const stream =
            await navigator
            .mediaDevices
            .getUserMedia({
                audio:true
            });


        voiceChunks = [];


        mediaRecorder =
            new MediaRecorder(stream);


        mediaRecorder.ondataavailable =
            function(event){

                if(event.data.size > 0){

                    voiceChunks.push(
                        event.data
                    );

                }

            };


        mediaRecorder.onstop =
            async function(){

                stream
                .getTracks()
                .forEach(function(track){

                    track.stop();

                });


                const audioBlob =
                    new Blob(
                        voiceChunks,
                        {
                            type:
                                "audio/webm"
                        }
                    );


                await uploadVoice(
                    audioBlob
                );

            };


        mediaRecorder.start();

        isRecording = true;

        voiceBtn.classList.add(
            "recording"
        );

        voiceBtn.textContent =
            "⏹️";

        voiceBtn.title =
            "Stop recording";


    }catch(error){

        alert(
            "Microphone access failed: " +
            error.message
        );

    }

}


function stopVoiceRecording(){

    if(
        mediaRecorder &&
        isRecording
    ){

        mediaRecorder.stop();

        isRecording = false;

        voiceBtn.classList.remove(
            "recording"
        );

        voiceBtn.textContent =
            "🎤";

        voiceBtn.title =
            "Record voice note";

    }

}


async function uploadVoice(audioBlob){

    if(!currentConversation){

        return;

    }


    const fileName =
        "voice_" +
        Date.now() +
        ".webm";


    const path =
        "admin/" +
        currentConversation.id +
        "/" +
        fileName;


    voiceBtn.disabled = true;


    const {error:uploadError} =
        await supabaseClient
        .storage
        .from("g-nurse-files")
        .upload(
            path,
            audioBlob,
            {
                contentType:
                    "audio/webm",

                upsert:false
            }
        );


    if(uploadError){

        voiceBtn.disabled = false;

        alert(uploadError.message);

        return;
    }


    const {data:urlData,error:urlError} =
        await supabaseClient
        .storage
        .from("g-nurse-files")
        .createSignedUrl(
            path,
            60 * 60 * 24
        );


    if(urlError){

        voiceBtn.disabled = false;

        alert(urlError.message);

        return;
    }


    const voiceUrl =
        urlData.signedUrl;


    const {data,error} =
        await supabaseClient
        .from("g_nurse_messages")
        .insert({

            conversation_id:
                currentConversation.id,

            sender_type:
                "gnurse",

            message:
                "",

            voice_url:
                voiceUrl

        })
        .select("*")
        .single();


    voiceBtn.disabled = false;


    if(error){

        alert(error.message);

        return;
    }


    addMessage(data);

    scrollMessages();


    await updateConversation();


    await sendVisitorNotification(
        data.id,
        "G Nurse sent you a voice note."
    );

}


function subscribeMessages(){

    if(messageChannel){

        supabaseClient
        .removeChannel(
            messageChannel
        );

    }


    if(!currentConversation){

        return;

    }


    messageChannel =
        supabaseClient
        .channel(
            "admin-messages-" +
            currentConversation.id
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"g_nurse_messages",

                filter:
                    "conversation_id=eq." +
                    currentConversation.id
            },

            function(payload){

                if(
                    payload.new.sender_type !==
                    "gnurse"
                ){

                    addMessage(
                        payload.new
                    );

                    scrollMessages();

                }

            }
        )
        .subscribe();

}


function subscribeConversations(){

    if(conversationChannel){

        supabaseClient
        .removeChannel(
            conversationChannel
        );

    }


    conversationChannel =
        supabaseClient
        .channel(
            "admin-conversations"
        )
        .on(
            "postgres_changes",
            {
                event:"*",
                schema:"public",
                table:"g_nurse_conversations"
            },

            function(){

                loadConversations();

            }
        )
        .subscribe();

}


function scrollMessages(){

    messagesBox.scrollTop =
        messagesBox.scrollHeight;

}


function openImage(url){

    const win =
        window.open(
            "",
            "_blank"
        );


    if(!win){

        alert(
            "Please allow pop-ups to view the image."
        );

        return;
    }


    win.document.write(
        "<title>G Nurse Image</title>" +
        "<body style='margin:0;background:#000;" +
        "display:flex;align-items:center;" +
        "justify-content:center'>" +
        "<img src='" +
        escapeAttr(url) +
        "' style='max-width:100%;max-height:100vh'>" +
        "</body>"
    );

}


function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* TEXT */

loginBtn.onclick =
    function(){

        login();

    };


sendBtn.onclick =
    function(){

        sendReply();

    };


replyBox.addEventListener(
    "keydown",
    function(e){

        if(
            e.key === "Enter" &&
            !e.shiftKey
        ){

            e.preventDefault();

            sendReply();

        }

    }
);


/* FILE */

fileBtn.onclick =
    function(){

        fileInput.click();

    };


fileInput.onchange =
    async function(){

        const file =
            fileInput.files[0];


        if(file){

            await uploadAdminFile(
                file
            );

        }


        fileInput.value = "";

    };


/* IMAGE */

imageBtn.onclick =
    function(){

        imageInput.click();

    };


imageInput.onchange =
    async function(){

        const file =
            imageInput.files[0];


        if(file){

            await uploadAdminFile(
                file
            );

        }


        imageInput.value = "";

    };


/* VOICE */

voiceBtn.onclick =
    function(){

        startVoiceRecording();

    };


/* LOGOUT */

logoutBtn.onclick =
    async function(){

        if(messageChannel){

            await supabaseClient
            .removeChannel(
                messageChannel
            );

        }


        if(conversationChannel){

            await supabaseClient
            .removeChannel(
                conversationChannel
            );

        }


        await supabaseClient
        .auth
        .signOut();


        currentConversation = null;

        app.style.display =
            "none";

        logoutBtn.style.display =
            "none";

        loginBox.style.display =
            "block";

    };


/* RESTORE SESSION */

(async function(){

    const {data} =
        await supabaseClient
        .auth
        .getSession();


    if(
        data &&
        data.session
    ){

        await openAdmin();

    }

})();

</script>
