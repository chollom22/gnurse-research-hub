<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Video Upload | G Nurse Research Hub Nigeria</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #0b5ed7;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 7px;
      background: #0b5ed7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .info {
      background: #cff4fc;
      color: #055160;
    }

    .logout {
      background: #dc3545;
    }

    .password-box {
      background: #eef5ff;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .password-box h2 {
      color: #0b5ed7;
      text-align: center;
      margin-bottom: 10px;
      font-size: 21px;
    }

    .password-box p {
      text-align: center;
      color: #555;
      line-height: 1.5;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Admin Video Upload</h1>

  <p class="subtitle">
    G Nurse Research Hub Nigeria
  </p>


  <!-- ==============================
       PASSWORD UPDATE SECTION
  =============================== -->

  <div id="passwordUpdateSection" class="hidden">

    <div class="password-box">

      <h2>🔑 Set New Password</h2>

      <p>
        Enter a new password for your admin account.
      </p>

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
      >

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
      >

      <button
        type="button"
        id="updatePasswordButton"
        onclick="updatePassword()"
      >
        🔒 Update Password
      </button>

    </div>

  </div>

       LOGIN SECTION
