<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | G Nurse Research Hub Nigeria</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #0b5ed7;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    h2 {
      color: #0b5ed7;
      margin: 25px 0 15px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 18px;
      border: none;
      border-radius: 7px;
      background: #0b5ed7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .logout {
      background: #dc3545;
    }

    .hidden {
      display: none;
    }

    #status {
      margin-top: 20px;
      padding: 12px;
      border-radius: 7px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .info {
      background: #cff4fc;
      color: #055160;
    }

    .box {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin-top: 20px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b5ed7;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🔐 Admin Dashboard</h1>

  <p class="subtitle">
    G Nurse Research Hub Nigeria
  </p>

  <!-- LOGIN -->

  <div id="loginSection">

    <label for="email">Admin Email</label>

    <input
      type="email"
      id="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >

    <label for="password">Admin Password</label>

    <input
      type="password"
      id="password"
      placeholder="Enter admin password"
      autocomplete="current-password"
    >

    <button type="button" onclick="login()">
      🔐 Admin Login
    </button>

    <button type="button" onclick="resetPassword()">
      🔄 Forgot Password?
    </button>

  </div>


  <!-- PASSWORD UPDATE -->

  <div id="passwordSection" class="hidden">

    <div class="box">

      <h2>🔑 Create New Password</h2>

      <label for="newPassword">
        New Password
      </label>

      <input
        type="password"
        id="newPassword"
        placeholder="Enter new password"
        autocomplete="new-password"
      >

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
        autocomplete="new-password"
      >

      <button type="button" onclick="updatePassword()">
        🔒 Update Password
      </button>

    </div>

  </div>


  <!-- ADMIN DASHBOARD -->

  <div id="dashboardSection" class="hidden">

    <p>
      ✅ You are logged in as administrator.
    </p>


    <!-- PDF UPLOAD -->

    <div class="box">

      <h2>📚 Upload PDF Resource</h2>

      <label for="subject">
        Subject
      </label>

      <select id="subject">

        <option value="">
          -- Select Subject --
        </option>

        <option>Physics</option>
        <option>Chemistry</option>
        <option>Biology</option>
        <option>Mathematics</option>
        <option>Statistics</option>
        <option>Microbiology</option>
        <option>Parasitology</option>
        <option>Histopathology</option>
        <option>Medical Surgical Nursing</option>
        <option>Community Health Nursing</option>
        <option>Environmental Health</option>
        <option>Sociology as Applied to Nursing</option>
        <option>Maternal and Child Health</option>
        <option>Anatomy</option>
        <option>Biochemistry</option>
        <option>Physiology</option>
        <option>Epidemiology</option>
        <option>Nursing Research</option>
        <option>Nursing Diagnosis</option>
        <option>Pharmacology</option>
        <option>Computer Science</option>
        <option>Biostatistics</option>

      </select>


      <label for="title">
        PDF Title
      </label>

      <input
        type="text"
        id="title"
        placeholder="Example: Anatomy of the Heart"
      >


      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Brief description of this material"
      ></textarea>


      <label for="pdfFile">
        Select PDF
      </label>

      <input
        type="file"
        id="pdfFile"
        accept="application/pdf,.pdf"
      >


      <button
        type="button"
        id="pdfButton"
        onclick="uploadPDF()"
      >
        ☁️ Upload PDF
      </button>

    </div>


    <!-- VIDEO UPLOAD -->

    <div class="box">

      <h2>🎥 Upload Educational Video</h2>

      <label for="videoFile">
        Select Video
      </label>

      <input
        type="file"
        id="videoFile"
        accept="video/*"
      >

      <button
        type="button"
        id="videoButton"
        onclick="uploadVideo()"
      >
        ⬆️ Upload Video
      </button>

    </div>


    <button
      type="button"
      class="logout"
      onclick="logout()"
    >
      🚪 Logout
    </button>

  </div>


  <div id="status" class="hidden"></div>


  <a href="index.html" class="back">
    ← Back to Home
  </a>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://bmiechymiyedubezhcqk.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_9JL2ALhTGlZV57hUV0mTdQ_c2hdT8O8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD_NAME =
  "s6i5i9w5";

const CLOUDINARY_UPLOAD_PRESET =
  "gnurse_resources";


/* =========================
   STATUS
========================= */

function showStatus(message, type) {

  const status =
    document.getElementById("status");

  status.textContent = message;

  status.className = "";

  status.classList.remove("hidden");

  if (type) {
    status.classList.add(type);
  }

}


/* =========================
   LOGIN
========================= */

async function login() {

  const email =
    document.getElementById("email")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value;

  if (!email || !password) {

    showStatus(
      "Please enter your email and password.",
      "error"
    );

    return;
  }

  showStatus(
    "Logging in...",
    "info"
  );

  try {

    const { data, error } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,
          password: password

        });

    if (error) {

      showStatus(
        "Login failed: " + error.message,
        "error"
      );

      return;
    }

    if (!data.user) {

      showStatus(
        "Login failed. No account found.",
        "error"
      );

      return;
    }

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("passwordSection")
      .classList.add("hidden");

    document
      .getElementById("dashboardSection")
      .classList.remove("hidden");

    showStatus(
      "✅ Login successful.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "Login error: " + error.message,
      "error"
    );

  }

}


/* =========================
   PASSWORD RESET
========================= */

async function resetPassword() {

  const email =
    document.getElementById("email")
      .value
      .trim();

  if (!email) {

    showStatus(
      "Please enter your admin email first.",
      "error"
    );

    return;
  }

  showStatus(
    "Sending password reset link...",
    "info"
  );

  try {

    const { error } =
      await supabaseClient.auth
        .resetPasswordForEmail(

          email,

          {
            redirectTo:
              "https://gnurseresearchhub.name.ng/admin.html"
          }

        );

    if (error) {

      showStatus(
        "Reset failed: " + error.message,
        "error"
      );

      return;
    }

    showStatus(
      "✅ Reset link sent. Check your email and Spam/Junk folder.",
      "success"
    );

  }

  catch (error) {

    showStatus(
      "Reset error: " + error.message,
      "error"
    );

  }

}


/* =========================
   PASSWORD RECOVERY
========================= */

supabaseClient.auth.onAuthStateChange(
  async (event, session) => {

    if (event === "PASSWORD_RECOVERY") {

      document
        .getElementById("loginSection")
        .classList.add("hidden");

      document
        .getElementById("dashboardSection")
        .classList.add("hidden");

      document
        .getElementById("passwordSection")
        .classList.remove("hidden");

      showStatus(
        "🔑 Enter your new password.",
        "info"
      );

    }

  }
);


/* =========================
   UPDATE PASSWORD
========================= */

async function updatePassword() {

  const newPassword =
    document.getElementById("newPassword")
      .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
      .value;

  if (!newPassword || !confirmPassword) {

    showStatus(
      "Please enter and confirm your new password.",
      "error"
    );

    return;
  }

  if (newPassword.length < 6) {

    showStatus(
      "Password must contain at least 6 characters.",
      "error"
    );

    return;
  }

  if (newPassword !== confirmPassword) {

    showStatus(
      "Passwords do not match.",
      "error"
    );

    return;
  }

  try {

    const { error } =
      await supabaseClient.auth
        .updateUser({

          password: newPassword

        });

    if (error) {

      showStatus(
        "Password update failed: " +
        error.message,
        "error"
      );

      return;
    }

    showStatus(
      "✅ Password updated successfully.",
      "success"
    );

    await supabaseClient.auth.signOut();

    document
      .getElementById("passwordSection")
      .classList.add("hidden");

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document.getElementById("newPassword").value = "";
    document.getElementById("confirmPassword").value = "";

  }

  catch (error) {

    showStatus(
      "Password update error: " +
      error.message,
      "error"
    );

  }

}


/* =========================
   CLOUDINARY UPLOAD
========================= */

async function uploadToCloudinary(file) {

  const url =
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`;

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    CLOUDINARY_UPLOAD_PRESET
  );

  const response =
    await fetch(
      url,
      {
        method: "POST",
        body: formData
      }
    );

  const data =
    await response.json();

  if (!response.ok) {

    throw new Error(
      data.error?.message ||
      "Cloudinary upload failed."
    );

  }

  return data.secure_url;

}


/* =========================
   UPLOAD PDF
========================= */

async function uploadPDF() {

  const subject =
    document.getElementById("subject")
      .value;

  const title =
    document.getElementById("title")
      .value
      .trim();

  const description =
    document.getElementById("description")
      .value
      .trim();

  const file =
    document.getElementById("pdfFile")
      .files[0];

  if (!subject) {

    showStatus(
      "Please select a subject.",
      "error"
    );

    return;
  }

  if (!title) {

    showStatus(
      "Please enter the PDF title.",
      "error"
    );

    return;
  }

  if (!file) {

    showStatus(
      "Please select a PDF.",
      "error"
    );

    return;
  }

  if (
    file.type !== "application/pdf" &&
    !file.name.toLowerCase().endsWith(".pdf")
  ) {

    showStatus(
      "Only PDF files are allowed.",
      "error"
    );

    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {

    showStatus(
      "You must be logged in.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("pdfButton");

  button.disabled = true;

  button.textContent =
    "☁️ Uploading PDF...";

  try {

    const fileURL =
      await uploadToCloudinary(file);

    button.textContent =
      "🗄️ Saving resource...";

    const { error } =
      await supabaseClient
        .from("resource_materials")
        .insert({

          title: title,
          subject: subject,
          description:
            description || null,
          file_url: fileURL

        });

    if (error) {

      throw new Error(
        "PDF uploaded, but database save failed: " +
        error.message
      );

    }

    showStatus(
      "✅ PDF uploaded successfully.",
      "success"
    );

    document.getElementById("subject").value = "";
    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("pdfFile").value = "";

  }

  catch (error) {

    showStatus(
      "❌ PDF upload failed: " +
      error.message,
      "error"
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "☁️ Upload PDF";

  }

}


/* =========================
   UPLOAD VIDEO
========================= */

async function uploadVideo() {

  const file =
    document.getElementById("videoFile")
      .files[0];

  if (!file) {

    showStatus(
      "Please select a video.",
      "error"
    );

    return;
  }

  const {
    data: { user }
  } =
    await supabaseClient.auth.getUser();

  if (!user) {

    showStatus(
      "You must be logged in.",
      "error"
    );

    return;
  }

  const button =
    document.getElementById("videoButton");

  button.disabled = true;

  button.textContent =
    "☁️ Uploading video...";

  try {

    const videoURL =
      await uploadToCloudinary(file);

    showStatus(
      "✅ Video uploaded successfully!\n" +
      videoURL,
      "success"
    );

    document
      .getElementById("videoFile")
      .value = "";

  }

  catch (error) {

    showStatus(
      "❌ Video upload failed: " +
      error.message,
      "error"
    );

  }

  finally {

    button.disabled = false;

    button.textContent =
      "⬆️ Upload Video";

  }

}


/* =========================
   LOGOUT
========================= */

async function logout() {

  await supabaseClient.auth.signOut();

  document
    .getElementById("dashboardSection")
    .classList.add("hidden");

  document
    .getElementById("passwordSection")
    .classList.add("hidden");

  document
    .getElementById("loginSection")
    .classList.remove("hidden");

  showStatus(
    "You have been logged out.",
    "info"
  );

}

</script>

</body>
  </html>
